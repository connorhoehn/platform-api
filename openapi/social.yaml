# openapi/social.yaml
#
# OpenAPI 3.1 spec for the social surface of platform-api.
#
# Coverage status (per hub#1009 option B + blocker #33 re-shape):
#   - /profiles/*       full schemas  (hub#1103)
#   - /social/*         full schemas  (hub#1103)
#   - /groups           full schemas  (hub#1104)
#   - /groups/{id}/*    full schemas  (hub#1105)
#   - /rooms/*          full schemas  (hub#1106)
#   - /activity         full schemas  (hub#1106)
#   - /posts + nested   full schemas  (hub#1107)
#
# Path inventory is regenerated by `node scripts/openapi-coverage-lint.js`
# — adding a route under the social mount without updating this file will
# fail the lint.
#
# Authoritative source for /profiles/* + /social/* shapes:
#   src/routes/profiles.ts
#   src/routes/social.ts
#   src/repositories/ProfileRepository.ts (ProfileItem interface)
#
# Authoritative source for /groups (CRUD) shapes:
#   src/routes/groups.ts
#   src/repositories/GroupRepository.ts (GroupItem + GroupMemberItem interfaces)

openapi: 3.1.0

info:
  title: platform-api Social HTTP API
  description: |
    HTTP surface for profiles, the follow graph, groups, chat rooms,
    posts, comments, likes, reactions, and the activity feed.
  version: 0.2.0
  contact:
    name: platform-api

servers:
  - url: /api
    description: platform-api mount

security:
  - bearerAuth: []

tags:
  - name: profiles
    description: User profile CRUD + search.
  - name: follow-graph
    description: Follow / unfollow + follower / following / mutual-friend lists.
  - name: groups
    description: Group CRUD. Membership operations live under the `group-membership` tag.
  - name: group-membership
    description: Group membership, invitations, join/leave, and group-owned chat rooms.
  - name: rooms
    description: |
      Chat rooms (standalone, group-owned, and 1:1 DMs) + room membership.
      These are **social chat rooms** — distinct from video.yaml's
      *hangout rooms* (persistent video lobbies). The two surfaces share
      a `/rooms` URL shape by accident of history.
  - name: posts
    description: |
      Posts, threaded comments, post + comment likes, and emoji
      reactions on posts. All endpoints require room membership
      (enforced by middleware before the handler runs).
  - name: activity
    description: Per-user activity feed (login, follow, room-join, post events, ...).

paths:
  # --- profiles (full schemas) --------------------------------------------
  /profiles:
    get:
      tags: [profiles]
      summary: Search profiles by displayName / userId substring
      description: |
        Returns a visibility-gated list of matches. Private profiles are
        only included when the requester is the owner OR has a mutual
        follow with the matched user.
      operationId: searchProfiles
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
          description: Search substring (case-insensitive).
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [profiles]
                properties:
                  profiles:
                    type: array
                    items: { $ref: '#/components/schemas/ProfileSummary' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [profiles]
      summary: Create the caller's profile
      description: 409 if a profile already exists — use PUT to update.
      operationId: createProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpsertRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileItem' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Profile already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
    put:
      tags: [profiles]
      summary: Update the caller's profile (partial)
      description: Any subset of `displayName`, `bio`, `avatarUrl`, `visibility` may be omitted.
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpsertRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileItem' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Profile not found — use POST to create
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /profiles/batch:
    get:
      tags: [profiles]
      summary: Fetch several profiles in one request
      description: |
        `ids` is a comma-separated list (at most 200 are read). Unknown ids
        are dropped. A private profile that is not the caller's comes back
        reduced to `userId`, `visibility` and `callForwarding`.
      operationId: getProfilesBatch
      parameters:
        - name: ids
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [profiles]
                properties:
                  profiles:
                    type: array
                    items: { $ref: '#/components/schemas/ProfileItem' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /profiles/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserIdPath'
    get:
      tags: [profiles]
      summary: Fetch one profile (visibility-gated)
      description: 403 when the profile is private and the caller is not the owner.
      operationId: getProfile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileItem' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Private profile, caller is not the owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          $ref: '#/components/responses/NotFound'

  # --- social / follow graph (full schemas) -------------------------------
  /social/follow/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserIdPath'
    post:
      tags: [follow-graph]
      summary: Follow another user
      description: 400 when trying to follow yourself. 409 when already following.
      operationId: followUser
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [followerId, followeeId]
                properties:
                  followerId: { type: string }
                  followeeId: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Already following this user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
    delete:
      tags: [follow-graph]
      summary: Unfollow another user
      operationId: unfollowUser
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /social/followers:
    get:
      tags: [follow-graph]
      summary: List users who follow the caller
      operationId: listFollowers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [followers]
                properties:
                  followers:
                    type: array
                    items: { $ref: '#/components/schemas/PublicProfile' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /social/following:
    get:
      tags: [follow-graph]
      summary: List users the caller follows
      operationId: listFollowing
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [following]
                properties:
                  following:
                    type: array
                    items: { $ref: '#/components/schemas/PublicProfile' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /social/friends:
    get:
      tags: [follow-graph]
      summary: List mutual follows (friends)
      description: A friend = caller follows them AND they follow caller.
      operationId: listFriends
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [friends]
                properties:
                  friends:
                    type: array
                    items: { $ref: '#/components/schemas/PublicProfile' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  # --- groups CRUD (full schemas) -----------------------------------------
  /groups:
    post:
      tags: [groups]
      summary: Create a group
      description: |
        Creator becomes the owner (role=`owner`) in the same transaction.
        Returns the new GroupItem with `role` populated to `owner`.
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGroupRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupWithCallerRole' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Transaction conflict — retry once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/GroupIdPath'
    get:
      tags: [groups]
      summary: Fetch one group (visibility-gated)
      description: |
        Private groups are 403 to non-members. `role` is the caller's
        role in this group, or `null` when the caller is not a member.
      operationId: getGroup
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupWithCallerRole' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Group is private and the caller is not a member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [groups]
      summary: Delete a group (owner only)
      operationId: deleteGroup
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not the group owner.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          $ref: '#/components/responses/NotFound'

  /groups/{groupId}/visibility:
    parameters:
      - $ref: '#/components/parameters/GroupIdPath'
    patch:
      tags: [groups]
      summary: Toggle group visibility (owner only)
      operationId: updateGroupVisibility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visibility]
              properties:
                visibility: { $ref: '#/components/schemas/GroupVisibility' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupItem' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not the group owner.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          $ref: '#/components/responses/NotFound'
  # --- group membership + invitations + group-rooms (full schemas) --------
  /groups/{groupId}/members:
    parameters:
      - $ref: '#/components/parameters/GroupIdPath'
    get:
      tags: [group-membership]
      summary: List active members of a group (visibility-gated)
      description: |
        Private groups are 403 to non-members. Returned rows expose only
        `userId`, `role`, and `joinedAt` (not the full GroupMemberItem).
      operationId: listGroupMembers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/GroupMemberSummary' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Group is private and the caller is not an active member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          $ref: '#/components/responses/NotFound'

  /groups/{groupId}/invite:
    parameters:
      - $ref: '#/components/parameters/GroupIdPath'
    post:
      tags: [group-membership]
      summary: Invite a user to a group (owner or admin only)
      description: |
        Creates a pending membership row with `status=invited`. The target
        user accepts/declines via `POST /groups/{groupId}/invitations/{action}`.
      operationId: inviteGroupMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string, description: User to invite (cannot equal the caller). }
      responses:
        '201':
          description: Invitation sent
          content:
            application/json:
              schema:
                type: object
                required: [groupId, userId, status]
                properties:
                  groupId: { type: string, format: uuid }
                  userId: { type: string }
                  status:
                    type: string
                    enum: [invited]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not a group owner or admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Target user is already an active member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /groups/{groupId}/invitations/{action}:
    parameters:
      - $ref: '#/components/parameters/GroupIdPath'
      - in: path
        name: action
        required: true
        schema:
          type: string
          enum: [accept, decline]
        description: |
          `accept` flips the caller's pending membership to active.
          `decline` removes the pending membership row entirely.
    post:
      tags: [group-membership]
      summary: Accept or decline a pending group invitation
      operationId: respondToGroupInvitation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
                  groupId:
                    type: string
                    format: uuid
                    description: Present only on `accept`.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Group not found OR no pending invitation for the caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /groups/{groupId}/join:
    parameters:
      - $ref: '#/components/parameters/GroupIdPath'
    post:
      tags: [group-membership]
      summary: Self-join a public group (no invitation needed)
      description: 403 on private groups — those require an invitation.
      operationId: joinGroup
      responses:
        '201':
          description: Joined
          content:
            application/json:
              schema:
                type: object
                required: [groupId, userId, role]
                properties:
                  groupId: { type: string, format: uuid }
                  userId: { type: string }
                  role:
                    type: string
                    enum: [member]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Group is private.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Caller is already a member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /groups/{groupId}/leave:
    parameters:
      - $ref: '#/components/parameters/GroupIdPath'
    delete:
      tags: [group-membership]
      summary: Leave a group (non-owner members)
      description: |
        Owners cannot leave — they must transfer ownership or delete the
        group first.
      operationId: leaveGroup
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is the group owner.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          description: Group not found OR caller is not an active member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /groups/{groupId}/rooms:
    parameters:
      - $ref: '#/components/parameters/GroupIdPath'
    post:
      tags: [group-membership]
      summary: Create a group-scoped chat room (owner or admin only)
      description: |
        Creates a `RoomItem` of `type=group` owned by the calling user.
        See the `rooms` tag (hub#1106) for the full Room shape.
      operationId: createGroupRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupRoomCreatedResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not a group owner or admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          $ref: '#/components/responses/NotFound'

  # --- chat rooms (full schemas) ------------------------------------------
  /rooms:
    get:
      tags: [rooms]
      summary: List chat rooms the caller belongs to
      description: |
        Includes standalone rooms, group-owned rooms, and DMs. Backed by
        a GSI scan on social-room-members (no full-table Scan).
      operationId: listMyRooms
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [rooms]
                properties:
                  rooms:
                    type: array
                    items: { $ref: '#/components/schemas/RoomItem' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [rooms]
      summary: Create a standalone chat room
      description: |
        Creator becomes the owner (role=`owner`). Use
        `POST /groups/{groupId}/rooms` for group-owned rooms and
        `POST /rooms/dm` for 1:1 DMs.
      operationId: createStandaloneRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandaloneRoomCreatedResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /rooms/dm:
    post:
      tags: [rooms]
      summary: Create-or-return a 1:1 DM room with another user
      description: |
        The DM `roomId` is deterministic — `dm#<sorted-userId-A>#<sorted-userId-B>`
        — so re-calling with the same peer returns the existing room
        rather than creating a new one. Both users are auto-enrolled
        (caller=`owner`, peer=`member`). Requires a **mutual follow**;
        non-mutual pairs get 403. On duplicate the 409 body includes
        the existing `roomId` alongside `error`.
      operationId: createDmRoom
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDmRoomRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DmRoomCreatedResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller and target are not mutual friends.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '409':
          description: A DM room already exists between these users.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DmRoomExistsResponse' }

  /rooms/{roomId}/join:
    parameters:
      - $ref: '#/components/parameters/RoomIdPath'
    post:
      tags: [rooms]
      summary: Join a chat room
      description: Caller is added as `member`. 409 when already a member.
      operationId: joinRoom
      responses:
        '201':
          description: Joined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomMemberItem' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Caller is already a member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /rooms/{roomId}/leave:
    parameters:
      - $ref: '#/components/parameters/RoomIdPath'
    delete:
      tags: [rooms]
      summary: Leave a chat room (non-owner)
      description: Room owners cannot leave — would orphan the room.
      operationId: leaveRoom
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [roomId, userId, left]
                properties:
                  roomId: { type: string }
                  userId: { type: string }
                  left:
                    type: boolean
                    enum: [true]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is the room owner.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          description: Room not found OR caller is not a member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /rooms/{roomId}/members:
    parameters:
      - $ref: '#/components/parameters/RoomIdPath'
    get:
      tags: [rooms]
      summary: List members of a chat room (members only)
      operationId: listRoomMembers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/RoomMemberItem' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not a member of this room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          $ref: '#/components/responses/NotFound'

  # --- activity feed (full schemas) ---------------------------------------
  /activity:
    get:
      tags: [activity]
      summary: Per-user activity feed (newest-first, paginated)
      description: |
        Returns the caller's own activity events. `lastKey` is a base64
        DDB `LastEvaluatedKey` from a prior page; pass it back as
        `?lastKey=...` to fetch the next page.
      operationId: listMyActivity
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: lastKey
          schema: { type: string }
          description: Opaque base64-encoded DDB pagination cursor.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPageResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Activity table query failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  # --- posts + comments + likes + reactions (full schemas) ----------------
  /posts:
    get:
      tags: [posts]
      summary: List posts authored by a user across all rooms
      description: |
        When `userId` is omitted, returns the caller's own posts.
      operationId: listUserPosts
      parameters:
        - in: query
          name: userId
          schema: { type: string }
          description: Author user id; defaults to the caller's userId.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [posts]
                properties:
                  posts:
                    type: array
                    items: { $ref: '#/components/schemas/PostItem' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /rooms/{roomId}/posts:
    parameters:
      - $ref: '#/components/parameters/RoomIdPath'
    get:
      tags: [posts]
      summary: Paginated room feed, newest-first (members only)
      operationId: listRoomPosts
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, default: 20 }
        - in: query
          name: lastKey
          schema: { type: string }
          description: |
            Opaque DDB pagination cursor returned in `lastKey` from a
            prior page. Alias `cursor` is accepted on the same slot.
        - in: query
          name: cursor
          schema: { type: string }
          description: Alias for `lastKey`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomPostsPageResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not a member of this room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
    post:
      tags: [posts]
      summary: Create a post in a room (members only)
      operationId: createPost
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePostRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedPost' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not a member of this room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /rooms/{roomId}/posts/{postId}:
    parameters:
      - $ref: '#/components/parameters/RoomIdPath'
      - $ref: '#/components/parameters/PostIdPath'
    put:
      tags: [posts]
      summary: Edit your own post
      operationId: editPost
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePostRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdatedPost' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not the post author.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [posts]
      summary: Delete your own post
      operationId: deletePost
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not the post author.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          $ref: '#/components/responses/NotFound'

  /rooms/{roomId}/posts/{postId}/comments:
    parameters:
      - $ref: '#/components/parameters/RoomIdPath'
      - $ref: '#/components/parameters/PostIdPath'
    get:
      tags: [posts]
      summary: List all comments on a post (flat, members only)
      description: |
        Returns a flat array — clients group replies by `parentCommentId`
        to render threads.
      operationId: listComments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [comments]
                properties:
                  comments:
                    type: array
                    items: { $ref: '#/components/schemas/CommentItem' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not a member of this room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
    post:
      tags: [posts]
      summary: Add a comment (or threaded reply) to a post
      description: |
        Pass `parentCommentId` to reply to an existing comment; omit it
        to create a top-level comment.
      operationId: createComment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommentRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentItem' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not a member of this room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /rooms/{roomId}/posts/{postId}/comments/{commentId}:
    parameters:
      - $ref: '#/components/parameters/RoomIdPath'
      - $ref: '#/components/parameters/PostIdPath'
      - $ref: '#/components/parameters/CommentIdPath'
    delete:
      tags: [posts]
      summary: Delete your own comment
      operationId: deleteComment
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not the comment author.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          $ref: '#/components/responses/NotFound'

  /rooms/{roomId}/posts/{postId}/likes:
    parameters:
      - $ref: '#/components/parameters/RoomIdPath'
      - $ref: '#/components/parameters/PostIdPath'
    get:
      tags: [posts]
      summary: List users who liked a post (count + display names)
      operationId: listPostLikes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikedByList' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not a member of this room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [posts]
      summary: Like a post (idempotent — 409 on duplicate)
      operationId: likePost
      responses:
        '201':
          description: Like recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikeRecord' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not a member of this room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Caller has already liked this post.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
    delete:
      tags: [posts]
      summary: Unlike a post
      operationId: unlikePost
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not a member of this room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          $ref: '#/components/responses/NotFound'

  /rooms/{roomId}/posts/{postId}/comments/{commentId}/likes:
    parameters:
      - $ref: '#/components/parameters/RoomIdPath'
      - $ref: '#/components/parameters/PostIdPath'
      - $ref: '#/components/parameters/CommentIdPath'
    post:
      tags: [posts]
      summary: Like a comment (idempotent — 409 on duplicate)
      operationId: likeComment
      responses:
        '201':
          description: Like recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikeRecord' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not a member of this room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Caller has already liked this comment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
    delete:
      tags: [posts]
      summary: Unlike a comment
      operationId: unlikeComment
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not a member of this room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          $ref: '#/components/responses/NotFound'

  /rooms/{roomId}/posts/{postId}/reactions:
    parameters:
      - $ref: '#/components/parameters/RoomIdPath'
      - $ref: '#/components/parameters/PostIdPath'
    post:
      tags: [posts]
      summary: Add an emoji reaction to a post
      description: |
        `emoji` must be one of the 12 supported codepoints; any other
        value returns 400. Re-reacting with the same emoji returns 409
        — clients should DELETE the existing reaction first.
      operationId: addReaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji:
                  type: string
                  description: One of the 12 supported emoji codepoints.
      responses:
        '201':
          description: Reaction recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReactionRecord' }
        '400':
          description: Invalid emoji (not one of the 12 supported values).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not a member of this room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Caller has already reacted with this emoji.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /rooms/{roomId}/posts/{postId}/reactions/{emoji}:
    parameters:
      - $ref: '#/components/parameters/RoomIdPath'
      - $ref: '#/components/parameters/PostIdPath'
      - in: path
        name: emoji
        required: true
        schema: { type: string }
        description: |
          URL-encoded emoji codepoint to remove. Must be one of the 12
          supported values.
    delete:
      tags: [posts]
      summary: Remove an emoji reaction from a post
      operationId: removeReaction
      responses:
        '204':
          description: Removed
        '400':
          description: Invalid emoji (not one of the 12 supported values).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not a member of this room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Cognito ID token validated by `middleware/auth.ts`. Will swap to
        the identity-server OIDC issuer in the auth migration.

  parameters:
    UserIdPath:
      in: path
      name: userId
      required: true
      schema: { type: string }
      description: Target user identifier (Cognito sub).
    GroupIdPath:
      in: path
      name: groupId
      required: true
      schema: { type: string, format: uuid }
      description: Group identifier (UUID, minted at create time).
    RoomIdPath:
      in: path
      name: roomId
      required: true
      schema: { type: string }
      description: |
        Room identifier. Standalone + group rooms use a UUID; DM rooms
        use the deterministic key `dm#<userA>#<userB>` (sorted).
    PostIdPath:
      in: path
      name: postId
      required: true
      schema: { type: string }
      description: Post identifier (ULID).
    CommentIdPath:
      in: path
      name: commentId
      required: true
      schema: { type: string }
      description: Comment identifier (ULID).

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }

  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Machine-readable error code. }
        message: { type: string }

    # Full profile row (POST /profiles, PUT /profiles, GET /profiles/{id}).
    # Email is NOT persisted here — it lives in Cognito.
    ProfileItem:
      type: object
      required: [userId, displayName, bio, avatarUrl, visibility, createdAt, updatedAt]
      properties:
        userId: { type: string }
        displayName: { type: string, minLength: 1, maxLength: 50 }
        bio: { type: string, maxLength: 160 }
        avatarUrl: { type: string }
        visibility:
          type: string
          enum: [public, private]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # Request body for POST + PUT /profiles. PUT semantics: any field
    # may be omitted (partial). POST semantics: displayName is effectively
    # required (server rejects without it).
    ProfileUpsertRequest:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 50 }
        bio: { type: string, maxLength: 160 }
        avatarUrl: { type: string }
        visibility:
          type: string
          enum: [public, private]

    # Search-result row — narrower than ProfileItem on purpose. avatarUrl
    # is omitted entirely when the underlying profile has no avatar set.
    ProfileSummary:
      type: object
      required: [userId, displayName]
      properties:
        userId: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string }

    # Enriched profile rows returned by the follow-graph lists. Wider than
    # ProfileSummary (includes visibility) but narrower than ProfileItem
    # (no bio / createdAt / updatedAt).
    PublicProfile:
      type: object
      required: [userId, displayName, avatarUrl, visibility, hasProfile]
      properties:
        userId: { type: string }
        displayName:
          type: string
          description: |
            Falls back to `userId` when no profile row exists — see
            `hasProfile`.
        avatarUrl: { type: string }
        visibility:
          type: string
          enum: [public, private]
          description: |
            `private` when no profile row exists: somebody who has created no
            profile has made no claim about who may see them, and defaulting
            to `public` would publish them by omission. Read with
            `hasProfile` to tell a choice from an absence.
        hasProfile:
          type: boolean
          description: |
            Whether a profile row actually exists for this user. Relationships
            are kept for people who have never written a profile, so they are
            returned here with placeholder fields. Without this flag a client
            cannot distinguish "chose to be private" from "has never filled
            anything in", and will report the second as the first.

    # --- groups ---------------------------------------------------------
    GroupVisibility:
      type: string
      enum: [public, private]

    GroupMemberRole:
      type: string
      enum: [owner, admin, member]

    # Full group row. Returned by GET /groups/{id} (wrapped in
    # GroupWithCallerRole) and PATCH /groups/{id}/visibility.
    GroupItem:
      type: object
      required: [groupId, name, description, visibility, ownerId, createdAt, updatedAt]
      properties:
        groupId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        visibility: { $ref: '#/components/schemas/GroupVisibility' }
        ownerId: { type: string, description: userId of the group owner. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # GroupItem + caller's role in the group. `role` is null when the
    # caller is not a member (only possible on public groups).
    GroupWithCallerRole:
      allOf:
        - $ref: '#/components/schemas/GroupItem'
        - type: object
          required: [role]
          properties:
            role:
              oneOf:
                - $ref: '#/components/schemas/GroupMemberRole'
                - type: 'null'
              description: Caller's role in this group; null if not a member.

    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        visibility:
          $ref: '#/components/schemas/GroupVisibility'

    # Narrow projection returned by GET /groups/{groupId}/members.
    GroupMemberSummary:
      type: object
      required: [userId, role, joinedAt]
      properties:
        userId: { type: string }
        role: { $ref: '#/components/schemas/GroupMemberRole' }
        joinedAt: { type: string, format: date-time }

    # Response body for POST /groups/{groupId}/rooms. Mirrors the RoomItem
    # produced by group-rooms.ts (type=group + groupId carried through).
    GroupRoomCreatedResponse:
      type: object
      required: [roomId, channelId, name, type, groupId, ownerId, role, createdAt]
      properties:
        roomId: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        name: { type: string }
        type:
          type: string
          enum: [group]
        groupId: { type: string, format: uuid }
        ownerId: { type: string }
        role:
          type: string
          enum: [owner]
        createdAt: { type: string, format: date-time }

    # Membership row — used by group-membership endpoints (hub#1105).
    GroupMemberItem:
      type: object
      required: [groupId, userId, role, joinedAt]
      properties:
        groupId: { type: string, format: uuid }
        userId: { type: string }
        role: { $ref: '#/components/schemas/GroupMemberRole' }
        status:
          type: string
          enum: [invited, active]
          description: Set to `invited` for pending invitations; `active` once accepted.
        joinedAt: { type: string, format: date-time }
        invitedAt: { type: string, format: date-time }

    # --- chat rooms -----------------------------------------------------
    RoomType:
      type: string
      enum: [standalone, group, dm]

    RoomMemberRole:
      type: string
      enum: [owner, member]

    # Full room row — returned by GET /rooms and reused by the posts child.
    RoomItem:
      type: object
      required: [roomId, channelId, name, type, ownerId, createdAt, updatedAt]
      properties:
        roomId:
          type: string
          description: |
            UUID for standalone + group rooms; `dm#<userA>#<userB>` (sorted)
            for DMs.
        channelId:
          type: string
          format: uuid
          description: WebSocket channel id used by the realtime pub/sub fan-out.
        name: { type: string, maxLength: 100 }
        type: { $ref: '#/components/schemas/RoomType' }
        ownerId: { type: string }
        groupId:
          type: string
          format: uuid
          description: Set when `type=group` — the owning group.
        dmPeerUserId:
          type: string
          description: Set when `type=dm` — the other participant's userId.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RoomMemberItem:
      type: object
      required: [roomId, userId, role, joinedAt]
      properties:
        roomId: { type: string }
        userId: { type: string }
        role: { $ref: '#/components/schemas/RoomMemberRole' }
        joinedAt: { type: string, format: date-time }

    StandaloneRoomCreatedResponse:
      type: object
      required: [roomId, channelId, name, type, ownerId, role, createdAt]
      properties:
        roomId: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        name: { type: string }
        type:
          type: string
          enum: [standalone]
        ownerId: { type: string }
        role:
          type: string
          enum: [owner]
        createdAt: { type: string, format: date-time }

    CreateDmRoomRequest:
      type: object
      description: '`peerId` accepted as alias for `targetUserId`.'
      properties:
        targetUserId: { type: string }
        peerId: { type: string }

    DmRoomCreatedResponse:
      type: object
      required: [roomId, channelId, type, dmPeerUserId, createdAt]
      properties:
        roomId:
          type: string
          description: Deterministic DM key — `dm#<sorted-userA>#<sorted-userB>`.
        channelId: { type: string, format: uuid }
        type:
          type: string
          enum: [dm]
        dmPeerUserId: { type: string }
        createdAt: { type: string, format: date-time }

    # 409 body for POST /rooms/dm — includes the existing roomId so the
    # client can navigate to it instead of treating the duplicate as an error.
    DmRoomExistsResponse:
      type: object
      required: [error, roomId]
      properties:
        error: { type: string }
        roomId: { type: string }

    # --- activity feed --------------------------------------------------
    ActivityEvent:
      type: object
      required: [eventType, timestamp, detail]
      properties:
        eventType:
          type: string
          description: |
            Domain event name (e.g. `social.room.join`, `social.follow`,
            `social.post.create`). Free-form string — clients should
            tolerate unknown values.
        timestamp: { type: string, format: date-time }
        detail:
          type: object
          description: |
            Event-specific payload — shape depends on `eventType`. Always
            a parsed JSON object (the row's `detail` string field is
            JSON-decoded server-side before return).
          additionalProperties: true

    ActivityPageResponse:
      type: object
      required: [items, nextKey]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ActivityEvent' }
        nextKey:
          type: [string, 'null']
          description: Opaque base64 cursor; null when no more pages.

    # --- posts + comments + likes + reactions ---------------------------
    PostItem:
      type: object
      required: [roomId, postId, authorId, content, createdAt, updatedAt]
      properties:
        roomId: { type: string }
        postId: { type: string, description: ULID. }
        authorId: { type: string }
        content: { type: string, maxLength: 10000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # Narrow response for POST /rooms/{roomId}/posts (no updatedAt at create time).
    CreatedPost:
      type: object
      required: [roomId, postId, authorId, content, createdAt]
      properties:
        roomId: { type: string }
        postId: { type: string }
        authorId: { type: string }
        content: { type: string }
        createdAt: { type: string, format: date-time }

    # Narrow response for PUT /rooms/{roomId}/posts/{postId} (only echoes
    # what changed — no authorId / createdAt).
    UpdatedPost:
      type: object
      required: [roomId, postId, content, updatedAt]
      properties:
        roomId: { type: string }
        postId: { type: string }
        content: { type: string }
        updatedAt: { type: string, format: date-time }

    CreatePostRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 10000 }

    RoomPostsPageResponse:
      type: object
      required: [posts]
      properties:
        posts:
          type: array
          items: { $ref: '#/components/schemas/PostItem' }
        lastKey:
          type: string
          description: Opaque DDB cursor; omitted on the last page.

    CommentItem:
      type: object
      required: [postId, commentId, authorId, content, createdAt]
      properties:
        postId: { type: string }
        commentId: { type: string, description: ULID. }
        authorId: { type: string }
        content: { type: string, maxLength: 10000 }
        parentCommentId:
          type: string
          description: Present on threaded replies; absent on top-level comments.
        createdAt: { type: string, format: date-time }

    CreateCommentRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 10000 }
        parentCommentId:
          type: string
          description: Set to make this a threaded reply to an existing comment.

    # Like + reaction records share `targetId` shape. For post likes
    # targetId = `post:<postId>:like`; for comment likes
    # targetId = `comment:<commentId>:like`; for reactions
    # targetId = `post:<postId>:reaction`.
    LikeRecord:
      type: object
      required: [targetId, userId, type, createdAt]
      properties:
        targetId:
          type: string
          description: Composite key — see schema description above.
        userId: { type: string }
        type:
          type: string
          enum: [like]
