components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Cognito ID token validated by `middleware/auth.ts`. Will swap to
        the identity-server OIDC issuer in the auth migration.

  parameters:
    UserIdPath:
      in: path
      name: userId
      required: true
      schema: { type: string }
      description: Target user identifier (Cognito sub).
    GroupIdPath:
      in: path
      name: groupId
      required: true
      schema: { type: string, format: uuid }
      description: Group identifier (UUID, minted at create time).

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }

  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Machine-readable error code. }
        message: { type: string }

    # Full profile row (POST /profiles, PUT /profiles, GET /profiles/{id}).
    # Email is NOT persisted here — it lives in Cognito.
    ProfileItem:
      type: object
      required: [userId, displayName, bio, avatarUrl, visibility, createdAt, updatedAt]
      properties:
        userId: { type: string }
        displayName: { type: string, minLength: 1, maxLength: 50 }
        bio: { type: string, maxLength: 160 }
        avatarUrl: { type: string }
        visibility:
          type: string
          enum: [public, private]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # Request body for POST + PUT /profiles. PUT semantics: any field
    # may be omitted (partial). POST semantics: displayName is effectively
    # required (server rejects without it).
    ProfileUpsertRequest:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 50 }
        bio: { type: string, maxLength: 160 }
        avatarUrl: { type: string }
        visibility:
          type: string
          enum: [public, private]

    # Search-result row — narrower than ProfileItem on purpose. avatarUrl
    # is omitted entirely when the underlying profile has no avatar set.
    ProfileSummary:
      type: object
      required: [userId, displayName]
      properties:
        userId: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string }

    # Enriched profile rows returned by the follow-graph lists. Wider than
    # ProfileSummary (includes visibility) but narrower than ProfileItem
    # (no bio / createdAt / updatedAt).
    PublicProfile:
      type: object
      required: [userId, displayName, avatarUrl, visibility]
      properties:
        userId: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string }
        visibility:
          type: string
          enum: [public, private]

    # --- groups ---------------------------------------------------------
    GroupVisibility:
      type: string
      enum: [public, private]

    GroupMemberRole:
      type: string
      enum: [owner, admin, member]

    # Full group row. Returned by GET /groups/{id} (wrapped in
    # GroupWithCallerRole) and PATCH /groups/{id}/visibility.
    GroupItem:
      type: object
      required: [groupId, name, description, visibility, ownerId, createdAt, updatedAt]
      properties:
        groupId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        visibility: { $ref: '#/components/schemas/GroupVisibility' }
        ownerId: { type: string, description: userId of the group owner. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # GroupItem + caller's role in the group. `role` is null when the
    # caller is not a member (only possible on public groups).
    GroupWithCallerRole:
      allOf:
        - $ref: '#/components/schemas/GroupItem'
        - type: object
          required: [role]
          properties:
            role:
              oneOf:
                - $ref: '#/components/schemas/GroupMemberRole'
                - type: 'null'
              description: Caller's role in this group; null if not a member.

    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        visibility:
          $ref: '#/components/schemas/GroupVisibility'

    # Membership row — used by group-membership endpoints (hub#1105).
    GroupMemberItem:
      type: object
      required: [groupId, userId, role, joinedAt]
      properties:
        groupId: { type: string, format: uuid }
        userId: { type: string }
        role: { $ref: '#/components/schemas/GroupMemberRole' }
        status:
          type: string
          enum: [invited, active]
          description: Set to `invited` for pending invitations; `active` once accepted.
        joinedAt: { type: string, format: date-time }
        invitedAt: { type: string, format: date-time }
