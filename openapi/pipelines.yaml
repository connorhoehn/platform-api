# social-api/openapi/pipelines.yaml
#
# OpenAPI 3.1 spec for the pipelines HTTP surface exposed by social-api.
#
# Authoritative source: `social-api/src/routes/pipelineDefinitions.ts`,
# `pipelineMetrics.ts`, `pipelineTriggers.ts`, and `profiles.ts`. Schemas
# mirror `frontend/src/types/pipeline.ts` per TYPES_SYNC.md — update both
# in lockstep.
#
# Hand-maintained (no codegen). Useful for future SDK generation, shape
# sanity-checks at the repo boundary, and letting LLMs reason about the
# API without re-reading source.

openapi: 3.1.0

info:
  title: Pipelines HTTP API
  description: |
    REST surface for pipeline definitions, runs, metrics, and the user
    search used by the pipeline editor's UserPicker. Part of `social-api`.

    Phase 1 endpoints back onto in-memory stubs; the wire contracts are
    intentionally stable so Phase 4 can swap in distributed-core's
    PipelineModule without touching clients. See `PIPELINES_PLAN.md §17`.
  version: 1.0.0
  contact:
    name: websocket-gateway
    url: https://github.com/hoehn/websocket-gateway

servers:
  - url: /api
    description: social-api mount (Express app mounts the router at /api)

security:
  - bearerAuth: []

tags:
  - name: pipelines
    description: Pipeline definitions, runs, and metrics
  - name: profiles
    description: User profile search (UserPicker backing store)

paths:
  # --- Public webhook trigger ---------------------------------------------
  # Mounted at the app root (NOT under /api) — see `social-api/src/app.ts`.
  # Public by design: no Cognito JWT required, since external systems
  # (Stripe, GitHub, internal cron, etc.) won't carry one. Authenticity is
  # enforced via per-pipeline HMAC-SHA256 signatures when the matched
  # pipeline definition's webhook trigger binding has a `webhookSecret`
  # configured. No secret ⇒ unsigned-OK fallback (Phase-1 behavior).
  #
  # Note: `/hooks/pipeline/{path}` is sibling to the `/api` server URL
  # declared above — the OpenAPI `servers` block describes the JWT-gated
  # surface; this endpoint is documented here for completeness, callers
  # should target it at `<host>/hooks/pipeline/{path}` directly.
  /hooks/pipeline/{path}:
    parameters:
      - in: path
        name: path
        required: true
        schema:
          type: string
          pattern: '^[a-zA-Z0-9_-]{1,64}$'
        description: |
          Webhook path — matches the regex enforced by both the route and
          the frontend `TriggerConfig` "Full URL" preview. Alphanumeric,
          underscore, hyphen; 1-64 chars.
    post:
      tags: [pipelines]
      summary: Public webhook trigger for pipeline definitions
      security: []  # No bearer token — see signature header instead.
      description: |
        Fires the pipeline whose published `triggerBinding` matches
        `(event: 'webhook', webhookPath: <path>)`. Body is forwarded
        verbatim; only `x-*` headers (minus the signature header) are
        captured into pipeline context.

        ## Authenticity
        When the matched pipeline definition has a `webhookSecret` configured
        on its trigger binding, the request MUST carry a valid
        `X-Pipeline-Signature-256` header of the form:

        ```
        X-Pipeline-Signature-256: sha256=<hex>
        ```

        where `<hex>` is HMAC-SHA256(secret, raw_request_body) — same
        convention as GitHub webhooks. Comparison is constant-time
        (`crypto.timingSafeEqual`). On mismatch the route returns
        `401 Unauthorized` with an RFC-7807 problem-details body and emits
        a structured `[pipeline-webhook] signature verification failed`
        log line for observability.

        When no `webhookSecret` is configured, unsigned requests are
        accepted (Phase-1 dev fallback). Phase-5 will add a global config
        flag to require signatures everywhere.
      operationId: triggerPipelineWebhook
      parameters:
        - in: header
          name: X-Pipeline-Signature-256
          required: false
          schema:
            type: string
            pattern: '^sha256=[0-9a-f]{64}$'
          description: |
            HMAC-SHA256 signature of the raw request body, formatted as
            `sha256=<64-hex-chars>`. Required when the matched pipeline
            definition's trigger binding has a `webhookSecret`; ignored
            otherwise.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          '*/*':
            schema:
              type: string
              format: binary
              description: |
                Raw payload — the route preserves exact bytes for HMAC
                verification before attempting JSON parsing.
      responses:
        '202':
          description: Webhook accepted (and signature verified, if required)
          content:
            application/json:
              schema:
                type: object
                required: [accepted, webhookPath, at]
                properties:
                  accepted:
                    type: boolean
                    enum: [true]
                  webhookPath:
                    type: string
                  at:
                    type: string
                    format: date-time
        '400':
          description: Path failed regex validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: |
            Signature missing or invalid for a pipeline that requires one.
            Body is RFC-7807 problem-details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WebhookSignatureProblem'

  # --- Definitions ---------------------------------------------------------
  # Mounted at /api/pipelines/defs — the `/defs` segment exists to avoid
  # colliding with the static `/metrics` segment under `/api/pipelines`.
  # See routes/index.ts for the mount-order note.
  /pipelines/defs:
    get:
      tags: [pipelines]
      summary: List pipeline definitions for the caller
      description: |
        The caller's stored definitions plus the platform's system pipelines
        (`readOnly: true` when no stored override exists). Every entry carries
        `workType`, `kind` and `route` — stored, or inferred on the response
        (`inferred` names which) without writing anything back.
        `?include=rollup` attaches `rollup` (the derived last-run read model,
        `null` until it exists) and `pendingApprovals` to each entry.
      operationId: listPipelineDefinitions
      parameters:
        - in: query
          name: include
          required: false
          schema:
            type: string
            enum: [rollup, approvals]
          description: Comma-separated extras; `rollup` implies `approvals`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [pipelines]
                properties:
                  pipelines:
                    type: array
                    items:
                      $ref: '#/components/schemas/PipelineDefinition'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pipelines/defs/generate:
    post:
      tags: [pipelines]
      summary: Plan an instruction into a draft definition the caller owns
      description: |
        The chat's `/agent` planner, pointed at a page instruction. Stores a
        `status: 'draft'` definition with `origin.kind: 'agent'` (the
        instruction verbatim, `plannerSource: 'model' | 'fallback'`);
        `mode: 'run'` publishes it and triggers the first run. Idempotent by
        `requestId` (carried as the Idempotency-Key claim in DynamoDB): a retry
        replays the first answer, a duplicate still running answers 409.
      operationId: generatePipelineDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instruction]
              properties:
                instruction: { type: string, maxLength: 4000 }
                mode: { type: string, enum: [draft, run], default: draft }
                requestId: { type: string }
                hints: { type: array, items: { type: string } }
                model: { type: string }
                contextBudgetTokens: { type: integer }
      responses:
        '200':
          description: The stored draft (decorated), the run it started if any, and how it was planned
          content:
            application/json:
              schema:
                type: object
                required: [pipeline, planner]
                properties:
                  pipeline: { $ref: '#/components/schemas/PipelineDefinition' }
                  runId: { type: string }
                  runError: { type: string }
                  planner:
                    type: object
                    required: [source, steps]
                    properties:
                      source: { type: string, enum: [model, fallback] }
                      steps: { type: integer }
                      notice: { type: string }
        '400':
          description: The body is not an object or `mode` is not `draft` | `run`
        '409':
          description: A request with this `requestId` is still being processed (`idempotency_in_progress`)
        '422':
          description: The instruction is empty or longer than 4000 characters (`invalid_instruction`)
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pipelines/defs/{pipelineId}:
    parameters:
      - $ref: '#/components/parameters/PipelineIdPath'
    get:
      tags: [pipelines]
      summary: Get one pipeline definition
      operationId: getPipelineDefinition
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineDefinition'
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

    put:
      tags: [pipelines]
      summary: Upsert a pipeline definition
      description: |
        Body `id` must match the `:pipelineId` path param; mismatch returns
        `400 invalid_body`. Creates if absent, replaces if present.
      operationId: upsertPipelineDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineDefinition'
      responses:
        '200':
          description: Upserted definition (echoed body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineDefinition'
        '400':
          description: Body missing or `body.id` does not match `:pipelineId`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401': { $ref: '#/components/responses/Unauthorized' }

    delete:
      tags: [pipelines]
      summary: Delete a pipeline definition
      operationId: deletePipelineDefinition
      responses:
        '204':
          description: Deleted (or no-op if absent)
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pipelines/defs/{pipelineId}/publish:
    parameters:
      - $ref: '#/components/parameters/PipelineIdPath'
    post:
      tags: [pipelines]
      summary: Publish a pipeline definition
      description: |
        Bumps `version` by 1, sets `status = 'published'`, and snapshots
        `publishedVersion` to the new `version`. Idempotent in the sense
        that each call bumps, but no additional side effects.
      operationId: publishPipelineDefinition
      responses:
        '200':
          description: Updated definition after publish
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineDefinition'
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # --- Runs ----------------------------------------------------------------
  /pipelines/{pipelineId}/runs:
    parameters:
      - $ref: '#/components/parameters/PipelineIdPath'
    post:
      tags: [pipelines]
      summary: Trigger a pipeline run
      description: |
        Phase 1: synthesizes a runId and returns 202. The frontend's
        MockExecutor drives the actual execution via the in-process
        EventStreamContext. Phase 4 swaps the body for
        `pipelineModule.createResource(...)` without changing this contract.

        ## Idempotency
        Callers may pass an `Idempotency-Key` header. When present we dedupe
        by `${userId}:${pipelineId}:${key}` against a 5-minute in-memory
        cache. Replays return the original response with HTTP 200 (instead
        of 202) and an `X-Idempotency-Replay: true` response header so the
        frontend/logs can distinguish replays from fresh triggers.

        Body `definition.id`, when supplied, MUST equal `:pipelineId` —
        mismatch returns `400 invalid_body`.
      operationId: triggerPipelineRun
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            maxLength: 200
          description: |
            Optional client-supplied dedupe key. Within the 5-minute window
            the same key replays the original response (HTTP 200 +
            `X-Idempotency-Replay: true`).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerRunRequest'
      responses:
        '202':
          description: Trigger accepted (fresh)
          headers:
            X-Idempotency-Replay:
              schema: { type: string, enum: ['true'] }
              description: Absent on a fresh trigger; only present on replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerRunResponse'
        '200':
          description: |
            Idempotent replay — request matched a recent `Idempotency-Key`
            in the dedupe window. Body is the original response; the
            `X-Idempotency-Replay` header is set to `true`.
          headers:
            X-Idempotency-Replay:
              schema: { type: string, enum: ['true'] }
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerRunResponse'
        '400':
          description: Body `definition.id` does not match `:pipelineId`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pipelines/{pipelineId}/runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/PipelineIdPath'
      - $ref: '#/components/parameters/RunIdPath'
    get:
      tags: [pipelines]
      summary: Fetch a single pipeline run
      description: |
        Returns the full run document — status, step executions, accumulated
        context, and any terminal error. Phase 4 routes through the
        ResourceRouter owner.
      operationId: getPipelineRun
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRun'
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pipelines/{pipelineId}/runs/{runId}/history:
    parameters:
      - $ref: '#/components/parameters/PipelineIdPath'
      - $ref: '#/components/parameters/RunIdPath'
    get:
      tags: [pipelines]
      summary: Replay event history for a run
      description: |
        Returns the ordered list of `PipelineWireEvent` envelopes for the
        run, optionally starting from a `seq` cursor (`fromVersion`). Used
        by the replay UI to reconstruct state and by reconnecting clients
        to catch up after a disconnect. Events are returned in `seq`-
        ascending order; clients dedupe on `seq` (NEVER on `emittedAt` —
        that field is re-stamped on replay).
      operationId: getPipelineRunHistory
      parameters:
        - in: query
          name: fromVersion
          required: false
          schema:
            type: integer
            minimum: 0
          description: |
            Inclusive `seq` cursor. Omit to start from 0.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/PipelineWireEvent'
                  nextFromVersion:
                    type: integer
                    minimum: 0
                    description: |
                      `seq` to pass on the next request to continue the stream.
                      Absent when the run has reached a terminal event.
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # --- Per-run lifecycle actions ------------------------------------------
  # Operator + frontend surface for replay / retry / resume / audit / breakpoint
  # editing on a single run. All routes are mounted under
  # `/pipelines/:pipelineId/runs/:runId/...` so the pipelineId + runId path
  # params thread through and (for replay/retry/resume) idempotency keys are
  # scoped per-run.

  /pipelines/{pipelineId}/runs/{runId}/replay:
    parameters:
      - $ref: '#/components/parameters/PipelineIdPath'
      - $ref: '#/components/parameters/RunIdPath'
    post:
      tags: [pipelines]
      summary: Re-run a completed/failed run as a fresh run
      description: |
        Spawns a NEW run using the original pipeline definition and trigger
        payload. The new runId is freshly minted — the original row in
        history is unchanged. Only terminal runs (`succeeded`, `failed`,
        `canceled`) can be replayed.
      operationId: replayPipelineRun
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, maxLength: 200 }
          description: |
            Optional dedupe key (scope `pipeline-replay`). Replays within
            the 5-minute window return the original 202 response.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                triggerPayload:
                  type: object
                  additionalProperties: true
                  description: |
                    Optional override of the original run's trigger payload.
                    Omit to reuse what the original run was started with.
      responses:
        '202':
          description: Replay accepted; new run scheduled
          content:
            application/json:
              schema:
                type: object
                required: [newRunId, originalRunId, pipelineId, at]
                properties:
                  newRunId: { type: string, format: uuid }
                  originalRunId: { type: string, format: uuid }
                  pipelineId: { type: string }
                  at: { type: string, format: date-time }
        '400':
          description: Run is not in a terminal state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          description: Run or pipeline definition not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '500':
          description: Replay trigger failed at the bridge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '503':
          description: Pipeline bridge not wired (stub mode)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pipelines/{pipelineId}/runs/{runId}/retry/{nodeId}:
    parameters:
      - $ref: '#/components/parameters/PipelineIdPath'
      - $ref: '#/components/parameters/RunIdPath'
      - in: path
        name: nodeId
        required: true
        schema: { type: string }
        description: |
          DAG node id to retry from. Must have been executed in the original
          run (i.e. present in `stepsSummary`). All upstream nodes are
          skipped and their stored outputs supplied as context.
    post:
      tags: [pipelines]
      summary: Spawn a fresh run starting from a specific node
      description: |
        Unlike `resume` (which re-enters the SAME run), `retry/:nodeId`
        spawns a brand-new run that consumes the original run's persisted
        upstream step outputs as context. Use this when downstream of
        nodeId needs to be re-executed but you want the upstream outputs
        frozen (saves LLM cost on a 10-node pipeline being retried from
        node 8).
      operationId: retryPipelineRunFromNode
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, maxLength: 200 }
          description: Optional dedupe key (scope `pipeline-retry-from-node`).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                inputs:
                  type: object
                  additionalProperties: true
                  description: Override inputs for the target node.
                snapshotInput:
                  type: boolean
                  description: |
                    When true, replay uses the persisted input snapshot from
                    the original attempt (hub#1283) so non-deterministic
                    upstream nodes produce the same downstream context.
      responses:
        '202':
          description: Retry accepted; new run scheduled
          content:
            application/json:
              schema:
                type: object
                required: [newRunId, originalRunId, pipelineId, retryFromNodeId, skippedNodes, at]
                properties:
                  newRunId: { type: string, format: uuid }
                  originalRunId: { type: string, format: uuid }
                  pipelineId: { type: string }
                  retryFromNodeId: { type: string }
                  skippedNodes:
                    type: array
                    items: { type: string }
                  at: { type: string, format: date-time }
        '400':
          description: Run is not terminal, nodeId unknown, or nodeId was not executed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          description: Run or pipeline definition not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '503':
          description: Pipeline bridge not wired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pipelines/{pipelineId}/runs/{runId}/audit:
    parameters:
      - $ref: '#/components/parameters/PipelineIdPath'
      - $ref: '#/components/parameters/RunIdPath'
    get:
      tags: [pipelines]
      summary: Read-only per-run audit timeline
      description: |
        Returns the ordered audit-log entries for `runId` from the
        `pipeline-audit` DDB table (`runId-time-index` GSI). Read-only —
        does NOT write an audit row of its own.
      operationId: listPipelineRunAudit
      parameters:
        - in: query
          name: since
          required: false
          schema: { type: string, format: date-time }
          description: Inclusive lower bound (ISO 8601).
        - in: query
          name: until
          required: false
          schema: { type: string, format: date-time }
          description: Exclusive upper bound (ISO 8601).
        - in: query
          name: actions
          required: false
          schema: { type: string }
          description: Comma-separated audit action filter (e.g. `pipeline.trigger,pipeline.cancel`).
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - in: query
          name: cursor
          required: false
          schema: { type: string }
          description: Opaque pagination cursor from a prior response.
      responses:
        '200':
          description: Audit timeline page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { type: object, additionalProperties: true }
                  nextCursor: { type: string }
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pipelines/{pipelineId}/runs/{runId}/resume:
    parameters:
      - $ref: '#/components/parameters/PipelineIdPath'
      - $ref: '#/components/parameters/RunIdPath'
    post:
      tags: [pipelines]
      summary: Resume the SAME run from a specific step
      description: |
        Re-enters the existing run via `PipelineModule.resumeFromStep`,
        preserving the run's accumulated context (LLM tokens, fetched data,
        transform outputs) and incrementing `replayAttempts` on the
        original row. Default: only `failed` runs are resumable; pass
        `allowCompleted: true` in the body to resume a succeeded run for
        diagnostic re-execution.

        Works after a restart: when no executor holds the run any more, the
        run row's definition snapshot and checkpoint are rewound from
        `fromNodeId` and continued on a fresh executor under the same
        runId. `replayAttempts` then counts from the stored row, which keeps
        no earlier re-run count (it starts again at 1). A row with no
        checkpoint cannot be rewound this way.
      operationId: resumePipelineRunFromStep
      parameters:
        - in: query
          name: fromNodeId
          required: true
          schema: { type: string }
          description: DAG node id to resume execution from.
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, maxLength: 200 }
          description: Optional dedupe key (scope `pipeline-resume-from-step`).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                allowCompleted:
                  type: boolean
                  default: false
                  description: Allow resuming `succeeded`/`done` runs for diagnostic re-execution.
                breakpoints:
                  type: array
                  items: { type: string }
                  description: Optional breakpoint list for the resumed dispatch loop.
      responses:
        '202':
          description: Resume accepted
          content:
            application/json:
              schema:
                type: object
                required: [runId, fromNodeId, replayAttempts, at]
                properties:
                  runId: { type: string, format: uuid }
                  fromNodeId: { type: string }
                  originalFailedStepId:
                    type: string
                    description: Best-effort original failure point — surfaced when the run's `error.nodeId` or `stepsSummary` exposes it.
                  replayAttempts:
                    type: integer
                    minimum: 0
                    description: Post-increment count of `resumeFromStep` invocations.
                  at: { type: string, format: date-time }
        '400':
          description: Missing `fromNodeId`, unknown node (in the current definition or in the graph the run executed), or non-resumable status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          description: Run or pipeline definition not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '503':
          description: Pipeline bridge does not expose `resumeFromStep`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pipelines/{pipelineId}/runs/{runId}/force-fail:
    parameters:
      - $ref: '#/components/parameters/PipelineIdPath'
      - $ref: '#/components/parameters/RunIdPath'
    post:
      tags: [pipelines]
      summary: Operator action — force-fail a stuck run
      description: |
        hub#1285 operator action. Transitions a `running` run that has been
        flagged as `stuck` to `interrupted` (clearing `stuckAt`) so the UI
        badge clears even if the executor is unresponsive. Best-effort
        cancel via `bridge.cancelRun` is fire-and-forget — the response is
        not blocked on it. Use "Retry from failed step" afterward to
        resume from the stuck node.
      operationId: forceFailPipelineRun
      responses:
        '202':
          description: Run transitioned to `interrupted`
          content:
            application/json:
              schema:
                type: object
                required: [runId, status, hint, at]
                properties:
                  runId: { type: string, format: uuid }
                  status: { type: string, enum: [interrupted] }
                  hint: { type: string }
                  at: { type: string, format: date-time }
        '400':
          description: Run not in `running` status or not flagged stuck
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          description: Run not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pipelines/{pipelineId}/runs/{runId}/breakpoint/{stepId}/resolve:
    parameters:
      - $ref: '#/components/parameters/PipelineIdPath'
      - $ref: '#/components/parameters/RunIdPath'
      - in: path
        name: stepId
        required: true
        schema: { type: string }
        description: Step id the run is paused at.
    post:
      tags: [pipelines]
      summary: Resume a run paused at a debug breakpoint
      description: |
        Resumes execution at a paused breakpoint. Body action selects how
        to proceed: `continue` (default, single-step past the breakpoint),
        `step_over`, or `resume_all` (drop all remaining breakpoints).
      operationId: resolvePipelineBreakpoint
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [continue, step_over, resume_all]
                  default: continue
      responses:
        '204':
          description: Breakpoint resolved
        '400':
          description: Invalid `action` value
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '409':
          description: Run is not paused at this step
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '503':
          description: Pipeline bridge does not expose `resolveBreakpoint`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pipelines/{pipelineId}/runs/{runId}/breakpoint/{stepId}/patch:
    parameters:
      - $ref: '#/components/parameters/PipelineIdPath'
      - $ref: '#/components/parameters/RunIdPath'
      - in: path
        name: stepId
        required: true
        schema: { type: string }
        description: Step id the run is paused at.
    post:
      tags: [pipelines]
      summary: Apply a context patch while paused at a breakpoint (edit-and-continue)
      description: |
        hub#2226 edit-and-continue surface. Mutates the paused step's
        context via either a `merge` patch (shallow value override) or a
        JSON-Patch ops array. The executor's validator may reject the
        patch with 422; the run state is unchanged on rejection.
      operationId: applyPipelineBreakpointPatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patch]
              properties:
                patch:
                  oneOf:
                    - type: object
                      required: [mode, values]
                      properties:
                        mode: { type: string, enum: [merge] }
                        values:
                          type: object
                          additionalProperties: true
                    - type: object
                      required: [mode, ops]
                      properties:
                        mode: { type: string, enum: [jsonPatch] }
                        ops:
                          type: array
                          items: { type: object, additionalProperties: true }
                appliedBy:
                  type: string
                  description: Optional override of `actorUserId` for the audit row.
      responses:
        '200':
          description: Patch applied; returns the executor's `PatchResult`
          content:
            application/json:
              schema:
                type: object
                required: [patchId]
                properties:
                  patchId: { type: string }
                  before: { type: object, additionalProperties: true }
                  after: { type: object, additionalProperties: true }
                  validation:
                    type: object
                    properties:
                      ok: { type: boolean }
                      reason: { type: string }
                additionalProperties: true
        '400':
          description: Missing or malformed `patch`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          description: Run not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '409':
          description: Run is not paused at this step
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '422':
          description: Validator rejected the patch (`validation.ok === false`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '503':
          description: Pipeline bridge does not expose `patchPausedContext`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pipelines/{pipelineId}/runs/{runId}/breakpoint/{stepId}/patch/{patchId}:
    parameters:
      - $ref: '#/components/parameters/PipelineIdPath'
      - $ref: '#/components/parameters/RunIdPath'
      - in: path
        name: stepId
        required: true
        schema: { type: string }
      - in: path
        name: patchId
        required: true
        schema: { type: string }
        description: Patch id returned by the prior POST /patch.
    delete:
      tags: [pipelines]
      summary: Revert a previously-applied paused-context patch
      description: |
        Companion to POST /patch. Reverts the named patch via
        `bridge.revertContextPatch`. Returns 204 on success.
      operationId: revertPipelineBreakpointPatch
      responses:
        '204':
          description: Patch reverted
        '404':
          description: Run not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '409':
          description: Run is not paused at this step
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '503':
          description: Pipeline bridge does not expose `revertContextPatch`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # --- Pending approvals queue --------------------------------------------
  # Surfaces `PipelineModule.getPendingApprovals()` to the frontend so the
  # approvals inbox can render across all in-flight runs in one round-trip.
  # Static segment — registered BEFORE both `/pipelines/{pipelineId}/...`
  # and `/pipelines/{runId}/approvals` so it isn't captured as a path
  # param. When the bridge isn't wired (or doesn't implement this method)
  # the route returns `{ approvals: [] }` with HTTP 200 — empty queue is a
  # valid answer in stub mode, NOT a 503.
  /pipelines/approvals:
    get:
      tags: [pipelines]
      summary: List pending approvals across all in-flight runs on this node
      description: |
        Returns every Approval node currently waiting on this gateway node.
        Pass `?userId=` to filter to rows where the given user appears in
        `approvers`; omit it to receive everything (the frontend's
        approvals inbox typically filters visually).

        ## Stub mode
        When no live `PipelineBridge` is wired (Phase 1 / pre-bootstrap)
        the route returns `{ approvals: [] }` with HTTP 200. Frontend
        consumers should NOT treat the empty list as an error — it is the
        documented Phase-1 fallback.
      operationId: listPendingApprovals
      parameters:
        - in: query
          name: userId
          required: false
          schema:
            type: string
          description: |
            Optional approver-user filter. When present, only rows where
            this `userId` appears in `approvers[]` are returned.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [approvals]
                properties:
                  approvals:
                    type: array
                    items:
                      $ref: '#/components/schemas/PendingApprovalRow'
        '401': { $ref: '#/components/responses/Unauthorized' }

  # --- Approvals -----------------------------------------------------------
  # Approvals are addressed by `runId` directly (not pipeline-scoped) — the
  # caller resolving an approval generally does not know / care which
  # pipeline produced the run, only the runId on the approval card.
  /pipelines/{runId}/approvals:
    parameters:
      - $ref: '#/components/parameters/RunIdPath'
    post:
      tags: [pipelines]
      summary: Record an approval / rejection on a waiting Approval node
      description: |
        Resolves the approval gate for a run that is `awaiting_approval`.
        The approver's user id is taken from the bearer token and recorded
        in the resulting `pipeline.approval.recorded` event. Idempotent on
        `(runId, stepId, userId)`: a second call with the same triple is a
        no-op and returns the existing record.
      operationId: recordApproval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordApprovalRequest'
      responses:
        '200':
          description: Approval recorded (or replayed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordApprovalResponse'
        '400':
          description: Missing `stepId`/`decision` or invalid decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Run not found, or not awaiting_approval, or stepId not in waiting set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401': { $ref: '#/components/responses/Unauthorized' }

  # --- Observability -------------------------------------------------------
  /observability/dashboard:
    get:
      tags: [pipelines]
      summary: Aggregated dashboard snapshot
      description: |
        Single-shot read-only payload backing `/observability` — KPI tiles,
        cluster health, active runs, recent events, alerts. Computed
        server-side so the dashboard renders in one round-trip.
      operationId: getObservabilityDashboard
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservabilityDashboard'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /observability/metrics:
    get:
      tags: [pipelines]
      summary: Time-series metrics for the metrics route
      description: |
        Aliases `/pipelines/metrics` and may add additional time-series the
        Metrics chart grid needs. Phase 1 returns the same shape as
        `/pipelines/metrics` with optional series fields.
      operationId: getObservabilityMetrics
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineMetrics'
        '401': { $ref: '#/components/responses/Unauthorized' }

  # --- Metrics -------------------------------------------------------------
  /pipelines/metrics:
    get:
      tags: [pipelines]
      summary: Aggregate pipeline runtime metrics
      description: |
        Phase 1 returns a synthesized, deterministic-ish snapshot driven by
        wall-clock buckets — enough to validate polling and rendering.
        Phase 4 returns `pipelineModule.getMetrics()`.
      operationId: getPipelineMetrics
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineMetrics'
        '401': { $ref: '#/components/responses/Unauthorized' }

  # --- Dashboard data (module-driven dashboard pass-through) ---------------
  /pipelines/dashboard-data:
    get:
      tags: [pipelines]
      summary: PipelineModule dashboard payload (module-driven KPIs + charts + alerts)
      description: |
        Pass-through of the embedded distributed-core `PipelineModule.getDashboardData()`.
        Surfaces a uniform ApplicationModule observability shape (summary KPIs,
        chart definitions, alerts) so the frontend can render a module-driven
        dashboard without hand-rolling the same view from `/pipelines/metrics`.

        `source` reports the data origin:
          - `bridge` — live bridge response
          - `stub`   — bridge unavailable; synthesized stub
          - `error`  — bridge threw; `error` field describes what
      operationId: getPipelineDashboardData
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineDashboardDataResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500':
          description: Bridge threw
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineDashboardDataError' }

  # --- Health (bridge-probe-instrumented liveness/readiness) ---------------
  /pipelines/health:
    get:
      tags: [pipelines]
      summary: Pipeline subsystem health + bridge live probes
      description: |
        Runtime introspection for the pipeline subsystem. Reports overall
        status (`ok` | `degraded` | `unwired`), embedded-cluster + LLM-client
        readiness, last event timestamp, and per-subsystem bridge probe
        results so operators can distinguish "bridge said zero" from
        "bridge hung" from "bridge threw".

        Always 200 on probe-individual timeouts/errors — those surface in
        `probes.<subsystem>.status`. 500 only when the probe itself fails
        catastrophically (e.g. the bridge accessor throws synchronously).
      operationId: getPipelineHealth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineHealth' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500':
          description: Probe failed catastrophically
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  # --- Pipeline validation (structural lint) -------------------------------
  /pipelines/validate:
    post:
      tags: [pipelines]
      summary: Structural lint a pipeline definition
      description: |
        Pure-function structural validation of a pipeline definition
        (nodes + edges). Mirrors the frontend's `validatePipelineStructural`
        so client-side validation and server-side validation agree.
        Returns the lint result without persisting anything.
      operationId: validatePipeline
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValidatePipelineRequest' }
      responses:
        '200':
          description: Validation result (may include errors/warnings)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # --- Ops surface --------------------------------------------------------
  # Operator-facing pipeline endpoints: active runs, queue inspector,
  # dead-letter queue, LLM streaming proxy, cross-run audit search, per-
  # pipeline cost rollup, and run cancellation. Each static segment is
  # mounted BEFORE the `:pipelineId` mount in src/routes/index.ts so the
  # words `runs`, `inspector`, `dlq`, `llm`, `audit` don't get captured
  # as path params.

  /pipelines/runs/active:
    get:
      tags: [pipelines]
      summary: List active runs for the caller
      description: |
        Returns the in-flight run summaries the bridge knows about for
        the caller's userId. Falls back to the in-memory stub store when
        the bridge isn't wired (Phase 1).
      operationId: listActivePipelineRuns
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pipelines/inspector/pending:
    get:
      tags: [pipelines]
      summary: List pending runs in the executor's queue
      description: |
        Paginated listing of pending run envelopes from distributed-core's
        T13 `QueueInspector` (lib-expansion-3). Returns 503 when the
        bridge does not expose `getInspector()`.
      operationId: listPipelineInspectorPending
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 0, maximum: 200, default: 50 }
        - in: query
          name: cursor
          schema: { type: string }
          description: Opaque pagination cursor from a prior response.
      responses:
        '200':
          description: Page of pending envelopes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Inspector `Page` shape (items + nextCursor).
        '503':
          description: Pipeline inspector unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pipelines/inspector/inflight:
    get:
      tags: [pipelines]
      summary: List leased / in-flight inspector entries
      description: |
        Returns leased entries from the inspector. Always empty today —
        the in-memory queue does not lease — kept on the surface for
        when a durable queue with leases lands.
      operationId: listPipelineInspectorInflight
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 0, maximum: 200, default: 50 }
      responses:
        '200':
          description: Leased entries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { type: object, additionalProperties: true }
        '503':
          description: Pipeline inspector unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pipelines/inspector/summary:
    get:
      tags: [pipelines]
      summary: Aggregate inspector snapshot
      description: |
        Returns the inspector's aggregate summary (queue depth, inflight
        count, oldest age, etc.). 503 when the bridge does not expose an
        inspector.
      operationId: getPipelineInspectorSummary
      responses:
        '200':
          description: Inspector summary snapshot
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '503':
          description: Pipeline inspector unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pipelines/inspector/peek/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunIdPath'
    get:
      tags: [pipelines]
      summary: Peek at a single pending envelope by runId
      operationId: peekPipelineInspectorRun
      responses:
        '200':
          description: Pending envelope for `runId`
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404':
          description: Run not currently in the pending queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '503':
          description: Pipeline inspector unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pipelines/dlq:
    get:
      tags: [pipelines]
      summary: List EventBus dead-letter entries
      description: |
        Paginated list of dead-letter entries from distributed-core's
        `InMemoryDeadLetterQueue` (T9). Every row is enriched with a
        derived `errorKind` parsed from the `lastError` prefix.
      operationId: listPipelineDLQ
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 0, maximum: 200, default: 50 }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: sinceMs
          schema: { type: number, minimum: 0 }
          description: Lower bound on entry timestamp (epoch ms).
        - in: query
          name: errorKind
          schema: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_]{0,79}$' }
          description: |
            Filter to entries whose `lastError` begins with `<errorKind>:`.
            Rejected with 400 when the value does not match the pattern.
      responses:
        '200':
          description: DLQ page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        errorKind:
                          type: string
                          nullable: true
                          description: Derived from the `lastError` prefix; null when unparseable.
                  nextCursor: { type: string }
        '400':
          description: Malformed `errorKind` filter
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '503':
          description: DLQ unavailable or disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pipelines/dlq/peek/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
        description: DLQ entry id.
    get:
      tags: [pipelines]
      summary: Peek a single DLQ entry
      operationId: peekPipelineDLQEntry
      responses:
        '200':
          description: DLQ entry (enriched with `errorKind`)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404':
          description: DLQ entry not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '503':
          description: DLQ unavailable or disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pipelines/dlq/redrive:
    post:
      tags: [pipelines]
      summary: Re-publish selected DLQ entries to the EventBus
      description: |
        Pass `{ ids: [...] }` to redrive specific entries. Set
        `resetAttempts: true` to clear the attempt counter on redrive.
        Set `preview: true` for a no-op dry-run that returns
        `{ wouldRedrive, notFound }` without mutating the DLQ. The route
        attaches `pipelineWriteRateLimit` (10 writes/min/user, shared
        with /purge).
      operationId: redrivePipelineDLQ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string }
                  minItems: 1
                resetAttempts: { type: boolean, default: false }
                preview: { type: boolean, default: false }
      responses:
        '200':
          description: 'Redrive result (or `preview: true` dry-run summary)'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  preview: { type: boolean }
                  resetAttempts: { type: boolean }
                  wouldRedrive:
                    type: array
                    items: { type: object, additionalProperties: true }
                  notFound:
                    type: array
                    items:
                      type: object
                      properties: { id: { type: string } }
        '400':
          description: '`body.ids` missing or not a string array'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '429':
          description: Per-user rate limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '503':
          description: DLQ unavailable or disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pipelines/dlq/purge:
    post:
      tags: [pipelines]
      summary: Drop selected DLQ entries
      description: |
        Pass `{ ids: [...] }` to purge specific entries. Set
        `preview: true` for a no-op dry-run. Shares the same
        `pipelineWriteRateLimit` budget as /redrive.
      operationId: purgePipelineDLQ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string }
                  minItems: 1
                preview: { type: boolean, default: false }
      responses:
        '200':
          description: 'Purge result (or `preview: true` dry-run summary)'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  preview: { type: boolean }
                  wouldPurge:
                    type: array
                    items: { type: object, additionalProperties: true }
                  notFound:
                    type: array
                    items:
                      type: object
                      properties: { id: { type: string } }
        '400':
          description: '`body.ids` missing or not a string array'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '429':
          description: Per-user rate limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '503':
          description: DLQ unavailable or disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pipelines/llm/stream:
    post:
      tags: [pipelines]
      summary: Server-side LLM streaming proxy (SSE)
      description: |
        Streams token chunks back as Server-Sent Events. The API key
        lives server-side only — the frontend never sees it. Provider
        selected by `PIPELINE_LLM_PROVIDER` (`anthropic` default,
        `bedrock` supported). Rate-limited to 20 requests/min/user.

        ## SSE event shapes (AG-UI)
        Every event is emitted as `data: <json>\n\n`. The stream emits:
        - `RUN_STARTED` — opening envelope with `runId` + `threadId`.
        - `TEXT_MESSAGE_CONTENT` — token-delta chunks (zero or more).
        - `RUN_FINISHED` — terminal envelope on success.
        - `RUN_ERROR` — terminal envelope on failure (with `code` +
          `message`).

        On client disconnect (AbortController), the upstream LLM stream
        is cancelled to avoid wasting tokens.
      operationId: streamPipelineLLM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, systemPrompt, userPrompt]
              properties:
                model:
                  type: string
                  description: |
                    Model alias (`opus`/`sonnet`/`haiku`) or full model id.
                    Aliases resolve to the latest Claude 4.X release.
                systemPrompt: { type: string }
                userPrompt: { type: string }
                temperature: { type: number, minimum: 0, maximum: 2 }
                maxTokens: { type: integer, minimum: 1, maximum: 8192, default: 1024 }
      responses:
        '200':
          description: SSE token stream
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Newline-delimited `data: <json>` frames. Each `<json>`
                  is one of `RUN_STARTED`, `TEXT_MESSAGE_CONTENT`,
                  `RUN_FINISHED`, or `RUN_ERROR` (see description).
        '400':
          description: Missing or invalid request body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '429':
          description: Per-user rate limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pipelines/audit/search:
    get:
      tags: [pipelines]
      summary: Cross-run audit log search
      description: |
        Read-only search over the `pipeline-audit` DDB table. At least
        one of `actor` or `pipelineId` MUST be supplied — the query
        runs against the `actor-time-index` or `pipeline-time-index`
        GSI accordingly (pipelineId wins when both are present).
      operationId: searchPipelineAudit
      parameters:
        - in: query
          name: actor
          schema: { type: string }
          description: User id filter.
        - in: query
          name: pipelineId
          schema: { type: string }
          description: Pipeline id filter (wins over `actor` when both are present).
        - in: query
          name: action
          schema: { type: string }
          description: Comma-separated audit action filter (singular form retained for legacy callers).
        - in: query
          name: actions
          schema: { type: string }
          description: Comma-separated audit action filter (preferred plural form).
        - in: query
          name: since
          schema: { type: string, format: date-time }
        - in: query
          name: until
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200':
          description: Audit search page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { type: object, additionalProperties: true }
                  nextCursor: { type: string }
        '400':
          description: Neither `actor` nor `pipelineId` supplied, or invalid query
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pipelines/{pipelineId}/cost:
    parameters:
      - $ref: '#/components/parameters/PipelineIdPath'
    get:
      tags: [pipelines]
      summary: Aggregate LLM cost rollup for a pipeline
      description: |
        Sums `tokenUsage` and `estimatedCostUsd` across all persisted
        runs of `pipelineId` (capped at 200 most-recent runs).
        Per-model cost is recomputed from token counts using
        `llm-pricing.computeCost`.
      operationId: getPipelineCost
      responses:
        '200':
          description: Cost rollup
          content:
            application/json:
              schema:
                type: object
                required: [totalCostUsd, totalTokensIn, totalTokensOut, byModel, runCount]
                properties:
                  totalCostUsd: { type: number }
                  totalTokensIn: { type: integer, minimum: 0 }
                  totalTokensOut: { type: integer, minimum: 0 }
                  runCount: { type: integer, minimum: 0 }
                  byModel:
                    type: object
                    additionalProperties:
                      type: object
                      required: [tokensIn, tokensOut, costUsd]
                      properties:
                        tokensIn: { type: integer, minimum: 0 }
                        tokensOut: { type: integer, minimum: 0 }
                        costUsd: { type: number }
        '400':
          description: Missing `pipelineId`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pipelines/{runId}/cancel:
    parameters:
      - $ref: '#/components/parameters/RunIdPath'
    post:
      tags: [pipelines]
      summary: Cancel an in-flight pipeline run
      description: |
        Cancels the run via the bridge (or stub store when no bridge is
        wired). Returns the post-cancel run snapshot. Idempotent via
        `Idempotency-Key` (scope `pipeline-cancel`).
      operationId: cancelPipelineRun
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Optional operator-supplied reason recorded in the audit row.
      responses:
        '200':
          description: Cancel applied; returns the updated run snapshot
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400':
          description: Run is already in a terminal state, or invalid body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          description: Run not found (or not owned by the caller)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # --- /api/v2 — module-shaped pipeline router -----------------------------
  # Phase A of the distributed-core pipeline absorption: same handler code
  # that will eventually `git mv` into
  # distributed-core/src/applications/pipeline/http/. Lives under /api/v2/*
  # during migration so the legacy /api/pipelines/* surface keeps working
  # unchanged. New routes land here first; they get promoted to /api/* once
  # the legacy counterpart is removed. See
  # src/pipeline/http/createPipelineRouter.ts and contracts.ts.

  /v2/pipelines/{pipelineId}/runs:
    parameters:
      - $ref: '#/components/parameters/PipelineIdPath'
    post:
      tags: [pipelines]
      summary: Trigger a pipeline run (module-shaped router)
      description: |
        Same trigger surface as the legacy `/api/pipelines/{pipelineId}/runs`,
        but routed through the host-injected `deps.trigger` so the handler
        itself has zero platform-api specifics. Body `definition.id`, when
        supplied, MUST equal `:pipelineId`. The router uses bridge-error
        `502` (not `503`) when the host's `trigger` throws.
      operationId: triggerPipelineRunV2
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/V2PipelineTriggerRequest' }
      responses:
        '202':
          description: Trigger accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/V2PipelineTriggerResponse' }
        '400':
          description: '`definition.id` does not match `:pipelineId`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/V2PipelineErrorBody' }
        '502':
          description: Host-injected `trigger` threw (bridge unwired / framework error)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/V2PipelineErrorBody' }

  /v2/pipelines/{pipelineId}/runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/PipelineIdPath'
      - $ref: '#/components/parameters/RunIdPath'
    get:
      tags: [pipelines]
      summary: Fetch a single run snapshot (module-shaped router)
      description: |
        Live-then-store fallback. The runtime's in-memory snapshot is the
        freshest (full step input/output while a run is active), but it
        gets evicted once the run leaves the active set. The host's
        durable store is the long-term home. Returns whichever resolves
        first; 404 when both miss.
      operationId: getPipelineRunV2
      responses:
        '200':
          description: Run snapshot (live or stored)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/V2PipelineRunDetail' }
        '404':
          description: Run not found in either live runtime or durable store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/V2PipelineErrorBody' }

  # --- /api/capabilities — pipeline capability introspection --------------
  # Backend-side mirror of the gateway's capabilities surface so consumers
  # can query which AgenticPipelines are currently active without going
  # through the gateway. Data sourced from DefinitionsRepository.listAll()
  # (full operator-managed pipeline-definitions table scan).

  /capabilities/pipelines:
    get:
      tags: [pipelines]
      summary: List all registered pipeline capabilities
      description: |
        Operator-managed scan of every published pipeline definition.
        Returns a compact summary per pipeline so the SPA can render
        capability-gated UI without loading full definitions.
      operationId: listPipelineCapabilities
      responses:
        '200':
          description: All registered pipelines (summary form)
          content:
            application/json:
              schema:
                type: object
                required: [pipelines]
                properties:
                  pipelines:
                    type: array
                    items: { $ref: '#/components/schemas/PipelineCapabilitySummary' }
        '500':
          description: Repository scan failed
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string, enum: [internal_error] }
                  detail: { type: string }

  /capabilities/pipelines/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
        description: |
          Pipeline `name` (preferred) or DDB sort-key `id`. The handler
          matches on either, in that order.
    get:
      tags: [pipelines]
      summary: Detail for a single pipeline capability
      operationId: getPipelineCapability
      responses:
        '200':
          description: Pipeline detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineCapabilityDetail' }
        '404':
          description: Pipeline with that `name`/`id` not found
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string, enum: [pipeline_not_found] }
        '500':
          description: Repository scan failed
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string, enum: [internal_error] }
                  detail: { type: string }

  # --- Profiles (UserPicker) ----------------------------------------------
  /profiles:
    get:
      tags: [profiles]
      summary: Search user profiles by displayName / userId substring
      description: |
        Case-insensitive substring search. Visibility-gated: private
        profiles are only returned when the requester is the owner OR is
        in a mutual-follow relationship with the candidate.
      operationId: searchProfiles
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: Search query (1..100 chars)
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          description: Max results (clamped server-side to [1, 50])
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [profiles]
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProfileSummary'
        '400':
          description: Missing or invalid `q`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Cognito ID token. Passed as `Authorization: Bearer <token>`.
        Validated by `middleware/auth.ts` against the configured user pool.

  parameters:
    PipelineIdPath:
      in: path
      name: pipelineId
      required: true
      schema:
        type: string
      description: Pipeline definition identifier (opaque string, often UUID).

    RunIdPath:
      in: path
      name: runId
      required: true
      schema:
        type: string
        format: uuid
      description: Pipeline run identifier (UUID minted at trigger time).

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'

  schemas:
    # -----------------------------------------------------------------
    # Error envelope
    # -----------------------------------------------------------------
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Machine-readable error code (e.g. `not_found`, `invalid_body`).
        message:
          type: string
          description: Optional human-readable detail.

    # RFC 7807 problem-details body returned by /hooks/pipeline/{path} on a
    # signature-verification failure. Mirrors what the route emits — kept
    # narrow so SDK consumers get a stable shape.
    WebhookSignatureProblem:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          description: 'RFC 7807 problem type URI; `about:blank` for inline problems.'
        title:
          type: string
          enum: ['Invalid webhook signature']
        status:
          type: integer
          enum: [401]
        detail:
          type: string
          description: Human-readable reason — missing header vs digest mismatch.

    # -----------------------------------------------------------------
    # Trigger run request/response
    # -----------------------------------------------------------------
    TriggerRunRequest:
      type: object
      properties:
        triggerPayload:
          type: object
          additionalProperties: true
          description: Arbitrary payload merged into the run's initial context.
        definition:
          allOf:
            - $ref: '#/components/schemas/PipelineDefinition'
          description: |
            Inline pipeline definition. Optional in Phase 1; required in
            Phase 4 where distributed-core's `createResource` consumes it
            inline. When present `definition.id` MUST equal `:pipelineId`.

    TriggerRunResponse:
      type: object
      required: [runId, pipelineId, triggeredBy, at]
      properties:
        runId:
          type: string
          format: uuid
        pipelineId:
          type: string
        triggeredBy:
          type: object
          required: [userId, triggerType]
          properties:
            userId:
              type: string
            triggerType:
              type: string
              description: Phase 1 always emits `manual`.
        at:
          type: string
          format: date-time

    RecordApprovalRequest:
      type: object
      required: [stepId, decision]
      properties:
        stepId:
          type: string
          description: The Approval node id within the run that is being resolved.
        decision:
          type: string
          enum: [approve, reject]
        comment:
          type: string
          description: Optional human note attached to the ApprovalRecord.

    # Mirror of distributed-core's `PendingApprovalRow`, surfaced via
    # `PipelineModule.getPendingApprovals()`. Kept in lockstep with the
    # `PendingApprovalRow` interface in `routes/pipelineTriggers.ts`.
    PendingApprovalRow:
      type: object
      required: [runId, stepId, pipelineId, approvers, requestedAt]
      properties:
        runId:
          type: string
          format: uuid
        stepId:
          type: string
          description: The Approval node id within the run that is waiting.
        pipelineId:
          type: string
        approvers:
          type: array
          items:
            type: object
            required: [userId]
            properties:
              userId: { type: string }
              teamId: { type: string }
              role: { type: string }
        message:
          type: string
          description: Optional human-readable prompt set on the Approval node.
        requestedAt:
          type: string
          format: date-time

    RecordApprovalResponse:
      type: object
      required: [runId, stepId, decision, userId, at]
      properties:
        runId:
          type: string
          format: uuid
        stepId:
          type: string
        decision:
          type: string
          enum: [approve, reject]
        userId:
          type: string
          description: The token-bearing user that recorded the decision.
        at:
          type: string
          format: date-time
        runStatus:
          $ref: '#/components/schemas/RunStatus'
          description: Run status after the decision is applied.

    # -----------------------------------------------------------------
    # Profiles (UserPicker)
    # -----------------------------------------------------------------
    ProfileSummary:
      type: object
      required: [userId, displayName]
      properties:
        userId:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
          format: uri

    # -----------------------------------------------------------------
    # Pipeline metrics
    # -----------------------------------------------------------------
    PipelineMetrics:
      type: object
      required:
        - runsStarted
        - runsCompleted
        - runsFailed
        - runsActive
        - runsAwaitingApproval
        - avgDurationMs
        - llmTokensIn
        - llmTokensOut
        - estimatedCostUsd
        - asOf
      properties:
        runsStarted: { type: integer, minimum: 0 }
        runsCompleted: { type: integer, minimum: 0 }
        runsFailed: { type: integer, minimum: 0 }
        runsActive: { type: integer, minimum: 0 }
        runsAwaitingApproval: { type: integer, minimum: 0 }
        avgDurationMs: { type: number, minimum: 0 }
        llmTokensIn: { type: integer, minimum: 0 }
        llmTokensOut: { type: integer, minimum: 0 }
        estimatedCostUsd: { type: number, minimum: 0 }
        asOf:
          type: string
          format: date-time

    # -----------------------------------------------------------------
    # Node enums + per-type data
    # -----------------------------------------------------------------
    NodeType:
      type: string
      enum:
        - trigger
        - llm
        - agent
        - transform
        - condition
        - action
        - fork
        - join
        - approval
        - mcp-tool
        - 'image:vision-analyze'
        - scatter
        - 'image:crop'
        - 'image:adjust-bw'
        - 'image:adjust-layer'
        - 'image:save'
        - 'image:resize'
        - 'image:transform'
        - 'image:format-convert'
        - 'image:sharpen'
        - 'image:watermark'
        - 'image:generate'
        - 'image:variation'
        - 'image:edit-prompt'
        - 'image:upscale'
        - 'image:dimensions'
        - 'image:vision-classify'
        - 'image:vision-describe'
        - 'image:vision-tag'
        - 'image:vision-extract-text'
        - image-source

    TriggerType:
      type: string
      enum:
        - manual
        - document.finalize
        - document.comment
        - document.submit
        - schedule
        - webhook

    LLMProvider:
      type: string
      enum: [anthropic, bedrock]

    TransformType:
      type: string
      enum: [jsonpath, template, javascript]

    ActionType:
      type: string
      enum:
        - update-document
        - post-comment
        - notify
        - webhook
        - mcp-tool

    JoinMode:
      type: string
      enum: [all, any, n_of_m]

    JoinMergeStrategy:
      type: string
      enum: [deep-merge, array-collect, last-writer-wins]

    ApprovalTimeoutAction:
      type: string
      enum: [reject, approve, escalate]

    Approver:
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          enum: [user, role]
        value:
          type: string

    TriggerNodeData:
      type: object
      required: [type, triggerType]
      properties:
        type:
          type: string
          const: trigger
        triggerType:
          $ref: '#/components/schemas/TriggerType'
        documentTypeId:
          type: string
          description: Required for `document.*` triggers.
        schedule:
          type: string
          description: Cron expression; required when `triggerType === 'schedule'`.
        webhookPath:
          type: string
          description: Required when `triggerType === 'webhook'`.

    LLMNodeData:
      type: object
      required: [type, provider, model, systemPrompt, userPromptTemplate, streaming]
      properties:
        type:
          type: string
          const: llm
        provider:
          $ref: '#/components/schemas/LLMProvider'
        model:
          type: string
        systemPrompt:
          type: string
        userPromptTemplate:
          type: string
        temperature:
          type: number
          minimum: 0
          maximum: 2
        maxTokens:
          type: integer
          minimum: 1
        streaming:
          type: boolean

    TransformNodeData:
      type: object
      required: [type, transformType, expression]
      properties:
        type:
          type: string
          const: transform
        transformType:
          $ref: '#/components/schemas/TransformType'
        expression:
          type: string
        outputKey:
          type: string

    ConditionNodeData:
      type: object
      required: [type, expression]
      properties:
        type:
          type: string
          const: condition
        expression:
          type: string
        label:
          type: string

    ActionNodeData:
      type: object
      required: [type, actionType, config]
      properties:
        type:
          type: string
          const: action
        actionType:
          $ref: '#/components/schemas/ActionType'
        config:
          type: object
          additionalProperties: true
        idempotent:
          type: boolean
        onError:
          type: string
          enum: [route-error, fail-run]

    ForkNodeData:
      type: object
      required: [type, branchCount]
      properties:
        type:
          type: string
          const: fork
        branchCount:
          type: integer
          minimum: 2
          maximum: 8
        branchLabels:
          type: array
          items:
            type: string

    JoinNodeData:
      type: object
      required: [type, mode, mergeStrategy]
      properties:
        type:
          type: string
          const: join
        mode:
          $ref: '#/components/schemas/JoinMode'
        n:
          type: integer
          minimum: 1
          description: Required when `mode === 'n_of_m'`.
        mergeStrategy:
          $ref: '#/components/schemas/JoinMergeStrategy'

    ApprovalNodeData:
      type: object
      required: [type, approvers, requiredCount]
      properties:
        type:
          type: string
          const: approval
        approvers:
          type: array
          items:
            $ref: '#/components/schemas/Approver'
        requiredCount:
          type: integer
          minimum: 1
        timeoutMs:
          type: integer
          minimum: 0
        timeoutAction:
          $ref: '#/components/schemas/ApprovalTimeoutAction'
        message:
          type: string

    AgentNodeData:
      description: >-
        Agentic step (agent-step contract v1) — a bounded multi-turn agent
        loop with tool use, as opposed to `llm`, which is a single completion.
      type: object
      required: [type, prompt]
      properties:
        type:
          type: string
          const: agent
        prompt:
          type: string
          description: The task. Supports the same `{{ context.x }}` interpolation as `llm`.
        systemPrompt:
          type: string
        model:
          type: string
          description: Friendly alias ('sonnet' | 'opus' | 'haiku') or explicit model id.
        allowedTools:
          type: array
          items:
            type: string
          description: >-
            DEFAULT-DENY: absent or empty means the agent runs with NO tools
            and is equivalent to a plain `llm` step. Never widen implicitly.
        maxTurns:
          type: integer
          minimum: 1
          description: Hard ceiling on agent turns. Defaults to 8.
        timeoutMs:
          type: integer
          minimum: 0
          description: Wall-clock ceiling for the whole step. Defaults to 120000.

    AgentToolCall:
      description: One tool invocation inside an agent loop, as persisted on the step output.
      type: object
      required: [name, ok, startedAt]
      properties:
        name:
          type: string
        input: {}
        output: {}
        ok:
          type: boolean
        startedAt: { type: string, format: date-time }
        endedAt:
          type: string
          format: date-time
          description: Absent while the call is still in flight.
        error:
          type: string
          description: Present when `ok` is false.

    AgentStopReason:
      type: string
      enum: [complete, max_turns, timeout, error, cancelled]

    AgentStepOutput:
      description: >-
        `step.output` shape for an `agent` node; also persisted on
        `StepExecution.agent`, which is written on FAILED steps too (timeout /
        max_turns / error) where `output` is not.
      type: object
      required: [text, turns, toolCalls, model, tokensIn, tokensOut, stopReason, toolless]
      properties:
        text:
          type: string
          description: Final assistant text.
        turns:
          type: integer
          minimum: 0
        toolCalls:
          type: array
          items:
            $ref: '#/components/schemas/AgentToolCall'
        model:
          type: string
        tokensIn:
          type: integer
          minimum: 0
        tokensOut:
          type: integer
          minimum: 0
        stopReason:
          $ref: '#/components/schemas/AgentStopReason'
        toolless:
          type: boolean
          description: True when the step ran with no tools allowed (see `allowedTools`).

    NodeData:
      oneOf:
        - $ref: '#/components/schemas/TriggerNodeData'
        - $ref: '#/components/schemas/LLMNodeData'
        - $ref: '#/components/schemas/AgentNodeData'
        - $ref: '#/components/schemas/TransformNodeData'
        - $ref: '#/components/schemas/ConditionNodeData'
        - $ref: '#/components/schemas/ActionNodeData'
        - $ref: '#/components/schemas/ForkNodeData'
        - $ref: '#/components/schemas/JoinNodeData'
        - $ref: '#/components/schemas/ApprovalNodeData'
        - $ref: '#/components/schemas/ImageVisionAnalyzeNodeData'
        - $ref: '#/components/schemas/ScatterNodeData'
        - $ref: '#/components/schemas/ImageCropNodeData'
        - $ref: '#/components/schemas/ImageAdjustBwNodeData'
        - $ref: '#/components/schemas/ImageAdjustLayerNodeData'
        - $ref: '#/components/schemas/ImageSaveNodeData'
        - $ref: '#/components/schemas/ImageResizeNodeData'
        - $ref: '#/components/schemas/ImageTransformNodeData'
        - $ref: '#/components/schemas/ImageFormatConvertNodeData'
        - $ref: '#/components/schemas/ImageSharpenNodeData'
        - $ref: '#/components/schemas/ImageWatermarkNodeData'
        - $ref: '#/components/schemas/ImageGenerateNodeData'
        - $ref: '#/components/schemas/ImageVariationNodeData'
        - $ref: '#/components/schemas/ImageEditPromptNodeData'
        - $ref: '#/components/schemas/ImageUpscaleNodeData'
        - $ref: '#/components/schemas/ImageDimensionsNodeData'
        - $ref: '#/components/schemas/ImageVisionClassifyNodeData'
        - $ref: '#/components/schemas/ImageVisionDescribeNodeData'
        - $ref: '#/components/schemas/ImageVisionTagNodeData'
        - $ref: '#/components/schemas/ImageVisionExtractTextNodeData'
        - $ref: '#/components/schemas/ImageSourceNodeData'
      discriminator:
        propertyName: type
        mapping:
          trigger: '#/components/schemas/TriggerNodeData'
          llm: '#/components/schemas/LLMNodeData'
          agent: '#/components/schemas/AgentNodeData'
          transform: '#/components/schemas/TransformNodeData'
          condition: '#/components/schemas/ConditionNodeData'
          action: '#/components/schemas/ActionNodeData'
          fork: '#/components/schemas/ForkNodeData'
          join: '#/components/schemas/JoinNodeData'
          approval: '#/components/schemas/ApprovalNodeData'
          'image:vision-analyze': '#/components/schemas/ImageVisionAnalyzeNodeData'
          scatter: '#/components/schemas/ScatterNodeData'
          'image:crop': '#/components/schemas/ImageCropNodeData'
          'image:adjust-bw': '#/components/schemas/ImageAdjustBwNodeData'
          'image:adjust-layer': '#/components/schemas/ImageAdjustLayerNodeData'
          'image:save': '#/components/schemas/ImageSaveNodeData'
          'image:resize': '#/components/schemas/ImageResizeNodeData'
          'image:transform': '#/components/schemas/ImageTransformNodeData'
          'image:format-convert': '#/components/schemas/ImageFormatConvertNodeData'
          'image:sharpen': '#/components/schemas/ImageSharpenNodeData'
          'image:watermark': '#/components/schemas/ImageWatermarkNodeData'
          'image:generate': '#/components/schemas/ImageGenerateNodeData'
          'image:variation': '#/components/schemas/ImageVariationNodeData'
          'image:edit-prompt': '#/components/schemas/ImageEditPromptNodeData'
          'image:upscale': '#/components/schemas/ImageUpscaleNodeData'
          'image:dimensions': '#/components/schemas/ImageDimensionsNodeData'
          'image:vision-classify': '#/components/schemas/ImageVisionClassifyNodeData'
          'image:vision-describe': '#/components/schemas/ImageVisionDescribeNodeData'
          'image:vision-tag': '#/components/schemas/ImageVisionTagNodeData'
          'image:vision-extract-text': '#/components/schemas/ImageVisionExtractTextNodeData'
          image-source: '#/components/schemas/ImageSourceNodeData'

    # -----------------------------------------------------------------
    # Graph
    # -----------------------------------------------------------------
    PipelineNode:
      type: object
      required: [id, type, position, data]
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/NodeType'
        position:
          type: object
          required: [x, y]
          properties:
            x: { type: number }
            y: { type: number }
        data:
          $ref: '#/components/schemas/NodeData'

    PipelineEdge:
      type: object
      required: [id, source, sourceHandle, target, targetHandle]
      properties:
        id:
          type: string
        source:
          type: string
        sourceHandle:
          type: string
          description: >-
            'out', 'true'/'false', 'branch-N', 'approved'/'rejected', 'error'.
        target:
          type: string
        targetHandle:
          type: string
          description: "'in' or 'in-N' for Join."

    TriggerBinding:
      type: object
      required: [event]
      properties:
        event:
          $ref: '#/components/schemas/TriggerType'
        documentTypeId: { type: string }
        schedule: { type: string }
        webhookPath: { type: string }
        webhookSecret:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: |
            32-byte HMAC-SHA256 secret (64 lowercase hex chars). Minted
            server-side on first PUT of a webhook-trigger binding; surfaced
            in `PipelineDefinition` responses so the UI can show it for
            copy-out into the external webhook source. Absent ⇒ the public
            `/hooks/pipeline/:path` route accepts unsigned requests
            (Phase-1 dev fallback).

    PipelineStatus:
      type: string
      enum: [draft, published]

    PipelineDefinition:
      type: object
      required:
        - id
        - name
        - version
        - status
        - nodes
        - edges
        - createdAt
        - updatedAt
        - createdBy
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
          description: Normalized (lowercase, trimmed) free-form labels.
        icon:
          type: string
        version:
          type: integer
          minimum: 0
          description: Bumped on each save.
        status:
          $ref: '#/components/schemas/PipelineStatus'
        publishedVersion:
          type: integer
          minimum: 0
        publishedSnapshot:
          $ref: '#/components/schemas/PipelineDefinitionSnapshot'
          description: |
            Deep clone of the definition at last publish (minus
            `publishedSnapshot` itself, to avoid recursion). Drives the
            VersionDiffModal — populated by `publishPipeline`.
        triggerBinding:
          $ref: '#/components/schemas/TriggerBinding'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/PipelineNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/PipelineEdge'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string

    # -----------------------------------------------------------------
    # Runtime
    # -----------------------------------------------------------------
    RunStatus:
      type: string
      description: |
        Run lifecycle vocabulary. Mirrors distributed-core's `RunStatus`.
        `stuck` is NON-terminal: `StuckRunDetector` emits `pipeline:run:stuck`
        when a `running` / `awaiting_approval` run stops heartbeating past the
        threshold, but the run is still open and may still reach `completed`,
        `failed` or `cancelled`. The operator escape hatch is force-fail,
        which moves the run to the platform-api-only `interrupted` state.
      enum:
        - pending
        - running
        - awaiting_approval
        - paused_at_breakpoint
        - completed
        - rejected
        - failed
        - cancelled
        - stuck

    StepStatus:
      type: string
      enum:
        - pending
        - running
        - completed
        - failed
        - skipped
        - cancelled
        - awaiting

    ApprovalRecord:
      type: object
      required: [userId, decision, at]
      properties:
        userId:
          type: string
        decision:
          type: string
          enum: [approve, reject]
        comment:
          type: string
        at:
          type: string
          format: date-time

    StepExecutionLLM:
      type: object
      required: [prompt, response, tokensIn, tokensOut]
      properties:
        prompt: { type: string }
        response: { type: string }
        tokensIn:
          type: integer
          minimum: 0
        tokensOut:
          type: integer
          minimum: 0

    StepExecution:
      type: object
      required: [nodeId, status]
      properties:
        nodeId:
          type: string
        status:
          $ref: '#/components/schemas/StepStatus'
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        durationMs:
          type: number
          minimum: 0
        input: {}
        output: {}
        error:
          type: string
        llm:
          $ref: '#/components/schemas/StepExecutionLLM'
        agent:
          allOf:
            - $ref: '#/components/schemas/AgentStepOutput'
          description: >-
            Agent-specific result, populated by `agent` steps. Present on
            FAILED steps too — read `stopReason` here to find out how the
            loop ended.
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalRecord'

    PipelineRunTrigger:
      type: object
      required: [triggerType, payload]
      properties:
        userId:
          type: string
        triggerType:
          type: string
        payload:
          type: object
          additionalProperties: true

    RunRejection:
      description: >-
        Why a run ended in `status: rejected` — which approval gate was
        rejected, by whom, when and why. Present iff `status` is `rejected`.
      type: object
      required: [stepId, userId, at]
      properties:
        stepId:
          type: string
          description: Node id of the approval gate that was rejected.
        userId:
          type: string
          description: >-
            Who rejected. `system:timeout` for a `timeoutAction: reject`
            expiry.
        comment:
          type: string
          description: Free-text reason supplied with the decision, when present.
        at:
          type: string
          format: date-time

    PipelineRunError:
      type: object
      required: [nodeId, message]
      properties:
        nodeId:
          type: string
        message:
          type: string
        stack:
          type: string

    PipelineRun:
      type: object
      required:
        - id
        - pipelineId
        - pipelineVersion
        - status
        - triggeredBy
        - ownerNodeId
        - startedAt
        - currentStepIds
        - steps
        - context
      properties:
        id:
          type: string
        pipelineId:
          type: string
        pipelineVersion:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/RunStatus'
        triggeredBy:
          $ref: '#/components/schemas/PipelineRunTrigger'
        ownerNodeId:
          type: string
          description: Distributed-core ResourceRouter owner.
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        durationMs:
          type: number
          minimum: 0
        currentStepIds:
          type: array
          items:
            type: string
          description: Active frontier — can be > 1 with Fork.
        steps:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/StepExecution'
        context:
          type: object
          additionalProperties: true
        error:
          $ref: '#/components/schemas/PipelineRunError'
        rejection:
          allOf:
            - $ref: '#/components/schemas/RunRejection'
          description: >-
            Present iff `status` is `rejected`. Lets the Runs list explain a
            rejection without opening the run.

    # -----------------------------------------------------------------
    # Validation (pure client-side result, included for SDK completeness)
    # -----------------------------------------------------------------
    ValidationCode:
      type: string
      enum:
        - NO_TRIGGER
        - MULTIPLE_TRIGGERS
        - CYCLE_DETECTED
        - INVALID_HANDLE
        - MISSING_CONFIG
        - APPROVAL_NO_APPROVERS
        - JOIN_INSUFFICIENT_INPUTS
        - ORPHAN_NODE
        - DEAD_END
        - UNUSED_FORK_BRANCH
        - UNUSED_CONDITION_BRANCH
        - NO_ERROR_HANDLER
        - LLM_NO_MAX_TOKENS
        - UNGUARDED_APPROVAL_TIMEOUT
        - LARGE_FORK
        - DEEP_CHAIN
        - DUPLICATE_NODE_NAME
        - LOW_TEMPERATURE_NON_DETERMINISTIC_PROMPT
        - NO_PUBLISHED_VERSION_BUT_TRIGGER_SCHEDULED

    ValidationIssue:
      type: object
      required: [code, message, severity]
      properties:
        code:
          $ref: '#/components/schemas/ValidationCode'
        message:
          type: string
        severity:
          type: string
          enum: [error, warning]
        nodeId:
          type: string
        edgeId:
          type: string
        field:
          type: string

    ValidationResult:
      type: object
      required: [errors, warnings, isValid, canPublish]
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
        isValid:
          type: boolean
          description: "`errors.length === 0`."
        canPublish:
          type: boolean
          description: "`errors.length === 0` — blocks publish (and therefore run), not save."

    # -----------------------------------------------------------------
    # POST /pipelines/validate request body — looser than PipelineDefinition.
    # Structural validation only looks at id + nodes + edges; per-node-data
    # shapes are intentionally not constrained here so frontend drafts
    # (mid-edit, partially-typed) can still be validated.
    # -----------------------------------------------------------------
    ValidatePipelineRequest:
      type: object
      required: [definition]
      properties:
        definition:
          type: object
          required: [id, nodes, edges]
          properties:
            id: { type: string }
            nodes:
              type: array
              items:
                type: object
                required: [id, type]
                properties:
                  id: { type: string }
                  type: { type: string }
                  data:
                    type: object
                    additionalProperties: true
                additionalProperties: true
            edges:
              type: array
              items:
                type: object
                required: [id, source, target]
                properties:
                  id: { type: string }
                  source: { type: string }
                  target: { type: string }
                  sourceHandle: { type: string }
                  targetHandle: { type: string }
                additionalProperties: true
          additionalProperties: true

    # -----------------------------------------------------------------
    # /pipelines/health — bridge-probe-instrumented liveness/readiness.
    # -----------------------------------------------------------------
    PipelineHealthProbeStatus:
      type: string
      enum: [ok, timeout, error]
      description: |
        `ok` — the probe returned a usable value within the timeout.
        `timeout` — the probe didn't settle within ~1s.
        `error` — the probe threw or returned a malformed value.

    PipelineHealthProbeResultBoolean:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/PipelineHealthProbeStatus' }
        value: { type: boolean }
        message:
          type: string
          description: Present when status is `error`.

    PipelineHealthProbeResultInteger:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/PipelineHealthProbeStatus' }
        value: { type: integer, minimum: 0 }
        message:
          type: string
          description: Present when status is `error`.

    PipelineHealthProbes:
      type: object
      required: [bridgeWired, runsActive, runsAwaitingApproval, pendingApprovals]
      properties:
        bridgeWired: { $ref: '#/components/schemas/PipelineHealthProbeResultBoolean' }
        runsActive: { $ref: '#/components/schemas/PipelineHealthProbeResultInteger' }
        runsAwaitingApproval: { $ref: '#/components/schemas/PipelineHealthProbeResultInteger' }
        pendingApprovals: { $ref: '#/components/schemas/PipelineHealthProbeResultInteger' }

    PipelineHealthTokenRate:
      type: object
      required: [perSec1s, perSec10s, perSec60s]
      properties:
        perSec1s: { type: number, minimum: 0 }
        perSec10s: { type: number, minimum: 0 }
        perSec60s: { type: number, minimum: 0 }

    PipelineHealth:
      type: object
      required:
        - status
        - embeddedClusterReady
        - llmClientConfigured
        - pipelineModuleConnected
        - lastEventAt
        - tokenRate
        - asOf
        - bridgeWired
        - runsActive
        - runsAwaitingApproval
        - pendingApprovals
        - probes
      properties:
        status:
          type: string
          enum: [ok, degraded, unwired]
        embeddedClusterReady: { type: boolean }
        llmClientConfigured: { type: boolean }
        pipelineModuleConnected: { type: boolean }
        lastEventAt:
          type: string
          format: date-time
          nullable: true
        tokenRate:
          oneOf:
            - $ref: '#/components/schemas/PipelineHealthTokenRate'
            - type: 'null'
        asOf: { type: string, format: date-time }
        bridgeWired: { type: boolean }
        runsActive: { type: integer, minimum: 0 }
        runsAwaitingApproval: { type: integer, minimum: 0 }
        pendingApprovals: { type: integer, minimum: 0 }
        probes: { $ref: '#/components/schemas/PipelineHealthProbes' }

    # -----------------------------------------------------------------
    # /pipelines/dashboard-data — ApplicationModule observability shape.
    # The bridge / stub payload comes from distributed-core; treated as
    # opaque here (additionalProperties: true) to avoid duplicating the
    # upstream schema. `source` carries the data origin.
    # -----------------------------------------------------------------
    PipelineDashboardDataResponse:
      type: object
      required: [source, moduleId, moduleName, state, summary, charts, alerts]
      properties:
        source:
          type: string
          enum: [bridge, stub]
        moduleId: { type: string }
        moduleName: { type: string }
        state:
          type: string
          description: distributed-core ModuleState (RUNNING, etc.).
        summary:
          type: object
          additionalProperties: true
        charts:
          type: array
          items:
            type: object
            additionalProperties: true
        alerts:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true

    PipelineDashboardDataError:
      type: object
      required: [source, error]
      properties:
        source:
          type: string
          enum: [error]
        error: { type: string }

    # -----------------------------------------------------------------
    # PipelineDefinitionSnapshot — same shape as PipelineDefinition minus
    # `publishedSnapshot` to avoid recursion. Persisted at publish time.
    # -----------------------------------------------------------------
    PipelineDefinitionSnapshot:
      type: object
      required:
        - id
        - name
        - version
        - status
        - nodes
        - edges
        - createdAt
        - updatedAt
        - createdBy
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        tags:
          type: array
          items: { type: string }
        icon: { type: string }
        version:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/PipelineStatus'
        publishedVersion:
          type: integer
          minimum: 0
        triggerBinding:
          $ref: '#/components/schemas/TriggerBinding'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/PipelineNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/PipelineEdge'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy: { type: string }

    # -----------------------------------------------------------------
    # Wire event envelope — wraps every PipelineEventMap event as it
    # crosses the network boundary. `seq` is monotonic per-run and stable
    # across replays; clients dedupe on it (NEVER on `emittedAt`).
    # -----------------------------------------------------------------
    PipelineEventType:
      type: string
      enum:
        - pipeline.run.started
        - pipeline.run.completed
        - pipeline.run.failed
        - pipeline.run.cancelled
        - pipeline.run.orphaned
        - pipeline.run.reassigned
        - pipeline.step.started
        - pipeline.step.completed
        - pipeline.step.failed
        - pipeline.step.skipped
        - pipeline.step.cancelled
        - pipeline.llm.prompt
        - pipeline.llm.token
        - pipeline.llm.response
        - pipeline.approval.requested
        - pipeline.approval.recorded
        - pipeline.run.paused
        - pipeline.run.resumed
        - pipeline.run.resumeFromStep
        - pipeline.run.retry
        - pipeline.join.waiting
        - pipeline.join.fired

    PipelineWireEvent:
      type: object
      required: [eventType, payload, seq, sourceNodeId, emittedAt]
      properties:
        eventType:
          $ref: '#/components/schemas/PipelineEventType'
        payload:
          type: object
          additionalProperties: true
          description: Shape varies per `eventType`; see PipelineEventMap in pipeline.ts.
        seq:
          type: integer
          minimum: 0
          description: Monotonic per-run sequence — stable across replays. Clients dedupe on this.
        sourceNodeId:
          type: string
          description: Node id (cluster node, not graph node) that emitted the event.
        emittedAt:
          type: integer
          description: Wall-clock emission time (ms). Re-stamped on replay; NEVER use for dedupe.

    # -----------------------------------------------------------------
    # Observability dashboard payload — the single-shot read backing /observability
    # -----------------------------------------------------------------
    ObservabilityKpi:
      type: object
      required: [value]
      properties:
        value: { type: number }
        deltaPct:
          type: number
          description: Percent change vs the prior comparable window (negative for decrease).
        sparkline:
          type: array
          items: { type: number }

    ObservabilityClusterNode:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [healthy, degraded, dead]
        cpuSamples:
          type: array
          items: { type: number }
          description: Last-60s CPU samples (0..1).
        connectionCount:
          type: integer
          minimum: 0
        activeRunCount:
          type: integer
          minimum: 0
        role: { type: string }
        region: { type: string }

    ObservabilityActiveRun:
      type: object
      required: [runId, pipelineId, pipelineName, status, ownerNodeId, startedAt]
      properties:
        runId: { type: string, format: uuid }
        pipelineId: { type: string }
        pipelineName: { type: string }
        status: { $ref: '#/components/schemas/RunStatus' }
        currentStepLabel:
          type: string
          description: e.g. "step 3/7 (llm)" or "awaiting approval".
        ownerNodeId: { type: string }
        startedAt:
          type: string
          format: date-time
        elapsedMs:
          type: integer
          minimum: 0

    ObservabilityRecentEvent:
      type: object
      required: [eventType, runId, at]
      properties:
        eventType:
          $ref: '#/components/schemas/PipelineEventType'
        runId: { type: string, format: uuid }
        pipelineName: { type: string }
        stepId: { type: string }
        durationMs: { type: integer, minimum: 0 }
        at: { type: string, format: date-time }

    ObservabilityAlert:
      type: object
      required: [id, severity, message, at]
      properties:
        id: { type: string }
        severity:
          type: string
          enum: [info, warning, critical]
        message: { type: string }
        contextLink: { type: string }
        at:
          type: string
          format: date-time

    ObservabilityDashboard:
      type: object
      required: [kpis, cluster, activeRuns, recentEvents, alerts, asOf]
      properties:
        kpis:
          type: object
          required: [runsToday, activeNow, pendingApprovals, failed24h]
          properties:
            runsToday:
              $ref: '#/components/schemas/ObservabilityKpi'
            activeNow:
              $ref: '#/components/schemas/ObservabilityKpi'
            pendingApprovals:
              $ref: '#/components/schemas/ObservabilityKpi'
            failed24h:
              $ref: '#/components/schemas/ObservabilityKpi'
        cluster:
          type: array
          items:
            $ref: '#/components/schemas/ObservabilityClusterNode'
        activeRuns:
          type: array
          items:
            $ref: '#/components/schemas/ObservabilityActiveRun'
        recentEvents:
          type: array
          items:
            $ref: '#/components/schemas/ObservabilityRecentEvent'
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/ObservabilityAlert'
        asOf:
          type: string
          format: date-time

    # -----------------------------------------------------------------
    # /api/v2 module-shaped router contracts. Mirrors
    # src/pipeline/http/contracts.ts — the type-only file that moves
    # into distributed-core when the module relocates.
    # -----------------------------------------------------------------
    V2InlinePipelineDefinition:
      type: object
      required: [id]
      additionalProperties: true
      properties:
        id: { type: string }

    V2PipelineTriggerRequest:
      type: object
      properties:
        definition:
          $ref: '#/components/schemas/V2InlinePipelineDefinition'
        triggerPayload:
          type: object
          additionalProperties: true
          description: Free-form key/value merged into the trigger node's evaluation context.
        breakpoints:
          type: array
          items: { type: string }
          description: Node ids at which the run should pause for step-by-step debugging.

    V2PipelineTriggerResponse:
      type: object
      required: [runId, pipelineId, triggeredBy, at]
      properties:
        runId: { type: string, format: uuid }
        pipelineId: { type: string }
        triggeredBy:
          type: object
          required: [userId, triggerType]
          properties:
            userId: { type: string }
            triggerType: { type: string, enum: [manual] }
        at: { type: string, format: date-time }

    V2PipelineRunDetail:
      type: object
      required: [runId, pipelineId, status, startedAt, triggeredBy]
      properties:
        runId: { type: string, format: uuid }
        pipelineId: { type: string }
        status:
          type: string
          enum: [running, succeeded, failed, canceled, interrupted]
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        triggeredBy:
          type: object
          required: [triggerType]
          properties:
            userId: { type: string }
            triggerType: { type: string }
            payload:
              type: object
              additionalProperties: true
        triggerType: { type: string }
        steps:
          type: object
          additionalProperties: true
          description: Per-step state map keyed by node id; shape evolves with the framework.
        error:
          type: object
          required: [nodeId, message]
          additionalProperties: true
          properties:
            nodeId: { type: string }
            message: { type: string }
            errorCategory: { type: string }
            retryability: { type: string }

    V2PipelineErrorBody:
      type: object
      required: [error, action]
      properties:
        error: { type: string }
        action:
          type: string
          description: Logical action attempted (`trigger`, `getRun`, ...).

    # -----------------------------------------------------------------
    # /api/capabilities — pipeline capability introspection
    # -----------------------------------------------------------------
    PipelineCapabilitySummary:
      type: object
      required: [name, enabled, triggers]
      properties:
        name: { type: string, description: Pipeline display name (falls back to `id`). }
        enabled:
          type: boolean
          description: True when the definition's `disabled` flag is unset/false.
        version: { type: string }
        triggers:
          type: integer
          minimum: 0
          description: Count of trigger bindings on the pipeline.

    PipelineCapabilityDetail:
      type: object
      required: [name, enabled, steps]
      properties:
        name: { type: string }
        enabled: { type: boolean }
        version: { type: string }
        steps:
          type: integer
          minimum: 0
          description: Count of nodes in the pipeline definition.
        triggers:
          type: array
          items: { type: object, additionalProperties: true }
          description: Full trigger binding list (shape per the definition schema).

    # -----------------------------------------------------------------
    # Image / scatter node data + run-observability types.
    # Projected 2026-08-16 from websocket-gateway/schemas/pipeline.schema.json
    # (canonical: frontend/src/types/pipeline.ts) per TYPES_SYNC.md.
    # -----------------------------------------------------------------

    RetryPolicy:
      type: object
      required:
        - maxAttempts
        - backoffMs
        - backoffMultiplier
      properties:
        maxAttempts:
          type: integer
          minimum: 1
          maximum: 10
        backoffMs:
          type: integer
          minimum: 100
          maximum: 60000
        backoffMultiplier:
          type: number
          minimum: 1
          maximum: 5

    ErrorCategory:
      type: string
      enum:
        - NetworkError
        - TimeoutError
        - ValidationError
        - LLMError
        - RegistryConflict
        - UnknownError

    BBox:
      description: Axis-aligned bounding box in pixel coordinates.
      type: object
      required:
        - x
        - 'y'
        - width
        - height
      properties:
        x:
          type: number
        'y':
          type: number
        width:
          type: number
        height:
          type: number

    AdjustLayer:
      description: A single composable image adjustment layer, discriminated on `kind`.
      oneOf:
        - type: object
          required:
            - kind
            - value
          properties:
            kind:
              type: string
              enum:
                - brightness
                - contrast
                - saturation
            value:
              type: number
        - type: object
          required:
            - kind
            - degrees
          properties:
            kind:
              const: hue
            degrees:
              type: number
        - type: object
          required:
            - kind
            - radiusPx
          properties:
            kind:
              const: blur
            radiusPx:
              type: number

    ResizeFit:
      type: string
      enum:
        - cover
        - contain
        - fill
        - inside
        - outside

    GeometricOpRotate:
      type: object
      required:
        - op
        - degrees
      properties:
        op:
          const: rotate
        degrees:
          type: number
        background:
          type: string
        trimAfter:
          type: boolean

    GeometricOpFlip:
      type: object
      required:
        - op
      properties:
        op:
          const: flip

    GeometricOpFlop:
      type: object
      required:
        - op
      properties:
        op:
          const: flop

    GeometricOp:
      oneOf:
        - $ref: '#/components/schemas/GeometricOpRotate'
        - $ref: '#/components/schemas/GeometricOpFlip'
        - $ref: '#/components/schemas/GeometricOpFlop'

    ImageFormat:
      type: string
      enum:
        - jpeg
        - png
        - webp
        - avif

    WatermarkGravity:
      type: string
      enum:
        - northwest
        - north
        - northeast
        - west
        - center
        - east
        - southwest
        - south
        - southeast

    ImageVisionAnalyzeNodeData:
      type: object
      required:
        - type
        - userPrompt
        - imageRefPath
      properties:
        type:
          const: image:vision-analyze
        model:
          type: string
        systemPrompt:
          type: string
        userPrompt:
          type: string
        imageRefPath:
          type: string
        outputSchema:
          type: object
          additionalProperties: true
        maxOutputTokens:
          type: integer
          minimum: 1

    ScatterNodeData:
      type: object
      required:
        - type
        - itemsPath
      properties:
        type:
          const: scatter
        itemsPath:
          type: string
        itemAlias:
          type: string
        maxConcurrency:
          type: integer
          minimum: 1

    ImageCropNodeData:
      type: object
      required:
        - type
      properties:
        type:
          const: image:crop
        sourceImagePath:
          type: string
        bboxPath:
          type: string
        bbox:
          $ref: '#/components/schemas/BBox'
        materialize:
          type: boolean

    ImageAdjustBwNodeData:
      type: object
      required:
        - type
      properties:
        type:
          const: image:adjust-bw
        sourceImagePath:
          type: string
        algorithm:
          type: string
          enum:
            - luminosity
            - average
            - desaturate
        contrast:
          type: number

    ImageAdjustLayerNodeData:
      type: object
      required:
        - type
        - layers
      properties:
        type:
          const: image:adjust-layer
        sourceImagePath:
          type: string
        layers:
          type: array
          items:
            $ref: '#/components/schemas/AdjustLayer'

    ImageSaveNodeData:
      type: object
      required:
        - type
      properties:
        type:
          const: image:save
        sourceImagePath:
          type: string
        filenameTemplate:
          type: string

    ImageResizeNodeData:
      type: object
      required:
        - type
      properties:
        type:
          const: image:resize
        sourceImagePath:
          type: string
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        fit:
          $ref: '#/components/schemas/ResizeFit'
        withoutEnlargement:
          type: boolean
        background:
          type: string

    ImageTransformNodeData:
      type: object
      required:
        - type
        - operations
      properties:
        type:
          const: image:transform
        sourceImagePath:
          type: string
        operations:
          type: array
          items:
            $ref: '#/components/schemas/GeometricOp'

    ImageFormatConvertNodeData:
      type: object
      required:
        - type
        - format
      properties:
        type:
          const: image:format-convert
        sourceImagePath:
          type: string
        format:
          $ref: '#/components/schemas/ImageFormat'
        quality:
          type: integer
          minimum: 1
          maximum: 100
        lossless:
          type: boolean
        stripMetadata:
          type: boolean

    ImageSharpenNodeData:
      type: object
      required:
        - type
      properties:
        type:
          const: image:sharpen
        sourceImagePath:
          type: string
        sigma:
          type: number
        m1:
          type: number
        m2:
          type: number

    ImageWatermarkNodeData:
      type: object
      required:
        - type
        - overlayImageId
      properties:
        type:
          const: image:watermark
        sourceImagePath:
          type: string
        overlayImageId:
          type: string
        gravity:
          $ref: '#/components/schemas/WatermarkGravity'
        opacity:
          type: number
          minimum: 0
          maximum: 1
        offsetX:
          type: number
        offsetY:
          type: number

    ImageGenerateNodeData:
      type: object
      required:
        - type
        - prompt
      properties:
        type:
          const: image:generate
        prompt:
          type: string
        model:
          type: string
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        seed:
          type: integer
        numImages:
          type: integer
          minimum: 1

    ImageVariationNodeData:
      type: object
      required:
        - type
      properties:
        type:
          const: image:variation
        sourceImagePath:
          type: string
        numVariations:
          type: integer
          minimum: 1
        similarity:
          type: number
          minimum: 0
          maximum: 1
        model:
          type: string

    ImageEditPromptNodeData:
      type: object
      required:
        - type
        - prompt
      properties:
        type:
          const: image:edit-prompt
        sourceImagePath:
          type: string
        maskImagePath:
          type: string
        prompt:
          type: string
        model:
          type: string

    ImageUpscaleNodeData:
      type: object
      required:
        - type
      properties:
        type:
          const: image:upscale
        sourceImagePath:
          type: string
        prompt:
          type: string
        maxEdge:
          type: integer
          minimum: 1

    ImageDimensionsNodeData:
      type: object
      required:
        - type
      properties:
        type:
          const: image:dimensions
        sourceImagePath:
          type: string
        maxEdge:
          type: integer
          minimum: 1

    ImageVisionClassifyNodeData:
      type: object
      required:
        - type
        - imageRefPath
        - labels
      properties:
        type:
          const: image:vision-classify
        model:
          type: string
        imageRefPath:
          type: string
        labels:
          type: array
          items:
            type: string
          minItems: 2
        systemPrompt:
          type: string
        maxOutputTokens:
          type: integer
          minimum: 1

    ImageVisionDescribeNodeData:
      type: object
      required:
        - type
        - imageRefPath
        - userPrompt
      properties:
        type:
          const: image:vision-describe
        model:
          type: string
        imageRefPath:
          type: string
        userPrompt:
          type: string
        systemPrompt:
          type: string
        maxOutputTokens:
          type: integer
          minimum: 1

    ImageVisionTagNodeData:
      type: object
      required:
        - type
        - imageRefPath
      properties:
        type:
          const: image:vision-tag
        model:
          type: string
        imageRefPath:
          type: string
        candidateTags:
          type: array
          items:
            type: string
        maxTags:
          type: integer
          minimum: 1
        systemPrompt:
          type: string
        maxOutputTokens:
          type: integer
          minimum: 1

    ImageVisionExtractTextNodeData:
      type: object
      required:
        - type
        - imageRefPath
      properties:
        type:
          const: image:vision-extract-text
        model:
          type: string
        imageRefPath:
          type: string
        systemPrompt:
          type: string
        maxOutputTokens:
          type: integer
          minimum: 1

    ImageSourceNodeData:
      type: object
      required:
        - type
      properties:
        type:
          const: image-source
        imageId:
          type: string
        outputKey:
          type: string

    StepAttempt:
      description: One entry in StepExecution.attempts — full per-attempt retry history (hub#1280).
      type: object
      required:
        - attemptNumber
        - startedAt
        - idempotencyKey
      properties:
        attemptNumber:
          type: integer
          minimum: 1
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        durationMs:
          type: number
          minimum: 0
        input: {}
        output: {}
        error:
          type: string
        errorCategory:
          $ref: '#/components/schemas/ErrorCategory'
        retryAfterMs:
          type: number
          minimum: 0
        idempotencyKey:
          type: string
          description: >-
            `${runId}:${nodeId}:${attemptNumber}` (per-attempt) or `${runId}:${nodeId}` (per-step
            idempotent).

    PatchEntry:
      description: hub#2226 — edit-and-continue patch applied while the run was paused at this step's breakpoint.
      type: object
      required:
        - patchId
        - appliedAt
      properties:
        patchId:
          type: string
        appliedAt:
          type: string
          format: date-time
        appliedBy:
          type: string
        mode:
          type: string
          enum:
            - merge
            - jsonPatch
        revertedAt:
          type: string
          format: date-time
        unvalidated:
          type: boolean

    TokenUsageByModel:
      type: object
      required:
        - tokensIn
        - tokensOut
      properties:
        tokensIn:
          type: integer
          minimum: 0
        tokensOut:
          type: integer
          minimum: 0

    ResumeFromStepEntry:
      description: A single resume-from-step entry on a PipelineRun (hub#2223).
      type: object
      required:
        - fromNodeId
        - at
      properties:
        fromNodeId:
          type: string
        originalFailedStepId:
          type: string
        at:
          type: string
          format: date-time
