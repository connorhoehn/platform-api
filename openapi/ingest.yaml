# openapi/ingest.yaml
#
# OpenAPI 3.1 spec for the ingest / sync surface of platform-api.
#
# Coverage status (per hub#1280):
#   - /ingest/sources + lifecycle           full schemas
#   - /ingest/sources/{id}/metrics + stats  full schemas
#   - /ingest/items                          full schema for list; item-action
#                                            endpoints (retry/skip/remap) have
#                                            request/response bodies marked
#                                            TODO: schema for a follow-up task
#   - /ingest/dlq                            full schemas (inspect + redrive +
#                                            purge)
#   - /ingest/audit                          full schemas (list + filters)
#   - /sync/conflicts/*                      full schemas (list + resolve + discard)
#   - /ingest/templates/*                    full schemas (list + get + instantiate)
#   - /ingest/mapping/preview + review,
#     /ingest/mapping/proposals/*,
#     /ingest/dev/*                          skeleton only (TODO: schema)
#
# Path inventory is regenerated by `node scripts/openapi-coverage-lint.js`
# — adding a route under the ingest or /sync/conflicts mounts without
# updating this file will fail the lint.
#
# Authoritative source for /ingest/sources/* shapes:
#   src/ingest/routes/ingestSources.ts
#   src/ingest/types.ts (IngestSource + SyncStats interfaces)
#
# Authoritative source for /ingest/items/* shapes:
#   src/ingest/routes/ingestItems.ts
#   src/ingest/types.ts (IngestItem + IngestItemStatus)
#
# Authoritative source for /ingest/dlq/* shapes:
#   src/ingest/routes/ingestDLQ.ts
#   distributed-core DLQ — entry shape is opaque from this surface.

openapi: 3.1.0

info:
  title: platform-api Ingest HTTP API
  description: |
    HTTP surface for ingest source configuration, item inspection +
    intervention, mapping (preview / review / proposals), templates,
    the dead-letter queue, audit, and the cross-source sync-conflict
    resolution flow.
  version: 0.1.0
  contact:
    name: platform-api

servers:
  - url: /api
    description: platform-api mount

security:
  - bearerAuth: []

tags:
  - name: ingest-sources
    description: Ingest source CRUD + manual sync / pause / resume lifecycle.
  - name: ingest-items
    description: Per-item inspection + manual intervention (retry / skip / remap).
  - name: ingest-mapping
    description: Mapping preview + needs-review queue + LLM-suggested proposals.
  - name: ingest-templates
    description: Document-type templates for ingest instantiation.
  - name: ingest-dlq
    description: Dead-letter queue inspect + redrive + purge.
  - name: ingest-audit
    description: Operator audit trail over ingest actions.
  - name: ingest-dev
    description: Dev-only seed routes (gated to non-prod).
  - name: sync-conflicts
    description: Cross-source conflict review + resolve / discard.

paths:
  # --- /ingest/sources (full schemas) ------------------------------------
  /ingest/sources:
    post:
      tags: [ingest-sources]
      summary: Create an ingest source
      operationId: createIngestSource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestSourceCreateRequest' }
      responses:
        '201':
          description: Source created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestSource' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [ingest-sources]
      summary: List all ingest sources
      operationId: listIngestSources
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items: { $ref: '#/components/schemas/IngestSource' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /ingest/sources/{id}:
    parameters:
      - $ref: '#/components/parameters/SourceIdPath'
    get:
      tags: [ingest-sources]
      summary: Get an ingest source by id
      operationId: getIngestSource
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestSource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [ingest-sources]
      summary: Update an ingest source
      operationId: updateIngestSource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestSourceUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestSource' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [ingest-sources]
      summary: Delete an ingest source
      operationId: deleteIngestSource
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ingest/sources/{id}/sync:
    parameters:
      - $ref: '#/components/parameters/SourceIdPath'
    post:
      tags: [ingest-sources]
      summary: Trigger a manual sync
      description: |
        Fire-and-forget. Returns 202 immediately; sync progress is
        published as `ingest:events` on Redis pub/sub.
      operationId: triggerIngestSourceSync
      responses:
        '202':
          description: Sync triggered
          content:
            application/json:
              schema:
                type: object
                required: [status, sourceId]
                properties:
                  status: { type: string, enum: [sync_triggered] }
                  sourceId: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: Ingest engine not available
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /ingest/sources/{id}/pause:
    parameters:
      - $ref: '#/components/parameters/SourceIdPath'
    post:
      tags: [ingest-sources]
      summary: Pause an ingest source
      operationId: pauseIngestSource
      responses:
        '200':
          description: Paused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceStateChange' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ingest/sources/{id}/resume:
    parameters:
      - $ref: '#/components/parameters/SourceIdPath'
    post:
      tags: [ingest-sources]
      summary: Resume an ingest source
      operationId: resumeIngestSource
      responses:
        '200':
          description: Resumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceStateChange' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ingest/sources/{id}/stats:
    parameters:
      - $ref: '#/components/parameters/SourceIdPath'
    get:
      tags: [ingest-sources]
      summary: Get sync stats for a source
      operationId: getIngestSourceStats
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sourceId, status, lastSyncAt, lastSyncStats]
                properties:
                  sourceId: { type: string }
                  status: { type: string, enum: [active, paused, error] }
                  lastSyncAt: { type: string, format: date-time, nullable: true }
                  lastSyncStats:
                    oneOf:
                      - $ref: '#/components/schemas/SyncStats'
                      - type: 'null'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ingest/sources/{id}/metrics:
    parameters:
      - $ref: '#/components/parameters/SourceIdPath'
    get:
      tags: [ingest-sources]
      summary: Get rolled-up per-source ingest metrics
      description: |
        Time-bucketed counts of items by status (queued / mapping /
        materializing / triggering / done / failed) plus per-status
        latency stats. Used by the operator dashboard.
      operationId: getIngestSourceMetrics
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: 'TODO: schema — backfill with full response shape from src/ingest/routes/ingestSourceMetrics.ts in a follow-up task.'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --- /ingest/items (list = full; per-item actions = skeleton) ----------
  /ingest/items:
    get:
      tags: [ingest-items]
      summary: List ingest items
      operationId: listIngestItems
      parameters:
        - in: query
          name: sourceId
          schema: { type: string }
          description: Filter to one source. If omitted, listing scans across all statuses up to `limit`.
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/IngestItemStatus' }
          description: Filter to one status.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/IngestItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /ingest/items/{id}:
    parameters:
      - $ref: '#/components/parameters/IngestItemIdPath'
    get:
      tags: [ingest-items]
      summary: Get an ingest item by id
      operationId: getIngestItem
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ingest/items/{id}/retry:
    parameters:
      - $ref: '#/components/parameters/IngestItemIdPath'
    post:
      tags: [ingest-items]
      summary: Retry a failed ingest item
      description: 'Only valid when the item is in status=failed. Increments `attempts` and re-queues.'
      operationId: retryIngestItem
      responses:
        '200':
          description: Re-queued
          content:
            application/json:
              schema:
                type: object
                required: [status, ingestId, attempts]
                properties:
                  status: { type: string, enum: [queued] }
                  ingestId: { type: string }
                  attempts: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ingest/items/{id}/skip:
    parameters:
      - $ref: '#/components/parameters/IngestItemIdPath'
    post:
      tags: [ingest-items]
      summary: Skip an ingest item
      description: 'Marks the item done with `error: "skipped by user"`.'
      operationId: skipIngestItem
      responses:
        '200':
          description: Skipped
          content:
            application/json:
              schema:
                type: object
                required: [status, ingestId, skipped]
                properties:
                  status: { type: string, enum: [done] }
                  ingestId: { type: string }
                  skipped: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ingest/items/{id}/remap:
    parameters:
      - $ref: '#/components/parameters/IngestItemIdPath'
    post:
      tags: [ingest-items]
      summary: Operator override of the LLM mapper — assign a typeId
      description: |
        Sets `mappedTypeId` to the supplied value, resets mapping
        confidence to 1, and re-queues for materialization.
      operationId: remapIngestItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [typeId]
              properties:
                typeId: { type: string }
      responses:
        '200':
          description: Remapped
          content:
            application/json:
              schema:
                type: object
                required: [status, ingestId, mappedTypeId]
                properties:
                  status: { type: string, enum: [materializing] }
                  ingestId: { type: string }
                  mappedTypeId: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --- /ingest/mapping (skeleton) ----------------------------------------
  /ingest/mapping/preview:
    post:
      tags: [ingest-mapping]
      summary: Preview a mapping rule against sample content
      description: 'TODO: schema — see src/ingest/routes/ingestMapping.ts.'
      operationId: previewIngestMapping
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /ingest/mapping/review:
    get:
      tags: [ingest-mapping]
      summary: List items in the needs-review queue
      description: 'TODO: schema.'
      operationId: listIngestMappingReview
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /ingest/mapping/proposals:
    get:
      tags: [ingest-mapping]
      summary: List LLM-generated mapping proposals
      description: 'TODO: schema — see src/ingest/routes/ingestProposals.ts.'
      operationId: listIngestMappingProposals
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /ingest/mapping/proposals/{id}/promote:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
        description: Proposal identifier.
    post:
      tags: [ingest-mapping]
      summary: Promote a proposal to an active mapping rule
      description: 'TODO: schema.'
      operationId: promoteIngestMappingProposal
      responses:
        '200': { description: Promoted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ingest/mapping/proposals/{id}/reject:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
        description: Proposal identifier.
    post:
      tags: [ingest-mapping]
      summary: Reject a mapping proposal
      description: 'TODO: schema.'
      operationId: rejectIngestMappingProposal
      responses:
        '200': { description: Rejected }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --- /ingest/templates --------------------------------------------------
  /ingest/templates:
    get:
      tags: [ingest-templates]
      summary: List ingest templates
      description: |
        Returns the metadata-only summary of every pre-built ingest
        pipeline template. The full `definition` field is omitted here
        to keep the list payload small; fetch a specific template via
        `GET /ingest/templates/{id}` for the full shape.
      operationId: listIngestTemplates
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items: { $ref: '#/components/schemas/IngestTemplateSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /ingest/templates/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
        description: Template identifier.
    get:
      tags: [ingest-templates]
      summary: Get a template by id
      description: Returns the full template including the embedded `definition`.
      operationId: getIngestTemplate
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestTemplate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ingest/templates/{id}/instantiate:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
        description: Template identifier.
    post:
      tags: [ingest-templates]
      summary: Instantiate a template
      description: |
        Deep-clones the template's `definition`, assigns fresh ids +
        timestamps, persists it via the pipeline-definitions repository,
        and broadcasts a cross-replica cache invalidation so the new
        pipeline is immediately visible to the webhook + schedule paths.
        The new pipeline starts in `draft` status — the operator must
        publish a version before it will fire.
      operationId: instantiateIngestTemplate
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestTemplateInstantiateRequest' }
      responses:
        '201':
          description: Instantiated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestTemplateInstantiateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --- /ingest/dev (skeleton; gated to non-prod) -------------------------
  /ingest/dev/seed-fake-content:
    post:
      tags: [ingest-dev]
      summary: Seed fake content for local development
      description: |
        Dev-only. Disabled in production. TODO: schema for request body
        — see src/ingest/routes/ingestDevSeed.ts.
      operationId: seedFakeIngestContent
      responses:
        '200': { description: Seeded }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Disabled in production
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  # --- /ingest/dlq (full schemas) ----------------------------------------
  /ingest/dlq:
    get:
      tags: [ingest-dlq]
      summary: List dead-letter queue entries
      operationId: listIngestDLQ
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
          description: Opaque page cursor from a previous response's `nextCursor`.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    description: 'DLQ entry shape is opaque from this surface — see distributed-core DLQ types.'
                    items: { type: object, additionalProperties: true }
                  nextCursor:
                    type: string
                    nullable: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: Ingest DLQ not initialized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /ingest/dlq/{id}/replay:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
        description: DLQ entry identifier.
    post:
      tags: [ingest-dlq]
      summary: Replay (redrive) a DLQ entry
      operationId: replayIngestDLQEntry
      responses:
        '200':
          description: Replayed
          content:
            application/json:
              schema:
                type: object
                required: [ok, id, redriven]
                properties:
                  ok: { type: boolean }
                  id: { type: string }
                  redriven: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: Ingest DLQ not initialized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /ingest/dlq/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
        description: DLQ entry identifier.
    delete:
      tags: [ingest-dlq]
      summary: Purge a DLQ entry without replay
      operationId: purgeIngestDLQEntry
      responses:
        '200':
          description: Purged
          content:
            application/json:
              schema:
                type: object
                required: [ok, id, purged]
                properties:
                  ok: { type: boolean }
                  id: { type: string }
                  purged: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: Ingest DLQ not initialized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  # --- /ingest/audit ------------------------------------------------------
  /ingest/audit:
    get:
      tags: [ingest-audit]
      summary: List ingest audit events
      description: |
        Returns the operator audit log over ingest actions (mapping
        decisions, source lifecycle changes, write-back attempts).
        Filters are applied in priority order: `targetId` short-circuits
        to the targetId GSI, then `actor` short-circuits to the actor GSI,
        otherwise a scan with `since` / `until` / `eventType` filters is
        used.
      operationId: listIngestAudit
      parameters:
        - in: query
          name: since
          required: false
          schema: { type: string, format: date-time }
          description: ISO 8601 lower bound on `createdAt` (inclusive). Ignored when `targetId` or `actor` is set.
        - in: query
          name: until
          required: false
          schema: { type: string, format: date-time }
          description: ISO 8601 upper bound on `createdAt` (inclusive). Ignored when `targetId` or `actor` is set.
        - in: query
          name: targetId
          required: false
          schema: { type: string }
          description: Filter to a specific sourceId / itemId / documentId. Most selective filter; uses the targetId GSI.
        - in: query
          name: actor
          required: false
          schema: { type: string }
          description: Filter by actor (operator email, `system`, or `llm:<model>`). Uses the actor GSI when `targetId` is unset.
        - in: query
          name: eventType
          required: false
          schema: { $ref: '#/components/schemas/IngestAuditEventType' }
          description: Filter by event type. Ignored when `targetId` or `actor` is set.
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, default: 100 }
          description: Maximum entries to return. Defaults to 100; non-positive or non-numeric values fall back to the default.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [entries, nextCursor]
                properties:
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/IngestAuditEntry' }
                  nextCursor:
                    type: string
                    nullable: true
                    description: Reserved for pagination; always `null` today.
        '401': { $ref: '#/components/responses/Unauthorized' }

  # --- /sync/conflicts ----------------------------------------------------
  /sync/conflicts:
    get:
      tags: [sync-conflicts]
      summary: List cross-source sync conflicts
      description: |
        Returns all conflicts in the operator queue, sorted by `detectedAt`
        descending. The write-back engine (slice F) seeds pending entries;
        resolved + discarded entries land here when operators act via
        `/resolve` and `/discard`.
      operationId: listSyncConflicts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [conflicts]
                properties:
                  conflicts:
                    type: array
                    items: { $ref: '#/components/schemas/SyncConflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /sync/conflicts/{id}/resolve:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
        description: Conflict identifier.
    post:
      tags: [sync-conflicts]
      summary: Resolve a sync conflict
      description: |
        Records the operator's resolution choice (`source` keeps the
        upstream value, `platform` keeps the local value, `merged` keeps
        an operator-supplied merge). Until slice F lands, a synthetic
        pending entry is created on the fly for any `id` the store
        doesn't already know about, so the Resolved tab always reflects
        the operator's intent.
      operationId: resolveSyncConflict
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConflictResolution' }
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema:
                type: object
                required: [conflict]
                properties:
                  conflict: { $ref: '#/components/schemas/SyncConflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sync/conflicts/{id}/discard:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
        description: Conflict identifier.
    post:
      tags: [sync-conflicts]
      summary: Discard a sync conflict without resolving
      description: |
        Marks the conflict `discarded` without choosing a resolution
        side. Used when the operator decides the conflict is spurious
        (e.g. a transient diff that fixed itself). Idempotent — see
        `/resolve` for the synthetic-entry behavior pre-slice-F.
      operationId: discardSyncConflict
      responses:
        '200':
          description: Discarded
          content:
            application/json:
              schema:
                type: object
                required: [conflict]
                properties:
                  conflict: { $ref: '#/components/schemas/SyncConflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Cognito ID token validated by `middleware/auth.ts`. Will swap to
        the identity-server OIDC issuer in the auth migration.

  parameters:
    SourceIdPath:
      in: path
      name: id
      required: true
      schema: { type: string }
      description: Ingest source identifier (UUID minted at create time).
    IngestItemIdPath:
      in: path
      name: id
      required: true
      schema: { type: string }
      description: Ingest item identifier.

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }

  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error: { type: string, description: 'Machine-readable error code.' }
        message: { type: string }

    IngestSourceType:
      type: string
      enum: [local, s3, google-drive, webhook, confluence, jira]

    IngestSourceStatus:
      type: string
      enum: [active, paused, error]

    SyncStats:
      type: object
      required: [filesFound, filesNew, filesUpdated, filesSkipped, errors, durationMs]
      properties:
        filesFound: { type: integer }
        filesNew: { type: integer }
        filesUpdated: { type: integer }
        filesSkipped: { type: integer }
        errors: { type: integer }
        durationMs: { type: integer }

    SourceStateChange:
      type: object
      required: [status, sourceId]
      properties:
        status: { $ref: '#/components/schemas/IngestSourceStatus' }
        sourceId: { type: string }

    IngestSource:
      type: object
      required:
        - sourceId
        - name
        - type
        - config
        - syncSchedule
        - mappingRules
        - defaultPipelineId
        - status
        - lastSyncAt
        - lastSyncStats
        - createdAt
        - updatedAt
      properties:
        sourceId: { type: string }
        name: { type: string }
        type: { $ref: '#/components/schemas/IngestSourceType' }
        config:
          type: object
          description: 'Source-type-specific config (bucket/path for s3, base URL + auth for confluence/jira, etc.). Free-form by source type.'
          additionalProperties: true
        syncSchedule:
          type: string
          nullable: true
          description: Cron expression, or null for manual-only.
        mappingRules:
          type: array
          description: Mapping rules evaluated in order against discovered content.
          items: { type: object, additionalProperties: true }
        defaultPipelineId:
          type: string
          nullable: true
          description: Pipeline run for items not matched by `pipelineByDocType`.
        pipelineByDocType:
          type: object
          description: Per-DocType pipeline override (key = `targetTypeId`).
          additionalProperties: { type: string }
        status: { $ref: '#/components/schemas/IngestSourceStatus' }
        lastSyncAt: { type: string, format: date-time, nullable: true }
        lastSyncStats:
          oneOf:
            - $ref: '#/components/schemas/SyncStats'
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    IngestSourceCreateRequest:
      type: object
      required: [name, type, config]
      properties:
        name: { type: string, minLength: 1 }
        type: { $ref: '#/components/schemas/IngestSourceType' }
        config:
          type: object
          additionalProperties: true
        syncSchedule: { type: string, nullable: true }
        mappingRules:
          type: array
          items: { type: object, additionalProperties: true }
        defaultPipelineId: { type: string, nullable: true }

    IngestSourceUpdateRequest:
      type: object
      description: 'All fields optional; only present keys are applied.'
      properties:
        name: { type: string }
        type: { $ref: '#/components/schemas/IngestSourceType' }
        config:
          type: object
          additionalProperties: true
        syncSchedule: { type: string, nullable: true }
        mappingRules:
          type: array
          items: { type: object, additionalProperties: true }
        defaultPipelineId: { type: string, nullable: true }
        pipelineByDocType:
          type: object
          additionalProperties: { type: string }

    IngestItemStatus:
      type: string
      enum: [queued, mapping, materializing, triggering, done, failed]

    IngestMappingMethod:
      type: string
      enum: [rule, llm-match, llm-generate]

    IngestItem:
      type: object
      required:
        - ingestId
        - sourceId
        - filePath
        - fileHash
        - mimeType
        - fileSize
        - status
        - mappedTypeId
        - mappingConfidence
        - mappingMethod
        - documentId
        - pipelineRunId
        - error
        - attempts
        - createdAt
        - updatedAt
      properties:
        ingestId: { type: string }
        sourceId: { type: string }
        filePath: { type: string }
        fileHash: { type: string }
        mimeType: { type: string }
        fileSize: { type: integer }
        status: { $ref: '#/components/schemas/IngestItemStatus' }
        mappedTypeId: { type: string, nullable: true }
        mappingConfidence: { type: number, nullable: true }
        mappingMethod:
          oneOf:
            - $ref: '#/components/schemas/IngestMappingMethod'
            - type: 'null'
        documentId: { type: string, nullable: true }
        pipelineRunId: { type: string, nullable: true }
        error: { type: string, nullable: true }
        attempts: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    IngestAuditEventType:
      type: string
      description: |
        Discriminator for audit-log rows. Mirrors `IngestAuditEventType`
        in `src/ingest/types.ts`.
      enum:
        - mapping.decided
        - source.created
        - source.updated
        - source.paused
        - source.resumed
        - writeback.attempted
        - writeback.failed

    IngestAuditTargetType:
      type: string
      description: Coarse target tag — narrows GSI partition reads in the viewer page.
      enum:
        - source
        - item
        - document

    IngestAuditEntry:
      type: object
      description: |
        One row in the ingest audit log. Every mapping decision, source
        change, and write-back attempt produces one of these via
        `appendAudit`.
      required:
        - auditId
        - createdAt
        - actor
        - eventType
        - targetType
        - targetId
        - summary
        - detail
      properties:
        auditId:
          type: string
          description: UUID/KSUID assigned at append time. Partition key.
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp the row was appended. Range key on both GSIs.
        actor:
          type: string
          description: |
            Operator email when the call originated from a UI action;
            otherwise `system` (engine-driven) or `llm:<model>` (LLM
            mapper decisions).
        eventType: { $ref: '#/components/schemas/IngestAuditEventType' }
        targetType: { $ref: '#/components/schemas/IngestAuditTargetType' }
        targetId:
          type: string
          description: sourceId / itemId / documentId — keyed for the targetId GSI.
        summary:
          type: string
          description: Human-readable one-line summary the audit-viewer renders unexpanded.
        detail:
          type: object
          additionalProperties: true
          description: |
            Structured per-event detail (LLM prompt+response, before/after
            diff, error message + stack, etc). Surfaced in the expandable
            JSON row.

    ConflictField:
      type: object
      description: One field-level diff inside a `SyncConflict`.
      required:
        - field
        - sourceValue
        - platformValue
      properties:
        field: { type: string }
        sourceValue: {}
        platformValue: {}
        mergedValue: {}

    SyncConflict:
      type: object
      description: |
        A cross-source write-back conflict awaiting operator review.
        Pending entries are seeded by the write-back engine (slice F,
        not yet landed); resolved + discarded entries are written when
        operators act via `/resolve` and `/discard`.
      required:
        - conflictId
        - sourceId
        - documentId
        - documentTypeId
        - sourceRef
        - summary
        - fields
        - status
        - platformUpdatedAt
        - sourceUpdatedAt
        - detectedAt
      properties:
        conflictId: { type: string }
        sourceId: { type: string }
        documentId: { type: string }
        documentTypeId: { type: string }
        sourceRef:
          type: string
          description: Adapter-specific upstream identifier (e.g. Confluence page id).
        summary:
          type: string
          description: One-line summary rendered in the conflict-list row.
        fields:
          type: array
          items: { $ref: '#/components/schemas/ConflictField' }
        status:
          type: string
          enum: [pending, resolved, discarded]
        platformUpdatedAt: { type: string, format: date-time }
        sourceUpdatedAt: { type: string, format: date-time }
        detectedAt: { type: string, format: date-time }
        resolvedAt:
          type: string
          format: date-time
          description: Set when status transitions to `resolved` or `discarded`.
        resolution:
          type: string
          enum: [source, platform, merged]
          description: Present iff status is `resolved`.
        auditNote:
          type: string
          description: Free-form operator note attached at resolve time.

    ConflictResolution:
      type: object
      description: Request body for `POST /sync/conflicts/{id}/resolve`.
      required: [resolution]
      properties:
        resolution:
          type: string
          enum: [source, platform, merged]
          description: |
            `source` keeps the upstream value, `platform` keeps the local
            value, `merged` keeps the operator-supplied merge in
            `mergedFields`.
        mergedFields:
          type: object
          additionalProperties: true
          description: Operator-supplied merge values, keyed by field name. Only meaningful when `resolution: merged`.
        auditNote:
          type: string
          description: Free-form note captured on the resulting `SyncConflict.auditNote`.

    IngestTemplateCategory:
      type: string
      description: Coarse grouping for the template gallery sidebar.
      enum:
        - knowledge-base
        - review
        - transform

    IngestTemplateSummary:
      type: object
      description: |
        Metadata-only view of an `IngestTemplate`. Returned by the list
        endpoint to keep payload size small.
      required: [id, name, description, category]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        category: { $ref: '#/components/schemas/IngestTemplateCategory' }

    IngestTemplate:
      type: object
      description: |
        Full ingest pipeline template, including the embedded `definition`.
        Templates are static, code-defined entries — there is no CRUD; the
        only mutation surface is `/instantiate`.
      required: [id, name, description, category, definition]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        category: { $ref: '#/components/schemas/IngestTemplateCategory' }
        definition:
          type: object
          additionalProperties: true
          description: |
            The pipeline definition the template will be cloned from.
            Same shape as the `PipelineDefinition` schema documented in
            `openapi/pipelines.yaml`; not cross-referenced here because
            cross-file `$ref` is not used in this repo.

    IngestTemplateInstantiateRequest:
      type: object
      description: Optional overrides applied when cloning the template's definition.
      properties:
        name:
          type: string
          description: |
            Overrides the new pipeline's name. When omitted, the
            template's `definition.name` is reused.

    IngestTemplateInstantiateResponse:
      type: object
      description: The freshly-instantiated pipeline.
      required: [pipelineId, name, templateId, definition]
      properties:
        pipelineId:
          type: string
          description: UUID of the new pipeline definition.
        name:
          type: string
          description: Resolved name (either the request override or the template default).
        templateId:
          type: string
          description: Source template id, retained for audit + frontend grouping.
        definition:
          type: object
          additionalProperties: true
          description: |
            The cloned pipeline definition with fresh ids + timestamps.
            Status is `draft` and `version` is `1`. Same shape as
            `PipelineDefinition` in `openapi/pipelines.yaml`.
