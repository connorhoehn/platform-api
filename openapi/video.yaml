  # --- video sessions (skeleton — see hub#1102) ---------------------------
  '/video/sessions':
    post:
      summary: TODO — schema pending (videoSessions.ts)
      tags: [video-sessions]
      responses: { '200': { description: OK } }
  '/video/sessions/document/{documentId}':
