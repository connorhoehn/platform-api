# openapi/video.yaml
#
# OpenAPI 3.1 spec for the video surface of platform-api.
#
# Coverage status (per hub#1009 option B + blocker #33 re-shape):
#   - /recordings/*    full schemas   (this commit)
#   - /rooms/*         skeleton       (hub#1100 follow-up)
#   - /video/sessions/* skeleton       (hub#1102 follow-up)
#
# Path inventory is regenerated by `node scripts/openapi-coverage-lint.js`
# — adding a route under one of the three prefixes without updating this
# file will fail the lint.
#
# Authoritative source for /recordings/* shapes:
#   src/routes/recordings.ts
#   src/repositories/CallRecordingRepository.ts (CallRecording interface)

openapi: 3.1.0

info:
  title: platform-api Video HTTP API
  description: |
    HTTP surface for live-video sessions, hangout rooms, and recording
    playback. Backed by AWS IVS Real-Time (LVS) for the live-video plane
    and DynamoDB for room + recording metadata.
  version: 0.2.0
  contact:
    name: platform-api

servers:
  - url: /api
    description: platform-api mount

security:
  - bearerAuth: []

tags:
  - name: recordings
    description: Past-call playback, share-links, and recording lifecycle.
  - name: hangout-rooms
    description: Hangout-room CRUD + membership (skeleton — schemas pending).
  - name: video-sessions
    description: Live video session lifecycle (skeleton — schemas pending).

paths:
  # --- recordings (full schemas) ------------------------------------------
  /recordings:
    get:
      tags: [recordings]
      summary: List recordings the authed user participated in
      description: |
        Returns recordings the caller is associated with (as participant or
        starter), newest first. When `lobbyName` is supplied the result is
        scoped to that lobby instead — used by RoomAdminPage's "View
        recordings" filter.
      operationId: listRecordings
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: cursor
          schema: { type: string }
          description: Opaque pagination cursor from a prior response.
        - in: query
          name: lobbyName
          schema: { type: string }
          description: |
            Optional lobby filter (e.g. `room:lounge`). When set the
            per-user gate is replaced by a lobby-scoped scan.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /recordings/{recordingId}:
    parameters:
      - $ref: '#/components/parameters/RecordingIdPath'
    get:
      tags: [recordings]
      summary: Fetch full details for one recording
      operationId: getRecording
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallRecording'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [recordings]
      summary: Delete a recording (owner only)
      description: |
        Only the user who STARTED the recording may delete. Other
        participants can untag themselves via a separate flow. The
        underlying MP4 stays in LVS storage until the GC sweep.
      operationId: deleteRecording
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not the recording owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          $ref: '#/components/responses/NotFound'

  /recordings/{recordingId}/playback-token:
    parameters:
      - $ref: '#/components/parameters/RecordingIdPath'
    post:
      tags: [recordings]
      summary: Mint an LVS playback JWT + DVR playlist URL
      description: |
        Mints a 1-hour LVS playback token (when the channel is private)
        and returns the ready-to-play HLS DVR playlist URL for the
        recording's `[startedAt, endedAt]` window. For public channels
        LVS returns 400 "not authorized" — the route falls through with
        `token=null` and `expiresAt=null` and the playlist is open.
      operationId: mintPlaybackToken
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: Upstream LVS failure (mint rejected)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '503':
          description: SFU circuit breaker open (fast-fail)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '504':
          description: Upstream LVS timeout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /recordings/{recordingId}/share:
    parameters:
      - $ref: '#/components/parameters/RecordingIdPath'
    post:
      tags: [recordings]
      summary: Mint a share-token for unauthenticated playback
      description: |
        Creates a `shareToken` that lets non-participants view the
        recording via `GET /recordings/share/{shareToken}/playback`.
        TTL defaults to 7 days; clamped to `[60s, 90d]`.
      operationId: createRecordingShareLink
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ttlSeconds:
                  type: integer
                  minimum: 60
                  maximum: 7776000
                  default: 604800
                  description: Share-link lifetime in seconds (max 90 days).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLinkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /recordings/share/{shareToken}/playback:
    parameters:
      - in: path
        name: shareToken
        required: true
        schema: { type: string }
        description: Opaque share-link token from `POST /recordings/{id}/share`.
    get:
      tags: [recordings]
      summary: Resolve a share-link to its DVR playlist URL (unauthenticated)
      security: []
      operationId: resolveShareLink
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharePlaybackResponse'
        '404':
          description: Share link missing or expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  # --- hangout rooms (skeleton — see hub#1100) ----------------------------
  '/rooms':
    get:
      summary: TODO — schema pending (hangoutRooms.ts)
      tags: [hangout-rooms]
      responses: { '200': { description: OK } }
