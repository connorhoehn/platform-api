# openapi/video.yaml
#
# OpenAPI 3.1 spec for the video surface of platform-api.
#
# Coverage status (per hub#1009 option B + blocker #33 re-shape):
#   - /recordings/*    full schemas   (hub#1099)
#   - /rooms/*         full schemas   (hub#1100)
#   - /video/sessions/* full schemas   (hub#1102)
#
# Authoritative source for /rooms/* shapes:
#   src/routes/hangoutRooms.ts
#   src/repositories/HangoutRoomRepository.ts (HangoutRoom interface)
#   src/repositories/HangoutRoomMemberRepository.ts (HangoutRoomMember interface)
#
# Path inventory is regenerated by `node scripts/openapi-coverage-lint.js`
# — adding a route under one of the three prefixes without updating this
# file will fail the lint.
#
# Authoritative source for /recordings/* shapes:
#   src/routes/recordings.ts
#   src/repositories/CallRecordingRepository.ts (CallRecording interface)
#
# Authoritative source for /video/sessions/* shapes:
#   src/routes/videoSessions.ts
#   src/repositories/VideoSessionStore.ts (VideoSessionRecord interface)

openapi: 3.1.0

info:
  title: platform-api Video HTTP API
  description: |
    HTTP surface for live-video sessions, hangout rooms, and recording
    playback. Backed by AWS IVS Real-Time (LVS) for the live-video plane
    and DynamoDB for room + recording metadata.
  version: 0.2.0
  contact:
    name: platform-api

servers:
  - url: /api
    description: platform-api mount

security:
  - bearerAuth: []

tags:
  - name: recordings
    description: Past-call playback, share-links, and recording lifecycle.
  - name: hangout-rooms
    description: Hangout-room CRUD + membership + join/leave bridge to live video sessions.
  - name: video-sessions
    description: Live video session lifecycle (find-or-create, join, end, recording state).

paths:
  # --- recordings (full schemas) ------------------------------------------
  /recordings:
    get:
      tags: [recordings]
      summary: List recordings the authed user participated in
      description: |
        Returns recordings the caller is associated with (as participant or
        starter), newest first. When `lobbyName` is supplied the result is
        scoped to that lobby instead — used by RoomAdminPage's "View
        recordings" filter.
      operationId: listRecordings
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: cursor
          schema: { type: string }
          description: Opaque pagination cursor from a prior response.
        - in: query
          name: lobbyName
          schema: { type: string }
          description: |
            Optional lobby filter (e.g. `room:lounge`). When set the
            per-user gate is replaced by a lobby-scoped scan.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /recordings/{recordingId}:
    parameters:
      - $ref: '#/components/parameters/RecordingIdPath'
    get:
      tags: [recordings]
      summary: Fetch full details for one recording
      operationId: getRecording
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallRecording'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [recordings]
      summary: Delete a recording (owner only)
      description: |
        Only the user who STARTED the recording may delete. Other
        participants can untag themselves via a separate flow. The
        underlying MP4 stays in LVS storage until the GC sweep.
      operationId: deleteRecording
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not the recording owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          $ref: '#/components/responses/NotFound'

  /recordings/{recordingId}/playback-token:
    parameters:
      - $ref: '#/components/parameters/RecordingIdPath'
    post:
      tags: [recordings]
      summary: Mint an LVS playback JWT + DVR playlist URL
      description: |
        Mints a 1-hour LVS playback token (when the channel is private)
        and returns the ready-to-play HLS DVR playlist URL for the
        recording's `[startedAt, endedAt]` window. For public channels
        LVS returns 400 "not authorized" — the route falls through with
        `token=null` and `expiresAt=null` and the playlist is open.
      operationId: mintPlaybackToken
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: Upstream LVS failure (mint rejected)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '503':
          description: SFU circuit breaker open (fast-fail)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '504':
          description: Upstream LVS timeout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /recordings/{recordingId}/transcript:
    parameters:
      - $ref: '#/components/parameters/RecordingIdPath'
    get:
      tags: [recordings]
      summary: Serve the recording's transcript
      description: |
        Serves the transcription output for a recording. Resolves the file
        via the LVS segments-shaped HTTP path so LVS's existing auth +
        path-traversal guards apply. 404 when the recording has no
        transcription opted in; 202 + status payload while transcription
        is still in flight.
      operationId: getRecordingTranscript
      responses:
        '200':
          description: Transcript ready — body is the transcript content
        '202':
          description: Transcription still in flight — status payload
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /recordings/{recordingId}/summary:
    parameters:
      - $ref: '#/components/parameters/RecordingIdPath'
    get:
      tags: [recordings]
      summary: Serve the LLM-generated meeting-notes summary
      description: |
        Serves the LLM-generated markdown meeting-notes summary for a
        recording. 404 when the recording has no transcription opted in;
        202 + status payload while generation is in flight; the raw
        markdown body when ready.
      operationId: getRecordingSummary
      responses:
        '200':
          description: Summary ready — body is raw markdown
          content:
            text/markdown:
              schema: { type: string }
        '202':
          description: Summary generation in flight — status payload
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /recordings/{recordingId}/share:
    parameters:
      - $ref: '#/components/parameters/RecordingIdPath'
    post:
      tags: [recordings]
      summary: Mint a share-token for unauthenticated playback
      description: |
        Creates a `shareToken` that lets non-participants view the
        recording via `GET /recordings/share/{shareToken}/playback`.
        TTL defaults to 7 days; clamped to `[60s, 90d]`.
      operationId: createRecordingShareLink
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ttlSeconds:
                  type: integer
                  minimum: 60
                  maximum: 7776000
                  default: 604800
                  description: Share-link lifetime in seconds (max 90 days).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLinkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /recordings/share/{shareToken}/playback:
    parameters:
      - in: path
        name: shareToken
        required: true
        schema: { type: string }
        description: Opaque share-link token from `POST /recordings/{id}/share`.
    get:
      tags: [recordings]
      summary: Resolve a share-link to its DVR playlist URL (unauthenticated)
      security: []
      operationId: resolveShareLink
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharePlaybackResponse'
        '404':
          description: Share link missing or expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  # --- hangout rooms (full schemas) ---------------------------------------
  /rooms:
    get:
      tags: [hangout-rooms]
      summary: List hangout rooms visible to the caller
      description: |
        Returns org-visible rooms plus any private rooms the caller is a
        member of, ordered by recency. When `q` is supplied the response
        is a single page (no cursor) capped at 100 results.
      operationId: listHangoutRooms
      parameters:
        - in: query
          name: state
          schema:
            type: string
            enum: [active, archived]
            default: active
        - in: query
          name: q
          schema: { type: string }
          description: Case-insensitive substring match on name + slug.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: cursor
          schema: { type: string }
          description: Opaque pagination cursor from a prior page.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HangoutRoomListResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [hangout-rooms]
      summary: Create a hangout room (auto-slug from name)
      description: |
        Slug is derived from `name`; on collision the server retries with
        `-2`, `-3` suffixes (`ROOM_SLUG_RETRY_LIMIT`, default 3) before
        returning 409. Per-user create rate limit defaults to 5 / rolling
        hour (`ROOM_CREATE_RATE_LIMIT_MAX`).
      operationId: createHangoutRoom
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateHangoutRoomRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HangoutRoomResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Create denied by `canCreateRoom` gate (`ROOM_CREATE_DENIED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '409':
          description: Slug collision after retry exhaustion.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '429':
          description: Per-user create rate limit exceeded (`ROOM_CREATE_RATE_LIMITED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /rooms/{slug}:
    parameters:
      - $ref: '#/components/parameters/HangoutRoomSlugPath'
    get:
      tags: [hangout-rooms]
      summary: Fetch a hangout room by slug
      operationId: getHangoutRoom
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HangoutRoomResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks access to a private room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Room is archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
    patch:
      tags: [hangout-rooms]
      summary: Partial update of a hangout room (owner only)
      operationId: updateHangoutRoom
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateHangoutRoomRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HangoutRoomResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not the room owner.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Room is archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /rooms/{slug}/archive:
    parameters:
      - $ref: '#/components/parameters/HangoutRoomSlugPath'
    post:
      tags: [hangout-rooms]
      summary: Soft-delete a hangout room (owner or admin)
      description: |
        Sets a 90-day TTL on the row so DDB sweeps it natively. Org-admins
        are configured via `ROOM_ADMIN_USER_IDS` (comma-separated). Other
        callers receive 403.
      operationId: archiveHangoutRoom
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema:
                type: object
                required: [ok, slug]
                properties:
                  ok: { type: boolean }
                  slug: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is neither the room owner nor an org-admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Room is already archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /rooms/{slug}/join:
    parameters:
      - $ref: '#/components/parameters/HangoutRoomSlugPath'
    post:
      tags: [hangout-rooms]
      summary: Find-or-create the room's live video session and mint a participant token
      description: |
        Bridges to `POST /video/sessions` (find-or-create with lobby
        `room:<slug>`) and `POST /video/sessions/{sessionId}/join` to
        return the participant token. The room's `settings.recordingEnabled`
        is forwarded explicitly so per-room recording intent is honored.
      operationId: joinHangoutRoom
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinHangoutRoomResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks access to a private room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Room is archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '502':
          description: Bridge call to `/video/sessions` returned an upstream error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '503':
          description: SFU circuit breaker open (downstream `/video/sessions`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '504':
          description: Upstream LVS timeout (downstream `/video/sessions`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /rooms/{slug}/leave:
    parameters:
      - $ref: '#/components/parameters/HangoutRoomSlugPath'
    post:
      tags: [hangout-rooms]
      summary: End participation in the room's live video session
      description: |
        Bridges to `POST /video/sessions/{sessionId}/end`. The response
        body is the upstream end-session response (`remaining`, `ended`).
      operationId: leaveHangoutRoom
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveHangoutRoomRequest' }
      responses:
        '200':
          description: OK — proxied response from `/video/sessions/{id}/end`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EndVideoSessionResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks access to a private room.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Room is archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /rooms/{slug}/members:
    parameters:
      - $ref: '#/components/parameters/HangoutRoomSlugPath'
    post:
      tags: [hangout-rooms]
      summary: Add a member to a hangout room (owner only)
      operationId: addHangoutRoomMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddHangoutRoomMemberRequest' }
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member: { $ref: '#/components/schemas/HangoutRoomMember' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not the room owner.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Room is archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /rooms/{slug}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/HangoutRoomSlugPath'
      - in: path
        name: userId
        required: true
        schema: { type: string }
        description: User id of the member to remove.
    delete:
      tags: [hangout-rooms]
      summary: Remove a member from a hangout room
      description: |
        Callers may always remove themselves. The room owner may remove
        any member. Everyone else gets 403.
      operationId: removeHangoutRoomMember
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is neither the target nor the room owner.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Room is archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  # --- video sessions (full schemas) --------------------------------------
  /video/sessions:
    post:
      tags: [video-sessions]
      summary: Find-or-create a video session for a lobby
      description: |
        Creates a new session backed by an LVS channel and persists the
        record in DynamoDB. When `findOrCreate=true` and an active
        session already exists for the same `lobbyName`, returns that
        session instead of minting a new one (after a HEAD against the
        SFU to confirm the channel is still alive).
      operationId: createVideoSession
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVideoSessionRequest' }
      responses:
        '200':
          description: Found existing session (findOrCreate hit)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateVideoSessionResponse' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateVideoSessionResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Upstream LVS failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '503':
          description: SFU circuit breaker open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '504':
          description: Upstream LVS timeout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /video/sessions/document/{documentId}:
    parameters:
      - in: path
        name: documentId
        required: true
        schema: { type: string }
        description: Lobby name (alias `documentId` for back-compat).
    get:
      tags: [video-sessions]
      summary: List all sessions (active + ended) for a lobby
      operationId: listVideoSessionsForLobby
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/VideoSession' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /video/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionIdPath'
    get:
      tags: [video-sessions]
      summary: Fetch a single session record
      description: |
        Requires `lobbyName` (or alias `documentId`) as a query param —
        it is the DDB partition key.
      operationId: getVideoSession
      parameters:
        - $ref: '#/components/parameters/LobbyNameQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VideoSession' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /video/sessions/{sessionId}/join:
    parameters:
      - $ref: '#/components/parameters/SessionIdPath'
    post:
      tags: [video-sessions]
      summary: Mint a per-tab participant token and join the session
      description: |
        Each tab gets a distinct `participantId` (returned by the SFU's
        participant-tokens endpoint). The participants[] array on the
        session is updated idempotently — re-calling /join with the
        same participantId does not double-add.
      operationId: joinVideoSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinVideoSessionRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinVideoSessionResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: SFU circuit breaker open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '504':
          description: Upstream LVS timeout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /video/sessions/{sessionId}/end:
    parameters:
      - $ref: '#/components/parameters/SessionIdPath'
    post:
      tags: [video-sessions]
      summary: Ref-counted leave / soft-end
      description: |
        Removes the caller's participant from the session. Auth is
        optional so browser `sendBeacon` (no auth header) works on tab
        close. When the participant list becomes empty the session is
        marked `ended` in DDB; the SFU channel itself is left to the
        reaper (~5 min grace window for fast rejoin).
      operationId: endVideoSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EndVideoSessionRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EndVideoSessionResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /video/sessions/{sessionId}/refresh-token:
    parameters:
      - $ref: '#/components/parameters/SessionIdPath'
    post:
      tags: [video-sessions]
      summary: Rotate a participant's stage token mid-call
      description: |
        Thin proxy to LVS `POST /api/sessions/{arn}/refresh-token` —
        rotates the caller's stage token without leaving the session.
      operationId: refreshVideoSessionToken
      responses:
        '200':
          description: OK — fresh stage token payload
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: SFU circuit breaker open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '504':
          description: Upstream LVS timeout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /video/sessions/{sessionId}/recording:
    parameters:
      - $ref: '#/components/parameters/SessionIdPath'
    get:
      tags: [video-sessions]
      summary: Live recording state for the session
      description: |
        Proxies LVS `GET /api/channels/{arn}/recording`. Used by the
        in-call REC pill (polled every 5s while joined). A 404 from
        LVS collapses to `{ isRecording: false }`.
      operationId: getVideoSessionRecordingState
      parameters:
        - $ref: '#/components/parameters/LobbyNameQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordingState' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: SFU circuit breaker open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '504':
          description: Upstream LVS timeout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /video/reactions:
    get:
      tags: [video-sessions]
      summary: In-call emoji reactions for a lobby
      description: |
        Reactions drained from the durable `call:reaction.recorded` event
        into the `call-reactions` table. `from`/`to` are optional ISO-8601
        bounds (typically a recording's startedAt/endedAt window). Results
        are ascending by `at`, capped at 500.
      operationId: listCallReactions
      parameters:
        - in: query
          name: lobbyName
          required: true
          schema: { type: string }
          description: Lobby identifier the reactions were fired in.
        - in: query
          name: from
          required: false
          schema: { type: string, format: date-time }
          description: Inclusive lower bound (ISO-8601).
        - in: query
          name: to
          required: false
          schema: { type: string, format: date-time }
          description: Inclusive upper bound (ISO-8601).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [reactions]
                properties:
                  reactions:
                    type: array
                    items: { $ref: '#/components/schemas/CallReaction' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /video/captions:
    post:
      tags: [video-sessions]
      summary: Toggle live whisper captions for a channel
      description: |
        enabled=true creates a per-participant webhook-pcm tap on the LVS
        channel pointed at the live-captions ASR sidecar; enabled=false
        deletes it. Idempotent in both directions.
      operationId: toggleLiveCaptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelArn, enabled]
              properties:
                channelArn: { type: string }
                enabled: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled: { type: boolean }
                  tapId: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Cognito ID token validated by `middleware/auth.ts`. Will swap to
        the identity-server OIDC issuer in the auth migration.

  parameters:
    RecordingIdPath:
      in: path
      name: recordingId
      required: true
      schema: { type: string }
      description: Recording identifier (LVS recordingId, opaque to callers).
    SessionIdPath:
      in: path
      name: sessionId
      required: true
      schema: { type: string, format: uuid }
      description: VideoSession identifier (UUID minted at create time).
    LobbyNameQuery:
      in: query
      name: lobbyName
      required: true
      schema: { type: string }
      description: |
        Lobby name = DDB partition key. Alias `documentId` is also
        accepted on the same query slot for back-compat.
    HangoutRoomSlugPath:
      in: path
      name: slug
      required: true
      schema: { type: string, maxLength: 48 }
      description: URL-safe room slug (lowercase, alnum + hyphen, ≤48 chars).

  responses:
    BadRequest:
      description: Missing required parameter or invalid body
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    NotFound:
      description: Resource not found or caller not authorized to see it
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }

  schemas:
    CallReaction:
      type: object
      description: |
        One in-call emoji reaction, drained from `call:reaction.recorded`
        (producer websocket-gateway) into the call-reactions table.
      required: [reactionId, channel, lobbyName, emoji, at, sk]
      properties:
        reactionId: { type: string }
        channel: { type: string }
        lobbyName: { type: string }
        userId: { type: [string, 'null'] }
        displayName: { type: string }
        emoji: { type: string }
        effect: { type: string }
        at: { type: string, format: date-time }
        sk:
          type: string
          description: Composite sort key `${at}#${reactionId}`.
        ttl:
          type: integer
          description: Epoch-seconds row TTL (90 days).

    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Machine-readable error code.
        message:
          type: string

    RecordingSegment:
      type: object
      required: [key, url, size]
      properties:
        key: { type: string }
        url: { type: string, format: uri }
        size: { type: integer }

    RecordingTrack:
      type: object
      required: [key, url, size]
      properties:
        participantId: { type: string }
        userId: { type: string }
        key: { type: string }
        url: { type: string, format: uri }
        size: { type: integer }
        kind:
          type: string
          enum: [video, audio, av]
          description: Track kind; unset when ffmpeg recorded a/v together.

    CallRecordingParticipant:
      type: object
      required: [userId]
      properties:
        userId: { type: string }
        displayName: { type: string }
        participantId: { type: string }
        joinedAt: { type: string, format: date-time }

    # Full per-recording row — returned by GET /recordings/{id}.
    CallRecording:
      type: object
      required:
        [callId, recordingId, channelArn, lobbyName, startedAt, endedAt,
         durationMs, totalBytes, segments, destination, participants, ttl]
      properties:
        callId: { type: string }
        recordingId: { type: string }
        channelArn: { type: string, description: AWS IVS channel ARN. }
        lobbyName: { type: string }
        sessionId: { type: string }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        durationMs: { type: integer }
        totalBytes: { type: integer }
        segments:
          type: array
          items: { $ref: '#/components/schemas/RecordingSegment' }
        destination:
          type: string
          enum: [local, s3]
        participants:
          type: array
          items: { $ref: '#/components/schemas/CallRecordingParticipant' }
        startedBy: { type: string, description: userId of the recording owner. }
        orgId: { type: string }
        ttl: { type: integer, description: DDB TTL epoch seconds. }
        thumbnailUrl: { type: string, format: uri }
        composedUrl:
          type: string
          format: uri
          description: |
            Composed playback file (ffmpeg xstack grid). Null when the call
            had a single producer or compose was disabled.
        tracks:
          type: array
          description: Per-peer raw track recordings. Empty for single-producer calls.
          items: { $ref: '#/components/schemas/RecordingTrack' }

    # Lighter per-user fan-out row — returned by GET /recordings list.
    RecordingSummary:
      type: object
      required: [callId, recordingId, startedAt, endedAt, durationMs, channelArn, lobbyName]
      properties:
        callId: { type: string }
        recordingId: { type: string }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        durationMs: { type: integer }
        channelArn: { type: string }
        lobbyName: { type: string }
        thumbnailUrl: { type: string, format: uri }
        composedUrl: { type: string, format: uri }
        participantCount: { type: integer }

    RecordingPage:
      type: object
      required: [items, cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RecordingSummary' }
        cursor:
          type: [string, 'null']
          description: Opaque cursor for the next page; null when exhausted.

    PlaybackTokenResponse:
      type: object
      required: [playlistUrl, token, expiresAt]
      properties:
        playlistUrl:
          type: string
          format: uri
          description: LVS DVR HLS playlist URL with `from`/`to` query params.
        token:
          type: [string, 'null']
          description: LVS playback JWT; null for public channels.
        expiresAt:
          type: [string, 'null']
          format: date-time

    ShareLinkResponse:
      type: object
      required: [shareToken, shareUrl, expiresAt]
      properties:
        shareToken: { type: string }
        shareUrl:
          type: string
          description: Relative URL clients can render as the share target.
        expiresAt: { type: string, format: date-time }

    SharePlaybackResponse:
      type: object
      required: [playlistUrl, expiresAt]
      properties:
        playlistUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }

    # --- video sessions -------------------------------------------------
    VideoSessionParticipant:
      type: object
      required: [userId, participantId, displayName, joinedAt]
      properties:
        userId: { type: string }
        participantId:
          type: string
          description: Per-tab SFU participant id (dedup key in participants[]).
        displayName: { type: string }
        joinedAt: { type: string, format: date-time }

    VideoSession:
      type: object
      required: [documentId, sessionId, channelArn, streamKey, status, startedAt, startedBy, participants]
      properties:
        documentId:
          type: string
          description: Lobby name; field kept as `documentId` for back-compat.
        sessionId: { type: string, format: uuid }
        channelArn: { type: string, description: AWS IVS channel ARN. }
        streamKey:
          type: string
          description: |
            LVS stream key. Sensitive — only returned to authenticated
            callers on the session-owning lobby.
        status:
          type: string
          enum: [active, ended]
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        startedBy: { type: string, description: userId who created the session. }
        participants:
          type: array
          items: { $ref: '#/components/schemas/VideoSessionParticipant' }
        transcriptStatus:
          type: string
          enum: [pending, processing, available, failed]
        transcript: { type: string }
        aiSummary: { type: string }
        ttl: { type: integer, description: DDB TTL epoch seconds. }

    RecordingConfiguration:
      type: object
      properties:
        enabled: { type: boolean, default: true }
        destination:
          type: string
          enum: [local, s3]
          default: local

    CreateVideoSessionRequest:
      type: object
      description: |
        `lobbyName` and `documentId` are aliases — supply either one.
        If neither is present a random UUID is minted.
      properties:
        lobbyName: { type: string }
        documentId:
          type: string
          description: Alias for `lobbyName`.
        findOrCreate:
          type: boolean
          description: Return the existing active session for this lobby if alive.
        recordingConfiguration: { $ref: '#/components/schemas/RecordingConfiguration' }

    CreateVideoSessionResponse:
      type: object
      required: [sessionId, reused]
      properties:
        sessionId: { type: string, format: uuid }
        reused:
          type: boolean
          description: True when findOrCreate matched an existing live session.

    JoinVideoSessionRequest:
      type: object
      required: [lobbyName]
      description: '`documentId` accepted as alias for `lobbyName`.'
      properties:
        lobbyName: { type: string }
        documentId: { type: string }
        displayName: { type: string }

    JoinVideoSessionResponse:
      type: object
      required: [token, participantId, userId]
      properties:
        token:
          type: string
          description: LVS participant JWT (publisher role, 1-hour TTL).
        participantId: { type: string }
        userId: { type: string }

    EndVideoSessionRequest:
      type: object
      required: [lobbyName]
      description: |
        `participantId` is the preferred dedup key. Legacy clients may
        send `userId` (which removes all participants matching that
        userId). `documentId` accepted as alias for `lobbyName`.
      properties:
        lobbyName: { type: string }
        documentId: { type: string }
        participantId: { type: string }
        userId: { type: string }

    EndVideoSessionResponse:
      type: object
      required: [remaining, ended]
      properties:
        remaining:
          type: integer
          description: Participants still in the session after this leave.
        ended:
          type: boolean
          description: True when the last participant left and the session was marked ended.

    RecordingState:
      type: object
      required: [isRecording]
      properties:
        isRecording: { type: boolean }
        recordingId: { type: string }
        startedAt: { type: string, format: date-time }

    # --- hangout rooms --------------------------------------------------
    HangoutRoomVisibility:
      type: string
      enum: [org, private]
      description: |
        `org` rooms are visible to every user in the org; `private` rooms
        require an explicit membership row.

    HangoutRoomState:
      type: string
      enum: [active, archived]

    HangoutRoomSettings:
      type: object
      required: [audioOnly, recordingEnabled, softCap]
      properties:
        audioOnly: { type: boolean }
        recordingEnabled: { type: boolean }
        softCap:
          type: integer
          minimum: 1
          description: Advisory participant cap (default 25).

    HangoutRoom:
      type: object
      required:
        [orgId, roomId, slug, name, createdBy, createdAt, visibility,
         settings, state, lastActiveAt]
      properties:
        orgId: { type: string }
        roomId: { type: string, description: ULID (sortable, unique). }
        slug: { type: string, maxLength: 48 }
        name: { type: string, maxLength: 100 }
        description: { type: string }
        createdBy: { type: string, description: userId of the room creator. }
        createdAt: { type: string, format: date-time }
        visibility: { $ref: '#/components/schemas/HangoutRoomVisibility' }
        settings: { $ref: '#/components/schemas/HangoutRoomSettings' }
        state: { $ref: '#/components/schemas/HangoutRoomState' }
        lastActiveAt: { type: string, format: date-time }
        archivedAt: { type: string, format: date-time }
        ttl: { type: integer, description: DDB TTL epoch seconds (set on archive). }

    HangoutRoomMemberRole:
      type: string
      enum: [owner, member]

    HangoutRoomMember:
      type: object
      required: [roomId, userId, role, addedBy, addedAt]
      properties:
        roomId: { type: string }
        userId: { type: string }
        role: { $ref: '#/components/schemas/HangoutRoomMemberRole' }
        addedBy: { type: string }
        addedAt: { type: string, format: date-time }

    HangoutRoomResponse:
      type: object
      required: [room]
      properties:
        room: { $ref: '#/components/schemas/HangoutRoom' }

    HangoutRoomListResponse:
      type: object
      required: [rooms]
      properties:
        rooms:
          type: array
          items: { $ref: '#/components/schemas/HangoutRoom' }
        cursor:
          type: string
          description: Opaque cursor for the next page; omitted when exhausted or when `q` was supplied.

    CreateHangoutRoomRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string }
        visibility:
          $ref: '#/components/schemas/HangoutRoomVisibility'
        settings:
          type: object
          description: Partial settings — omitted fields fall back to defaults.
          properties:
            audioOnly: { type: boolean }
            recordingEnabled: { type: boolean }
            softCap: { type: integer, minimum: 1 }

    UpdateHangoutRoomRequest:
      type: object
      description: All fields optional; only supplied fields are updated.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string }
        visibility: { $ref: '#/components/schemas/HangoutRoomVisibility' }
        settings:
          type: object
          properties:
            audioOnly: { type: boolean }
            recordingEnabled: { type: boolean }
            softCap: { type: integer, minimum: 1 }

    AddHangoutRoomMemberRequest:
      type: object
      required: [userId]
      properties:
        userId: { type: string }
        role:
          $ref: '#/components/schemas/HangoutRoomMemberRole'

    JoinHangoutRoomResponse:
      type: object
      required: [room, sessionId, token, participantId]
      properties:
        room: { $ref: '#/components/schemas/HangoutRoom' }
        sessionId: { type: string, format: uuid }
        token:
          type: string
          description: LVS participant JWT (1-hour TTL) returned by the SFU.
        participantId:
          type: string
          description: Per-tab SFU participant id (dedup key for /leave).

    LeaveHangoutRoomRequest:
      type: object
      required: [sessionId]
      properties:
        sessionId: { type: string, format: uuid }
        participantId:
          type: string
          description: Preferred dedup key; without it the server removes by userId.
