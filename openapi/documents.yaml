# openapi/documents.yaml
#
# OpenAPI 3.1 spec for the documents surface of platform-api.
#
# Coverage status (per hub#1009 option B + blocker #33 re-shape):
#   - /document-types/*    full schemas  (hub#1108)
#   - /typed-documents/*   full schemas  (hub#1109)
#   - /documents/.../comments
#     + /approvals
#     + /documents/.../import|export       full schemas  (hub#1110)
#   - /documents/.../sections/.../items
#     + /documents/.../sections/.../reviews
#     + /items/mine + /reviews/mine        full schemas  (hub#1111)
#
# Path inventory is regenerated by `node scripts/openapi-coverage-lint.js`
# — adding a route under the documents mount without updating this file
# will fail the lint.
#
# Authoritative source for /document-types/* shapes:
#   src/routes/documentTypes.ts
#   src/repositories/DocumentTypeRepository.ts (DocumentTypeItem +
#     DocumentTypeFieldItem + DocumentTypeVersionSnapshot)
#
# Authoritative source for /typed-documents/* shapes:
#   src/routes/typedDocuments.ts
#   src/repositories/TypedDocumentRepository.ts (TypedDocumentItem +
#     TypedDocumentValue)

openapi: 3.1.0

info:
  title: platform-api Documents HTTP API
  description: |
    HTTP surface for the typed-documents stack: document-type schemas,
    typed document instances, comments, approvals, import/export, and
    per-section review/items.
  version: 0.2.0
  contact:
    name: platform-api

servers:
  - url: /api
    description: platform-api mount

security:
  - bearerAuth: []

tags:
  - name: document-types
    description: Document-type schema registry (definitions + versions + JSON-Schema export).
  - name: typed-documents
    description: Typed document instances + bulk operations.
  - name: document-comments
    description: Per-section comment threads (resolve/unresolve + reply chain).
  - name: approvals
    description: Append-only approval log (audit mirror of the renderer CRDT).
  - name: document-io
    description: Whole-document import / export (JSON or Markdown).
  - name: section-items
    description: Per-section task items + acknowledgments + "assigned to me" rollup.
  - name: section-reviews
    description: Per-section reviews + document-level rollup + "mine" rollup.

paths:
  # --- document-types (full schemas) --------------------------------------
  /document-types:
    get:
      tags: [document-types]
      summary: List document types
      operationId: listDocumentTypes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DocumentTypeItem' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [document-types]
      summary: Create a document type
      description: |
        `name` is required and trimmed. `fields` defaults to `[]`. Schema
        version starts at 1. A field with `showWhen.fieldId` must point
        at an existing field on the same type — callers controlling
        dependencies should set explicit `fieldId` on the source field.
      operationId: createDocumentType
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentTypeUpsertRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentTypeItem' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /document-types/{typeId}:
    parameters:
      - $ref: '#/components/parameters/TypeIdPath'
    get:
      tags: [document-types]
      summary: Fetch one document type
      operationId: getDocumentType
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentTypeItem' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [document-types]
      summary: Update name / description / icon / fields (partial)
      description: |
        Replacing `fields` snapshots the previous fields under
        `previousVersions[]` and increments `version`. Other fields can
        be patched without bumping the version.
      operationId: updateDocumentType
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentTypeUpsertRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentTypeItem' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [document-types]
      summary: Delete a document type (existing instances unaffected)
      operationId: deleteDocumentType
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'

  /document-types/{typeId}/schema:
    parameters:
      - $ref: '#/components/parameters/TypeIdPath'
    get:
      tags: [document-types]
      summary: Export the type as a JSON-Schema (draft-07)
      description: |
        Generates a JSON-Schema draft-07 representation suitable for
        client-side validators. Fields with `showWhen` are exported as
        optional (the export does not model conditionals); consumers
        should validate against the live type for full semantics.
      operationId: exportDocumentTypeSchema
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: A JSON-Schema draft-07 document (free-form).
                additionalProperties: true
                properties:
                  $schema: { type: string }
                  $id: { type: string }
                  title: { type: string }
                  type: { type: string }
                  properties:
                    type: object
                    additionalProperties: true
                  required:
                    type: array
                    items: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /document-types/{typeId}/versions:
    parameters:
      - $ref: '#/components/parameters/TypeIdPath'
    get:
      tags: [document-types]
      summary: List historical schema versions for a type
      operationId: listDocumentTypeVersions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [typeId, current, versions]
                properties:
                  typeId: { type: string }
                  current: { $ref: '#/components/schemas/DocumentTypeVersionSnapshot' }
                  versions:
                    type: array
                    items: { $ref: '#/components/schemas/DocumentTypeVersionSnapshot' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /document-types/{typeId}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/TypeIdPath'
      - in: path
        name: version
        required: true
        schema: { type: integer, minimum: 1 }
        description: Version number (1-based, matches `DocumentTypeItem.version`).
    get:
      tags: [document-types]
      summary: Fetch one historical schema version
      operationId: getDocumentTypeVersion
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentTypeVersionSnapshot' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # --- approvals (full schemas) -------------------------------------------
  /approvals:
    get:
      tags: [approvals]
      summary: List approval entries by document OR by decision status
      description: |
        Exactly one of `documentId` or `status` is required. Document-scoped
        queries use the table's main partition; status-scoped queries use
        the `status-index` GSI and return newest-first.
      operationId: listApprovals
      parameters:
        - in: query
          name: documentId
          required: false
          schema: { type: string }
          description: Document to list approvals for.
        - in: query
          name: status
          required: false
          schema: { $ref: '#/components/schemas/ApprovalDecision' }
          description: Decision to filter by.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ApprovalEntry' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [approvals]
      summary: Append an approval entry
      description: |
        Server mints `workflowId` and `createdAt`. `reviewerId` is taken
        from the auth token, not the request body.
      operationId: createApproval
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalEntry' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # --- document comments (full schemas) -----------------------------------
  /documents/{documentId}/comments:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
    get:
      tags: [document-comments]
      summary: List comments for a document (optionally scoped to one section)
      description: |
        Without `sectionId`, queries the main partition and returns the
        whole document's comment thread. With `sectionId`, queries the
        `sectionId-timestamp-index` GSI and returns just that section's
        thread.
      operationId: listDocumentComments
      parameters:
        - in: query
          name: sectionId
          required: false
          schema: { type: string }
          description: If set, returns only this section's comments.
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [comments]
                properties:
                  comments:
                    type: array
                    items: { $ref: '#/components/schemas/DocumentComment' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [document-comments]
      summary: Post a comment or threaded reply
      description: |
        `text` is trimmed and capped at 10000 characters. Pass
        `parentCommentId` to thread under an existing comment.
        `displayName` and `color` are denormalized server-side from the
        caller's profile.
      operationId: createDocumentComment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentCommentCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [comment]
                properties:
                  comment: { $ref: '#/components/schemas/DocumentComment' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /documents/{documentId}/comments/{commentId}:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
      - $ref: '#/components/parameters/CommentIdPath'
    patch:
      tags: [document-comments]
      summary: Resolve or unresolve a comment thread
      description: |
        `resolved=true` stamps `resolvedBy` (from the auth token) and
        `resolvedAt` (now). `resolved=false` removes those fields.
      operationId: setDocumentCommentResolved
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentCommentPatchRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [comment]
                properties:
                  comment: { $ref: '#/components/schemas/DocumentCommentResolveResult' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [document-comments]
      summary: Delete a comment
      operationId: deleteDocumentComment
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'

  # --- document import / export (full schemas) ---------------------------
  /documents/{documentId}/export:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
    get:
      tags: [document-io]
      summary: Export a document as JSON or Markdown
      description: |
        The response Content-Type depends on `format`:

        - `format=json` (default): returns `application/json` with a
          structured envelope (`DocumentJsonExport`).
        - `format=md`: returns `text/markdown; charset=utf-8` and sets
          `Content-Disposition: attachment; filename="<title>.md"` so
          browsers prompt to save.

        The export is synchronous — the full document is built in
        memory and returned in one response. No streaming.
      operationId: exportDocument
      parameters:
        - in: query
          name: format
          required: false
          schema:
            type: string
            enum: [json, md]
            default: json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentJsonExport' }
            text/markdown:
              schema:
                type: string
                description: Markdown-formatted document (sections, items, comments, reviews).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /documents/{documentId}/import:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
    post:
      tags: [document-io]
      summary: Import sections + items into an existing document
      description: |
        Accepts a Markdown body (sections parsed from `##` headers) or
        a JSON envelope (the inverse of `GET /export?format=json`).
        The target document must already exist — this endpoint adds
        sections/items, it does not create the document.
      operationId: importDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentImportRequest' }
      responses:
        '201':
          description: Imported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentImportResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # --- section reviews (full schemas) -------------------------------------
  /documents/{documentId}/reviews:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
    get:
      tags: [section-reviews]
      summary: List ALL section reviews across a document (rollup)
      description: |
        Returns every review across every section of the document — used
        by the document-level review tracker / status panel. The shape
        matches the per-section endpoint; consumers filter or group by
        `sectionId` client-side.
      operationId: listDocumentReviews
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [reviews]
                properties:
                  reviews:
                    type: array
                    items: { $ref: '#/components/schemas/SectionReview' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /documents/{documentId}/sections/{sectionId}/reviews:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
      - $ref: '#/components/parameters/SectionIdPath'
    get:
      tags: [section-reviews]
      summary: List reviews submitted on one section
      operationId: listSectionReviews
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [reviews]
                properties:
                  reviews:
                    type: array
                    items: { $ref: '#/components/schemas/SectionReview' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [section-reviews]
      summary: Submit (or overwrite) the caller's review of a section
      description: |
        Idempotent on `(sectionId, userId)` — the storage row uses
        `reviewKey = "{sectionId}:{userId}"`, so re-submitting from the
        same caller replaces their prior review on that section. The
        caller's display name is denormalized from their profile at
        submit time.
      operationId: submitSectionReview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SectionReviewSubmitRequest' }
      responses:
        '201':
          description: Created (or replaced)
          content:
            application/json:
              schema:
                type: object
                required: [review]
                properties:
                  review: { $ref: '#/components/schemas/SectionReview' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /reviews/mine:
    get:
      tags: [section-reviews]
      summary: List the caller's own reviews across all documents
      description: |
        Cross-document rollup — uses the `userId-documentId-index` GSI
        to find every review the caller has submitted. Shape matches the
        per-section / per-document endpoints.
      operationId: listMyReviews
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [reviews]
                properties:
                  reviews:
                    type: array
                    items: { $ref: '#/components/schemas/SectionReview' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  # --- section items (full schemas) ---------------------------------------
  /documents/{documentId}/sections/{sectionId}/items:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
      - $ref: '#/components/parameters/SectionIdPath'
    get:
      tags: [section-items]
      summary: List items in a section
      operationId: listSectionItems
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SectionItem' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [section-items]
      summary: Create a section item (text may be empty for inline edit)
      description: |
        Items are created inline in the editor — `text` may be empty
        and filled in by a subsequent PATCH. `status` defaults to
        `"open"` server-side.
      operationId: createSectionItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SectionItemCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item: { $ref: '#/components/schemas/SectionItem' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /documents/{documentId}/sections/{sectionId}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
      - $ref: '#/components/parameters/SectionIdPath'
      - $ref: '#/components/parameters/ItemIdPath'
    patch:
      tags: [section-items]
      summary: Update item fields (partial)
      description: |
        At least one field must be supplied. The response echoes the
        full updated item (DynamoDB `ReturnValues=ALL_NEW`).
      operationId: updateSectionItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SectionItemPatchRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item: { $ref: '#/components/schemas/SectionItem' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [section-items]
      summary: Delete a section item
      operationId: deleteSectionItem
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'

  /documents/{documentId}/sections/{sectionId}/items/{itemId}/ack:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
      - $ref: '#/components/parameters/SectionIdPath'
      - $ref: '#/components/parameters/ItemIdPath'
    post:
      tags: [section-items]
      summary: Acknowledge an item (caller marks read / accepted)
      description: |
        Stamps `ackedBy` (from the auth token) and `ackedAt` (now) on
        the item. The response echoes the full updated item.
      operationId: ackSectionItem
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item: { $ref: '#/components/schemas/SectionItem' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /documents/{documentId}/sections/{sectionId}/items/{itemId}/answer:
    parameters:
      - $ref: '#/components/parameters/DocumentIdPath'
      - $ref: '#/components/parameters/SectionIdPath'
      - $ref: '#/components/parameters/ItemIdPath'
    post:
      tags: [section-items]
      summary: Answer a HITL callout addressed to the caller
      description: |
        Only for items with `category: hitl`, and only by the person the
        callout is addressed to (`assigneeId`, falling back to `assignee`).
        Sets `status: done`, `notes` to the answer, and `ackedBy`/`ackedAt`
        in one update, then signals `section:item:answered` on the
        document channel.
      operationId: answerSectionItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { type: string, minLength: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item: { $ref: '#/components/schemas/SectionItem' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not the person the callout is addressed to (or it is addressed to nobody).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The callout is no longer waiting on an answer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /items/mine:
    get:
      tags: [section-items]
      summary: List items assigned to the caller (optionally filtered by status)
      description: |
        Cross-document rollup, keyed on the caller's auth subject.

        Reads the `assigneeId-status-index` GSI (identity), and also the
        legacy `assignee-status-index` for the SAME id — never for a name —
        because voice work items and the summary projector wrote a real
        userId into `assignee` before the label/identity split. Rows whose
        `assignee` holds only a display name are not returned; they have
        never been findable and there is no server-side name→identity
        directory that could resolve them.

        Without `status`, returns items in any state.
      operationId: listMyItems
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string }
          description: Optional — typically "open", "in_progress", "done".
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SectionItem' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  # --- typed documents (full schemas) -------------------------------------
  /typed-documents:
    get:
      tags: [typed-documents]
      summary: List typed-document instances for a type
      operationId: listTypedDocuments
      parameters:
        - in: query
          name: typeId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TypedDocumentItem' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [typed-documents]
      summary: Create a typed-document instance
      description: |
        Values are validated against the target DocumentType's field
        registry (required fields, cardinality, enum options, regex,
        min/max). Cross-type references are existence-checked.
      operationId: createTypedDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTypedDocumentRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TypedDocumentItem' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Target DocumentType not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /typed-documents/{documentId}:
    parameters:
      - in: path
        name: documentId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [typed-documents]
      summary: Fetch one typed-document instance
      operationId: getTypedDocument
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TypedDocumentItem' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [typed-documents]
      summary: Update field values (partial)
      description: |
        Accepts either `{ values: { fieldId: value } }` or the
        single-field shorthand `{ field, value }`. Merged values are
        re-validated against the type's schema before persisting.
      operationId: updateTypedDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTypedDocumentRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TypedDocumentItem' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /typed-documents/bulk:
    post:
      tags: [typed-documents]
      summary: Bulk create / update / delete (max 100 items per call)
      description: |
        Discriminated by `operation`. All items in a single call must
        pass validation — the route validates everything before any
        write, so a single bad item aborts the whole batch.
      operationId: bulkTypedDocumentsOp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkTypedDocumentsRequest' }
      responses:
        '200':
          description: Bulk update or delete result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkTypedDocumentsResponse' }
        '201':
          description: Bulk create result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkTypedDocumentsResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /typed-documents/bulk-import:
    post:
      tags: [typed-documents]
      summary: Bulk-import typed documents from a CSV file
      description: |
        Accepts a CSV upload (multipart/form-data, field name `file`,
        max 5 MiB, max 10000 rows). Column headers are matched against
        field IDs OR field names on the target type; unknown columns
        are skipped silently. Multi-value (`cardinality=unlimited`)
        cells are split on `;`. Returns per-row errors so the
        frontend can rebuild a CSV of the failed rows for re-upload.
      operationId: bulkImportTypedDocuments
      parameters:
        - in: query
          name: typeId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV file.
      responses:
        '200':
          description: Import result (may include per-row errors)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkImportResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Target DocumentType not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Cognito ID token validated by `middleware/auth.ts`. Will swap to
        the identity-server OIDC issuer in the auth migration.

  parameters:
    TypeIdPath:
      in: path
      name: typeId
      required: true
      schema: { type: string }
      description: Document-type identifier (UUID minted at create time).
    DocumentIdPath:
      in: path
      name: documentId
      required: true
      schema: { type: string }
      description: Document identifier (UUID, key of the crdt-documents row).
    CommentIdPath:
      in: path
      name: commentId
      required: true
      schema: { type: string }
      description: Comment identifier (ULID minted on create).
    SectionIdPath:
      in: path
      name: sectionId
      required: true
      schema: { type: string }
      description: Section identifier (client-minted, scoped to the document).
    ItemIdPath:
      in: path
      name: itemId
      required: true
      schema: { type: string }
      description: Section-item identifier (ULID minted on create).

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }

  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error: { type: string, description: 'Machine-readable error code.' }
        message: { type: string }

    DocumentTypeFieldKind:
      type: string
      enum: [text, long_text, number, date, boolean, enum, reference]

    DocumentTypeFieldWidget:
      type: string
      enum: [text_field, textarea, number_input, date_picker, checkbox, select, reference_picker]

    DocumentTypeFieldCardinality:
      description: '`1` for a single value, `"unlimited"` for an array.'
      oneOf:
        - type: integer
          enum: [1]
        - type: string
          enum: [unlimited]

    DocumentTypeFieldValidation:
      type: object
      description: |
        Numeric fields use min/max for value range; text fields use them
        for length. `regex` is text/long_text only; `requireTrue` is
        boolean only.
      properties:
        min: { type: number }
        max: { type: number }
        regex: { type: string }
        requireTrue: { type: boolean }

    DocumentTypeFieldShowWhen:
      type: object
      required: [fieldId, equals]
      properties:
        fieldId:
          type: string
          description: Source field's fieldId on the same type.
        equals:
          description: Value the source field must equal for this field to be visible.
          oneOf:
            - { type: string }
            - { type: number }
            - { type: boolean }

    DocumentTypeFieldDisplayModes:
      type: object
      description: 'Per-context visibility. Default when absent: visible in `full` only.'
      properties:
        full: { type: boolean }
        teaser: { type: boolean }
        list: { type: boolean }

    DocumentTypeFieldItem:
      type: object
      required: [fieldId, name, fieldType, widget, cardinality, required, helpText]
      properties:
        fieldId:
          type: string
          description: Server-minted UUID (caller-supplied IDs respected).
        name: { type: string, minLength: 1 }
        fieldType: { $ref: '#/components/schemas/DocumentTypeFieldKind' }
        widget: { $ref: '#/components/schemas/DocumentTypeFieldWidget' }
        cardinality: { $ref: '#/components/schemas/DocumentTypeFieldCardinality' }
        required: { type: boolean }
        helpText: { type: string }
        options:
          type: array
          items: { type: string, minLength: 1 }
          description: Required when `fieldType=enum`.
        referenceTypeId:
          type: string
          description: Required when `fieldType=reference` — target DocumentType.
        validation: { $ref: '#/components/schemas/DocumentTypeFieldValidation' }
        showWhen: { $ref: '#/components/schemas/DocumentTypeFieldShowWhen' }
        displayModes: { $ref: '#/components/schemas/DocumentTypeFieldDisplayModes' }

    DocumentTypeItem:
      type: object
      required: [typeId, name, description, icon, fields, createdBy, createdAt, updatedAt]
      properties:
        typeId: { type: string }
        name: { type: string, minLength: 1 }
        description: { type: string }
        icon: { type: string, description: 'Emoji or short marker. Defaults to "📄".' }
        fields:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/DocumentTypeFieldItem' }
        createdBy:
          type: string
          description: Cognito sub of the creating user.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version:
          type: integer
          minimum: 1
          description: 'Schema version; bumped on fields[] replace.'
        previousVersions:
          type: array
          items: { $ref: '#/components/schemas/DocumentTypeVersionSnapshot' }

    DocumentTypeVersionSnapshot:
      type: object
      required: [version, name, description, icon, fields, updatedAt]
      properties:
        version: { type: integer, minimum: 1 }
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        fields:
          type: array
          items: { $ref: '#/components/schemas/DocumentTypeFieldItem' }
        updatedAt: { type: string, format: date-time }

    # Shared upsert body for POST + PUT /document-types. PUT semantics:
    # any field may be omitted (partial). POST semantics: `name` is
    # effectively required.
    DocumentTypeUpsertRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        icon: { type: string }
        fields:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/DocumentTypeFieldItem' }

    # --- typed documents ----------------------------------------------
    TypedDocumentValue:
      description: |
        Value stored in `TypedDocumentItem.values[fieldId]`. The route
        layer validates each value against the field's `fieldType` and
        `cardinality` (`unlimited` ⇒ array variant).
      oneOf:
        - { type: string }
        - { type: array, items: { type: string } }
        - { type: number }
        - { type: array, items: { type: number } }
        - { type: boolean }

    TypedDocumentItem:
      type: object
      required: [documentId, typeId, values, createdBy, createdAt, updatedAt]
      properties:
        documentId: { type: string, format: uuid }
        typeId:
          type: string
          description: References the DocumentType this instance conforms to.
        values:
          type: object
          description: Map of fieldId → TypedDocumentValue.
          additionalProperties: { $ref: '#/components/schemas/TypedDocumentValue' }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateTypedDocumentRequest:
      type: object
      required: [typeId]
      properties:
        typeId: { type: string }
        values:
          type: object
          additionalProperties: { $ref: '#/components/schemas/TypedDocumentValue' }

    # PATCH accepts either { values: {...} } or { field, value } shorthand.
    UpdateTypedDocumentRequest:
      oneOf:
        - type: object
          required: [values]
          properties:
            values:
              type: object
              additionalProperties: { $ref: '#/components/schemas/TypedDocumentValue' }
        - type: object
          required: [field, value]
          properties:
            field: { type: string, description: fieldId of the value to update. }
            value: { $ref: '#/components/schemas/TypedDocumentValue' }

    # Discriminated union — `operation` selects which fields are required.
    BulkTypedDocumentsRequest:
      type: object
      required: [operation]
      properties:
        operation:
          type: string
          enum: [create, update, delete]
        typeId:
          type: string
          description: Required when `operation=create`.
        items:
          type: array
          maxItems: 100
          description: |
            Required when `operation=create`. Each entry is the `values`
            object (fieldId → TypedDocumentValue map).
          items:
            type: object
            additionalProperties: { $ref: '#/components/schemas/TypedDocumentValue' }
        updates:
          type: array
          maxItems: 100
          description: Required when `operation=update`.
          items:
            type: object
            required: [documentId, values]
            properties:
              documentId: { type: string }
              values:
                type: object
                additionalProperties: { $ref: '#/components/schemas/TypedDocumentValue' }
        documentIds:
          type: array
          maxItems: 100
          description: Required when `operation=delete`.
          items: { type: string }

    BulkTypedDocumentsResponse:
      type: object
      description: Exactly one of `created`, `updated`, or `deleted` is set.
      properties:
        created: { type: integer }
        updated: { type: integer }
        deleted: { type: integer }

    BulkImportError:
      type: object
      required: [row, reason, rawRow]
      properties:
        row:
          type: integer
          description: 1-based CSV row number (header is row 1).
        reason: { type: string }
        rawRow:
          type: object
          additionalProperties: { type: string }
          description: Original CSV row as a column → string map.

    BulkImportResponse:
      type: object
      required: [imported, failed, columns, errors]
      properties:
        imported: { type: integer }
        failed: { type: integer }
        columns:
          type: array
          items: { type: string }
          description: Original CSV column order (for failed-row CSV rebuild).
        errors:
          type: array
          items: { $ref: '#/components/schemas/BulkImportError' }

    # --- document comments --------------------------------------------
    DocumentComment:
      type: object
      required: [documentId, commentId, sectionId, text, userId, displayName, color, timestamp]
      properties:
        documentId: { type: string }
        commentId:
          type: string
          description: ULID minted server-side at create time.
        sectionId: { type: string }
        text:
          type: string
          minLength: 1
          maxLength: 10000
        userId:
          type: string
          description: Cognito sub of the author.
        displayName:
          type: string
          description: Author's display name (email fallback) at post time.
        color:
          type: string
          description: Author chip color (currently hard-coded to "#4A90D9").
        timestamp: { type: string, format: date-time }
        parentCommentId:
          type: string
          description: Set when this comment replies to another in the same thread.
        resolved:
          type: boolean
          description: Absent until the thread is resolved at least once.
        resolvedBy: { type: string }
        resolvedAt: { type: string, format: date-time }

    DocumentCommentCreateRequest:
      type: object
      required: [sectionId, text]
      properties:
        sectionId: { type: string, minLength: 1 }
        text: { type: string, minLength: 1, maxLength: 10000 }
        parentCommentId:
          type: string
          description: Optional — set to thread under an existing comment.

    DocumentCommentPatchRequest:
      type: object
      required: [resolved]
      properties:
        resolved: { type: boolean }

    DocumentCommentResolveResult:
      type: object
      required: [documentId, commentId, resolved]
      description: |
        Subset returned from `PATCH /documents/{documentId}/comments/{commentId}`.
        Only the resolve-state fields are echoed back — full re-fetch via
        `GET /documents/{documentId}/comments` if you need the rest.
      properties:
        documentId: { type: string }
        commentId: { type: string }
        resolved: { type: boolean }
        resolvedBy: { type: string }
        resolvedAt: { type: string, format: date-time }

    # --- approvals ----------------------------------------------------
    ApprovalDecision:
      type: string
      enum: [approved, rejected, changes_requested]

    ApprovalEntry:
      type: object
      required: [documentId, workflowId, sectionId, reviewerId, decision, workflowStatus, createdAt]
      properties:
        documentId: { type: string }
        workflowId:
          type: string
          format: uuid
          description: Per-entry UUID minted server-side at create time.
        sectionId: { type: string }
        reviewerId:
          type: string
          description: Cognito sub of the reviewer.
        reviewerName:
          type: string
          description: Denormalized reviewer display name for audit readability.
        decision: { $ref: '#/components/schemas/ApprovalDecision' }
        comment: { type: string }
        workflowStatus:
          allOf:
            - $ref: '#/components/schemas/ApprovalDecision'
          description: Mirrors `decision`; populated to back the `status-index` GSI.
        createdAt: { type: string, format: date-time }

    ApprovalCreateRequest:
      type: object
      required: [documentId, sectionId, decision]
      properties:
        documentId: { type: string, minLength: 1 }
        sectionId: { type: string, minLength: 1 }
        decision: { $ref: '#/components/schemas/ApprovalDecision' }
        reviewerName:
          type: string
          description: Optional — denormalized for audit logs.
        comment: { type: string }

    # --- document import / export -------------------------------------
    DocumentImportRequest:
      type: object
      required: [format, content]
      properties:
        format:
          type: string
          enum: [markdown, json]
        content:
          type: string
          minLength: 1
          description: |
            Raw document body. For `markdown`, headers (`##`) become sections
            and bullet lines under each header become items. For `json`,
            the envelope must match the shape returned by `GET /export?format=json`.

    DocumentImportResponse:
      type: object
      required: [documentId, sectionsCreated, itemsCreated]
      properties:
        documentId: { type: string }
        sectionsCreated: { type: integer, minimum: 0 }
        itemsCreated: { type: integer, minimum: 0 }

    DocumentJsonExport:
      type: object
      description: |
        Envelope returned by `GET /documents/{documentId}/export?format=json`.
        Mirrors the renderer's section/item/comment/review groupings.
      required: [document]
      properties:
        document:
          type: object
          required: [meta, sections]
          properties:
            meta: { $ref: '#/components/schemas/DocumentExportMeta' }
            sections:
              type: array
              items: { $ref: '#/components/schemas/DocumentExportSection' }

    DocumentExportMeta:
      type: object
      required: [id, title, type, status, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        type: { type: string }
        status: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        icon: { type: string }
        description: { type: string }

    DocumentExportSection:
      type: object
      required: [id, title, type, sortOrder, items, comments, reviews]
      properties:
        id: { type: string }
        title: { type: string }
        type: { type: string }
        sectionType: { type: string }
        sortOrder: { type: number }
        items:
          type: array
          items: { $ref: '#/components/schemas/DocumentExportItem' }
        comments:
          type: array
          items: { $ref: '#/components/schemas/DocumentExportComment' }
        reviews:
          type: array
          items: { $ref: '#/components/schemas/DocumentExportReview' }

    DocumentExportItem:
      type: object
      required: [id, text, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        text: { type: string }
        status: { type: string }
        assignee: { type: string }
        priority: { type: string }
        dueDate: { type: string }
        category: { type: string }
        notes: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DocumentExportComment:
      type: object
      required: [id, text, userId, displayName, timestamp]
      properties:
        id: { type: string }
        text: { type: string }
        userId: { type: string }
        displayName: { type: string }
        timestamp: { type: string, format: date-time }
        parentCommentId: { type: string }
        resolved: { type: boolean }

    DocumentExportReview:
      type: object
      required: [userId, displayName, status, timestamp]
      properties:
        userId: { type: string }
        displayName: { type: string }
        status: { type: string }
        timestamp: { type: string, format: date-time }
        comment: { type: string }

    # --- section items ------------------------------------------------
    SectionItem:
      type: object
      required: [sectionKey, itemId, documentId, sectionId, text, createdAt, updatedAt]
      properties:
        sectionKey:
          type: string
          description: |
            Composite hash key `"{documentId}:{sectionId}"` exposed for
            cache de-duplication. Not part of the public addressing —
            use `documentId` + `sectionId` + `itemId` for routing.
        itemId:
          type: string
          description: ULID minted server-side at create time.
        documentId: { type: string }
        sectionId: { type: string }
        text: { type: string }
        status:
          type: string
          description: 'Defaults to "open" at create; typical values: open, in_progress, done.'
        assignee:
          type: string
          description: |
            HUMAN LABEL for the assigned user ("Alice Chen") — what the
            assignee badge renders. NOT an identity: this field used to be
            documented as a Cognito sub while the app wrote a display name
            into it, which is why /items/mine returned nothing for everyone.
        assigneeId:
          type: string
          description: |
            Identity of the assigned user (auth subject / Cognito sub).
            The only field /items/mine is keyed on. Absent on rows written
            before the label/identity split, and on rows assigned by name
            alone — such a row is not findable by assignee, by design.
        priority: { type: string }
        dueDate: { type: string }
        category: { type: string }
        notes: { type: string }
        ackedBy:
          type: string
          description: Cognito sub of the most recent ack (POST .../ack).
        ackedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SectionItemCreateRequest:
      type: object
      description: |
        All fields optional — items are created inline and the user fills
        them in via subsequent PATCH calls. `status` defaults to "open"
        server-side; do not send it on create.
      properties:
        text: { type: string }
        assignee: { type: string }
        priority: { type: string }
        dueDate: { type: string }
        category: { type: string }

    SectionItemPatchRequest:
      type: object
      description: |
        At least one field must be present. `status` is settable here
        (unlike create). `notes` is patch-only — not accepted on create.
      properties:
        text: { type: string }
        status: { type: string }
        assignee: { type: string }
        priority: { type: string }
        dueDate: { type: string }
        notes: { type: string }
      minProperties: 1

    # --- section reviews ----------------------------------------------
    SectionReview:
      type: object
      required: [documentId, reviewKey, sectionId, userId, displayName, status, timestamp]
      properties:
        documentId: { type: string }
        reviewKey:
          type: string
          description: |
            Composite sort key `"{sectionId}:{userId}"`. Surfaced because
            it is also the addressable identity (one review per
            user per section); included here for cache reconciliation.
        sectionId: { type: string }
        userId:
          type: string
          description: Cognito sub of the reviewer.
        displayName:
          type: string
          description: Reviewer profile display name (caller's sub fallback).
        status:
          type: string
          description: |
            Caller-chosen review status — typical values include
            "approved", "rejected", "changes_requested", "pending". The
            route accepts any non-empty string; the frontend constrains
            the set.
        timestamp: { type: string, format: date-time }
        comment: { type: string }

    SectionReviewSubmitRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          minLength: 1
          description: See `SectionReview.status` for typical values.
        comment: { type: string }
