# openapi/documents.yaml
#
# OpenAPI 3.1 spec for the documents surface of platform-api.
#
# Coverage status (per hub#1009 option B + blocker #33 re-shape):
#   - /document-types/*    full schemas  (hub#1108)
#   - /typed-documents/*   full schemas  (this commit — hub#1109)
#   - /documents/.../comments
#     + /approvals
#     + /documents/.../import|export       skeleton  (hub#1110 follow-up)
#   - /documents/.../sections/.../items
#     + /documents/.../sections/.../reviews
#     + /items/mine + /reviews/mine        skeleton  (hub#1111 follow-up)
#
# Path inventory is regenerated by `node scripts/openapi-coverage-lint.js`
# — adding a route under the documents mount without updating this file
# will fail the lint.
#
# Authoritative source for /document-types/* shapes:
#   src/routes/documentTypes.ts
#   src/repositories/DocumentTypeRepository.ts (DocumentTypeItem +
#     DocumentTypeFieldItem + DocumentTypeVersionSnapshot)
#
# Authoritative source for /typed-documents/* shapes:
#   src/routes/typedDocuments.ts
#   src/repositories/TypedDocumentRepository.ts (TypedDocumentItem +
#     TypedDocumentValue)

openapi: 3.1.0

info:
  title: platform-api Documents HTTP API
  description: |
    HTTP surface for the typed-documents stack: document-type schemas,
    typed document instances, comments, approvals, import/export, and
    per-section review/items.
  version: 0.2.0
  contact:
    name: platform-api

servers:
  - url: /api
    description: platform-api mount

security:
  - bearerAuth: []

tags:
  - name: document-types
    description: Document-type schema registry (definitions + versions + JSON-Schema export).
  - name: typed-documents
    description: Typed document instances + bulk operations.
  - name: document-comments
    description: Comments threaded against a document (skeleton — schemas pending).
  - name: approvals
    description: Approval workflow surface (skeleton — schemas pending).
  - name: document-io
    description: Import / export (skeleton — schemas pending).
  - name: section-items
    description: Per-section task items + acknowledgments (skeleton — schemas pending).
  - name: section-reviews
    description: Per-section reviews + rollups (skeleton — schemas pending).

paths:
  # --- document-types (full schemas) --------------------------------------
  /document-types:
    get:
      tags: [document-types]
      summary: List document types
      operationId: listDocumentTypes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DocumentTypeItem' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [document-types]
      summary: Create a document type
      description: |
        `name` is required and trimmed. `fields` defaults to `[]`. Schema
        version starts at 1. A field with `showWhen.fieldId` must point
        at an existing field on the same type — callers controlling
        dependencies should set explicit `fieldId` on the source field.
      operationId: createDocumentType
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentTypeUpsertRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentTypeItem' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /document-types/{typeId}:
    parameters:
      - $ref: '#/components/parameters/TypeIdPath'
    get:
      tags: [document-types]
      summary: Fetch one document type
      operationId: getDocumentType
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentTypeItem' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [document-types]
      summary: Update name / description / icon / fields (partial)
      description: |
        Replacing `fields` snapshots the previous fields under
        `previousVersions[]` and increments `version`. Other fields can
        be patched without bumping the version.
      operationId: updateDocumentType
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentTypeUpsertRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentTypeItem' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [document-types]
      summary: Delete a document type (existing instances unaffected)
      operationId: deleteDocumentType
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'

  /document-types/{typeId}/schema:
    parameters:
      - $ref: '#/components/parameters/TypeIdPath'
    get:
      tags: [document-types]
      summary: Export the type as a JSON-Schema (draft-07)
      description: |
        Generates a JSON-Schema draft-07 representation suitable for
        client-side validators. Fields with `showWhen` are exported as
        optional (the export does not model conditionals); consumers
        should validate against the live type for full semantics.
      operationId: exportDocumentTypeSchema
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: A JSON-Schema draft-07 document (free-form).
                additionalProperties: true
                properties:
                  $schema: { type: string }
                  $id: { type: string }
                  title: { type: string }
                  type: { type: string }
                  properties:
                    type: object
                    additionalProperties: true
                  required:
                    type: array
                    items: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /document-types/{typeId}/versions:
    parameters:
      - $ref: '#/components/parameters/TypeIdPath'
    get:
      tags: [document-types]
      summary: List historical schema versions for a type
      operationId: listDocumentTypeVersions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [typeId, current, versions]
                properties:
                  typeId: { type: string }
                  current: { $ref: '#/components/schemas/DocumentTypeVersionSnapshot' }
                  versions:
                    type: array
                    items: { $ref: '#/components/schemas/DocumentTypeVersionSnapshot' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /document-types/{typeId}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/TypeIdPath'
      - in: path
        name: version
        required: true
        schema: { type: integer, minimum: 1 }
        description: Version number (1-based, matches `DocumentTypeItem.version`).
    get:
      tags: [document-types]
      summary: Fetch one historical schema version
      operationId: getDocumentTypeVersion
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentTypeVersionSnapshot' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # --- approvals (skeleton — see hub#1110) --------------------------------
  '/approvals':
    get:
      summary: TODO — schema pending (approvals.ts)
      tags: [approvals]
      responses: { '200': { description: OK } }
    post:
      summary: TODO — schema pending (approvals.ts)
      tags: [approvals]
      responses: { '200': { description: OK } }

  # --- document comments (skeleton — see hub#1110) ------------------------
  '/documents/{documentId}/comments':
    get:
      summary: TODO — schema pending (documentComments.ts)
      tags: [document-comments]
      responses: { '200': { description: OK } }
    post:
      summary: TODO — schema pending (documentComments.ts)
      tags: [document-comments]
      responses: { '200': { description: OK } }
  '/documents/{documentId}/comments/{commentId}':
    patch:
      summary: TODO — schema pending (documentComments.ts)
      tags: [document-comments]
      responses: { '200': { description: OK } }
    delete:
      summary: TODO — schema pending (documentComments.ts)
      tags: [document-comments]
      responses: { '200': { description: OK } }

  # --- document import / export (skeleton — see hub#1110) -----------------
  '/documents/{documentId}/export':
    get:
      summary: TODO — schema pending (documentImportExport.ts)
      tags: [document-io]
      responses: { '200': { description: OK } }
  '/documents/{documentId}/import':
    post:
      summary: TODO — schema pending (documentImportExport.ts)
      tags: [document-io]
      responses: { '200': { description: OK } }

  # --- section reviews (skeleton — see hub#1111) --------------------------
  '/documents/{documentId}/reviews':
    get:
      summary: TODO — schema pending (sectionReviews.ts)
      tags: [section-reviews]
      responses: { '200': { description: OK } }
  '/documents/{documentId}/sections/{sectionId}/reviews':
    get:
      summary: TODO — schema pending (sectionReviews.ts)
      tags: [section-reviews]
      responses: { '200': { description: OK } }
    post:
      summary: TODO — schema pending (sectionReviews.ts)
      tags: [section-reviews]
      responses: { '200': { description: OK } }
  '/reviews/mine':
    get:
      summary: TODO — schema pending (sectionReviews.ts)
      tags: [section-reviews]
      responses: { '200': { description: OK } }

  # --- section items (skeleton — see hub#1111) ----------------------------
  '/documents/{documentId}/sections/{sectionId}/items':
    get:
      summary: TODO — schema pending (sectionItems.ts)
      tags: [section-items]
      responses: { '200': { description: OK } }
    post:
      summary: TODO — schema pending (sectionItems.ts)
      tags: [section-items]
      responses: { '200': { description: OK } }
  '/documents/{documentId}/sections/{sectionId}/items/{itemId}':
    patch:
      summary: TODO — schema pending (sectionItems.ts)
      tags: [section-items]
      responses: { '200': { description: OK } }
    delete:
      summary: TODO — schema pending (sectionItems.ts)
      tags: [section-items]
      responses: { '200': { description: OK } }
  '/documents/{documentId}/sections/{sectionId}/items/{itemId}/ack':
    post:
      summary: TODO — schema pending (sectionItems.ts)
      tags: [section-items]
      responses: { '200': { description: OK } }
  '/items/mine':
    get:
      summary: TODO — schema pending (sectionItems.ts)
      tags: [section-items]
      responses: { '200': { description: OK } }

  # --- typed documents (full schemas) -------------------------------------
  /typed-documents:
    get:
      tags: [typed-documents]
      summary: List typed-document instances for a type
      operationId: listTypedDocuments
      parameters:
        - in: query
          name: typeId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TypedDocumentItem' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [typed-documents]
      summary: Create a typed-document instance
      description: |
        Values are validated against the target DocumentType's field
        registry (required fields, cardinality, enum options, regex,
        min/max). Cross-type references are existence-checked.
      operationId: createTypedDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTypedDocumentRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TypedDocumentItem' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Target DocumentType not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /typed-documents/{documentId}:
    parameters:
      - in: path
        name: documentId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [typed-documents]
      summary: Fetch one typed-document instance
      operationId: getTypedDocument
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TypedDocumentItem' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [typed-documents]
      summary: Update field values (partial)
      description: |
        Accepts either `{ values: { fieldId: value } }` or the
        single-field shorthand `{ field, value }`. Merged values are
        re-validated against the type's schema before persisting.
      operationId: updateTypedDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTypedDocumentRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TypedDocumentItem' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /typed-documents/bulk:
    post:
      tags: [typed-documents]
      summary: Bulk create / update / delete (max 100 items per call)
      description: |
        Discriminated by `operation`. All items in a single call must
        pass validation — the route validates everything before any
        write, so a single bad item aborts the whole batch.
      operationId: bulkTypedDocumentsOp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkTypedDocumentsRequest' }
      responses:
        '200':
          description: Bulk update or delete result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkTypedDocumentsResponse' }
        '201':
          description: Bulk create result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkTypedDocumentsResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /typed-documents/bulk-import:
    post:
      tags: [typed-documents]
      summary: Bulk-import typed documents from a CSV file
      description: |
        Accepts a CSV upload (multipart/form-data, field name `file`,
        max 5 MiB, max 10000 rows). Column headers are matched against
        field IDs OR field names on the target type; unknown columns
        are skipped silently. Multi-value (`cardinality=unlimited`)
        cells are split on `;`. Returns per-row errors so the
        frontend can rebuild a CSV of the failed rows for re-upload.
      operationId: bulkImportTypedDocuments
      parameters:
        - in: query
          name: typeId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV file.
      responses:
        '200':
          description: Import result (may include per-row errors)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkImportResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Target DocumentType not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Cognito ID token validated by `middleware/auth.ts`. Will swap to
        the identity-server OIDC issuer in the auth migration.

  parameters:
    TypeIdPath:
      in: path
      name: typeId
      required: true
      schema: { type: string }
      description: Document-type identifier (UUID minted at create time).

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }

  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error: { type: string, description: 'Machine-readable error code.' }
        message: { type: string }

    DocumentTypeFieldKind:
      type: string
      enum: [text, long_text, number, date, boolean, enum, reference]

    DocumentTypeFieldWidget:
      type: string
      enum: [text_field, textarea, number_input, date_picker, checkbox, select, reference_picker]

    DocumentTypeFieldCardinality:
      description: '`1` for a single value, `"unlimited"` for an array.'
      oneOf:
        - type: integer
          enum: [1]
        - type: string
          enum: [unlimited]

    DocumentTypeFieldValidation:
      type: object
      description: |
        Numeric fields use min/max for value range; text fields use them
        for length. `regex` is text/long_text only; `requireTrue` is
        boolean only.
      properties:
        min: { type: number }
        max: { type: number }
        regex: { type: string }
        requireTrue: { type: boolean }

    DocumentTypeFieldShowWhen:
      type: object
      required: [fieldId, equals]
      properties:
        fieldId:
          type: string
          description: Source field's fieldId on the same type.
        equals:
          description: Value the source field must equal for this field to be visible.
          oneOf:
            - { type: string }
            - { type: number }
            - { type: boolean }

    DocumentTypeFieldDisplayModes:
      type: object
      description: 'Per-context visibility. Default when absent: visible in `full` only.'
      properties:
        full: { type: boolean }
        teaser: { type: boolean }
        list: { type: boolean }

    DocumentTypeFieldItem:
      type: object
      required: [fieldId, name, fieldType, widget, cardinality, required, helpText]
      properties:
        fieldId:
          type: string
          description: Server-minted UUID (caller-supplied IDs respected).
        name: { type: string, minLength: 1 }
        fieldType: { $ref: '#/components/schemas/DocumentTypeFieldKind' }
        widget: { $ref: '#/components/schemas/DocumentTypeFieldWidget' }
        cardinality: { $ref: '#/components/schemas/DocumentTypeFieldCardinality' }
        required: { type: boolean }
        helpText: { type: string }
        options:
          type: array
          items: { type: string, minLength: 1 }
          description: Required when `fieldType=enum`.
        referenceTypeId:
          type: string
          description: Required when `fieldType=reference` — target DocumentType.
        validation: { $ref: '#/components/schemas/DocumentTypeFieldValidation' }
        showWhen: { $ref: '#/components/schemas/DocumentTypeFieldShowWhen' }
        displayModes: { $ref: '#/components/schemas/DocumentTypeFieldDisplayModes' }

    DocumentTypeItem:
      type: object
      required: [typeId, name, description, icon, fields, createdBy, createdAt, updatedAt]
      properties:
        typeId: { type: string }
        name: { type: string, minLength: 1 }
        description: { type: string }
        icon: { type: string, description: 'Emoji or short marker. Defaults to "📄".' }
        fields:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/DocumentTypeFieldItem' }
        createdBy:
          type: string
          description: Cognito sub of the creating user.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version:
          type: integer
          minimum: 1
          description: 'Schema version; bumped on fields[] replace.'
        previousVersions:
          type: array
          items: { $ref: '#/components/schemas/DocumentTypeVersionSnapshot' }

    DocumentTypeVersionSnapshot:
      type: object
      required: [version, name, description, icon, fields, updatedAt]
      properties:
        version: { type: integer, minimum: 1 }
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        fields:
          type: array
          items: { $ref: '#/components/schemas/DocumentTypeFieldItem' }
        updatedAt: { type: string, format: date-time }

    # Shared upsert body for POST + PUT /document-types. PUT semantics:
    # any field may be omitted (partial). POST semantics: `name` is
    # effectively required.
    DocumentTypeUpsertRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        icon: { type: string }
        fields:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/DocumentTypeFieldItem' }

    # --- typed documents ----------------------------------------------
    TypedDocumentValue:
      description: |
        Value stored in `TypedDocumentItem.values[fieldId]`. The route
        layer validates each value against the field's `fieldType` and
        `cardinality` (`unlimited` ⇒ array variant).
      oneOf:
        - { type: string }
        - { type: array, items: { type: string } }
        - { type: number }
        - { type: array, items: { type: number } }
        - { type: boolean }

    TypedDocumentItem:
      type: object
      required: [documentId, typeId, values, createdBy, createdAt, updatedAt]
      properties:
        documentId: { type: string, format: uuid }
        typeId:
          type: string
          description: References the DocumentType this instance conforms to.
        values:
          type: object
          description: Map of fieldId → TypedDocumentValue.
          additionalProperties: { $ref: '#/components/schemas/TypedDocumentValue' }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateTypedDocumentRequest:
      type: object
      required: [typeId]
      properties:
        typeId: { type: string }
        values:
          type: object
          additionalProperties: { $ref: '#/components/schemas/TypedDocumentValue' }

    # PATCH accepts either { values: {...} } or { field, value } shorthand.
    UpdateTypedDocumentRequest:
      oneOf:
        - type: object
          required: [values]
          properties:
            values:
              type: object
              additionalProperties: { $ref: '#/components/schemas/TypedDocumentValue' }
        - type: object
          required: [field, value]
          properties:
            field: { type: string, description: fieldId of the value to update. }
            value: { $ref: '#/components/schemas/TypedDocumentValue' }

    # Discriminated union — `operation` selects which fields are required.
    BulkTypedDocumentsRequest:
      type: object
      required: [operation]
      properties:
        operation:
          type: string
          enum: [create, update, delete]
        typeId:
          type: string
          description: Required when `operation=create`.
        items:
          type: array
          maxItems: 100
          description: |
            Required when `operation=create`. Each entry is the `values`
            object (fieldId → TypedDocumentValue map).
          items:
            type: object
            additionalProperties: { $ref: '#/components/schemas/TypedDocumentValue' }
        updates:
          type: array
          maxItems: 100
          description: Required when `operation=update`.
          items:
            type: object
            required: [documentId, values]
            properties:
              documentId: { type: string }
              values:
                type: object
                additionalProperties: { $ref: '#/components/schemas/TypedDocumentValue' }
        documentIds:
          type: array
          maxItems: 100
          description: Required when `operation=delete`.
          items: { type: string }

    BulkTypedDocumentsResponse:
      type: object
      description: Exactly one of `created`, `updated`, or `deleted` is set.
      properties:
        created: { type: integer }
        updated: { type: integer }
        deleted: { type: integer }

    BulkImportError:
      type: object
      required: [row, reason, rawRow]
      properties:
        row:
          type: integer
          description: 1-based CSV row number (header is row 1).
        reason: { type: string }
        rawRow:
          type: object
          additionalProperties: { type: string }
          description: Original CSV row as a column → string map.

    BulkImportResponse:
      type: object
      required: [imported, failed, columns, errors]
      properties:
        imported: { type: integer }
        failed: { type: integer }
        columns:
          type: array
          items: { type: string }
          description: Original CSV column order (for failed-row CSV rebuild).
        errors:
          type: array
          items: { $ref: '#/components/schemas/BulkImportError' }
